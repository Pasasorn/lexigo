<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f4f6f9;color:#28323e;
  display:flex;min-height:100vh}
#side{width:272px;flex:none;background:#1f3b57;color:#fff;overflow:auto;position:sticky;top:0;height:100vh}
#side h1{margin:0;padding:16px 18px 6px;font-size:17px}
#side p{margin:0;padding:0 18px 12px;font-size:12px;opacity:.75}
#side input{width:calc(100% - 24px);margin:0 12px 10px;padding:8px 11px;border:0;border-radius:8px;font-size:13px}
#side .g{font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.6;
  padding:12px 18px 5px;font-weight:700}
#side a{display:block;padding:7px 18px;color:#dce6f2;text-decoration:none;font-size:13.2px;line-height:1.45;
  border-left:3px solid transparent}
#side a:hover{background:rgba(255,255,255,.08)}
#side a.on{background:rgba(255,255,255,.15);border-left-color:#7fd1ff;color:#fff;font-weight:700}
#main{flex:1;min-width:0;overflow:auto}
#bar{display:none}
article{max-width:860px;margin:0 auto;padding:26px 30px 70px;line-height:1.8}
article h1{font-size:25px;margin:0 0 14px;padding-bottom:9px;border-bottom:2px solid #dde3ea}
article h2{font-size:20px;margin:30px 0 11px;padding-bottom:6px;border-bottom:1px solid #e6eaf0}
article h3{font-size:16.5px;margin:22px 0 8px}
article p{margin:0 0 12px}
article ul,article ol{margin:0 0 13px;padding-left:24px}
article li{margin-bottom:5px}
article code{background:#eef3f8;padding:2px 6px;border-radius:5px;font-size:13px;
  font-family:Consolas,Monaco,monospace;word-break:break-word}
article pre{background:#1f2a37;color:#e6edf3;padding:13px 16px;border-radius:10px;overflow:auto;
  font-size:13px;line-height:1.65;margin:0 0 14px}
article pre code{background:none;color:inherit;padding:0;font-size:13px}
article table{border-collapse:collapse;width:100%;margin:0 0 15px;font-size:14px;
  background:#fff;border:1px solid #dde3ea;border-radius:9px;overflow:hidden}
article th,article td{padding:8px 11px;border-bottom:1px solid #eef1f5;text-align:left;vertical-align:top}
article th{background:#f7f9fc;font-weight:700;font-size:12.5px}
article tr:last-child td{border-bottom:0}
article blockquote{margin:0 0 14px;padding:10px 15px;background:#fff8e6;border-left:4px solid #f0ad4e;
  border-radius:0 8px 8px 0}
article blockquote p:last-child{margin:0}
article hr{border:0;border-top:1px solid #dde3ea;margin:26px 0}
article a{color:#1f6feb}
article strong{color:#14204a}
mark{background:#fde68a}
@media print{#side{display:none}body{display:block}article{max-width:none}}
@media(max-width:820px){
  body{display:block}
  #side{position:static;width:auto;height:auto;max-height:46vh}
  article{padding:18px 16px 60px}
}
</style></head><body>

\n| Apps Script API | `https://script.google.com/macros/s/AKfycbz8SuCV8PsUkIElDN3rFm9eE1TKm0UOFS5M_u6TrHmxkslAOQuopYmv3IFM0JBoRYq-/exec` |\n| GitHub Repo | https://github.com/Pasasorn/peekaword |\n| GitHub Pages Settings | https://github.com/Pasasorn/peekaword/settings/pages |\n", "AUDIT_ALL_LEVELS": "# 🧪 ผลตรวจทั้งระบบ · Level 1–15 ครบ 448 วัน\n\nตรวจ 2026-10-02 · วิธีตรวจ 2 ชั้น\n1. **กวาดไฟล์ทั้งหมด 448 ไฟล์** ด้วย `_docs/audit_all.py`\n2. **เปิดจริงบนเว็บ** `peekaword.pages.dev` จอ 375×812 (iPhone) — โหลดหน้าจริง 20 วัน\n   ครอบคลุมทั้ง 15 Level (วันแรก / วันกลาง / วันทบทวน ของแต่ละ Level) แล้วสั่งเดินครบ 5 ขั้น\n\n---\n\n# 🔴 ต้องแก้ก่อนเปิดขาย\n\n## 1. Backend ยังเป็น **v4** ไม่ใช่ v6 ← ร้ายแรงที่สุด\n\nยิงตรวจแล้วได้:\n\n```json\n{\"status\":\"ok\",\"version\":\"v4\",\"deployed\":\"2026-08-15\",\n \"features\":[\"completion-regex\",\"score-percent\",\"email-password\",\"slip-verify\"]}\n```\n\n**ผลที่ตามมาตอนนี้ บนเว็บจริง:**\n\n| สิ่งที่พัง | ความเสียหาย |\n|---|---|\n| คะแนนรายทักษะ (`sk_read`/`sk_speak`/`sk_write`) **ไม่ถูกบันทึกเลย** | จุดขายหลักที่โฆษณาไว้ใช้ไม่ได้ · หน้า `report.html` และ `teacher.html` จะว่าง |\n| ชื่อ/อีเมล/เบอร์ ตอนลูกค้าจ่ายเงิน **ไม่ถูกบันทึก** | **ขายได้แต่ติดต่อลูกค้ากลับไม่ได้** |\n\n**แก้:** ทำตาม `DEPLOY_v5.md` ขั้นที่ 2 → **Manage deployments → ✏️ → Version: New version → Deploy**\n(จุดที่พลาดบ่อย: กด Deploy แล้วแต่ลืมสลับ dropdown เป็น New version)\nตรวจซ้ำ: `?action=version` ต้องได้ `\"v6\"` + `\"skill-sync\"`\n\n## 2. ภาพประกอบเรื่องหาย **385 วัน**\n\n`img/img_dayN.png` มีจริงแค่ **3 ไฟล์** จาก 388 วันเรียน\nระบบซ่อนกรอบให้อัตโนมัติ ไม่มีไอคอนรูปแตก — แต่หน้าก็โล่ง\n\nเจอ bug ซ้อน: **298 วันเขียน path ผิด** เป็น `src=\"img_day136.png\"` (ขาด `../img/`)\n→ ต่อให้ใส่ไฟล์เข้าไปก็ยังไม่ขึ้น · **แก้ให้แล้วทั้ง 298 ไฟล์**\n\n---\n\n# 🟠 แก้ให้แล้วรอบนี้\n\n## 3. ป้าย Step 2 ซ้ำกับ Step 3 — 375 วัน ✅ แก้แล้ว\n\n```\nเดิม  Step 2 · Read + Speak 📖      ← ซ้ำ\n      Step 3 · Read + Speak 🗣️     ← ซ้ำ\nใหม่  Step 2 · Read + Listen 📖\n      Step 3 · Read + Speak 🗣️\n```\n\nผิดหลักสูตรด้วย — ขั้นที่ 2 คือ *อ่าน+ฟัง* ขั้นที่ 3 ถึงจะ *อ่าน+พูด*\nเด็กเห็นป้ายเดียวกัน 2 หน้าติด จะไม่รู้ว่าต้องทำอะไรต่างกัน\n\n## 4. ป้าย Step 4 บอกผิดว่าให้เขียน — 388 วัน ✅ แก้แล้ว\n\nกิจกรรมจริงคือ **กดคำเรียงประโยค** ไม่มีการสะกดคำเลย\n`Step 4 · Listen + Write ✏️` → **`Step 4 · Listen + Order 🔤`**\n\n(หน้ารายงาน/ครู/หน้าแรก แก้ไปแล้วรอบก่อน ตอนนี้ตรงกันทั้งระบบ)\n\n## 5. คำสั่ง Step 1 เป็นภาษาอังกฤษ — 441 วัน ✅ แก้แล้ว\n\nเด็ก 5–12 ปีอ่าน *\"Close your eyes and just listen!\"* ไม่ออก\n→ **\"ฟังให้จบก่อน ยังไม่ต้องดูตัวหนังสือ\"**\n\n(มีแค่ 7 วันแรกที่เป็นไทย อีก 441 วันเป็นอังกฤษหมด)\n\n## 6. ชื่อวันทบทวนบอกสัปดาห์ผิด — 40 วัน ✅ แก้แล้ว\n\n`Day 37 — Week 5 Review` ทั้งที่ Day 37 คือ **Week 6**\nคลาดไปเรื่อย ๆ จนถึง `Day 448 — Week 64` (ที่จริงคือ Week 64 พอดี แต่ชื่อธีมผิด)\n\n---\n\n# 🟡 ยังค้าง ต้องตัดสินใจ\n\n## 7. Step 1 ไม่มีอะไรให้ทำ — 433 วัน\n\nตอนนี้ Step 1 มีแค่: ปุ่ม ▶ Play · ปุ่ม ■ Stop · กรอบรูปที่ว่าง · ปุ่ม Next\n**มีคำถาม 💬 Think แค่ 15 วันแรกเท่านั้น** อีก 373 วันคำถามไปอยู่ Step 2 หมด\n\nเด็กกด Play ฟัง 30 วินาที แล้วก็... ไม่มีอะไรวัดว่าฟังรู้เรื่องไหม\n**นี่คือช่องว่างที่ใหญ่ที่สุดที่เหลือ** — ขั้นที่ 1 เป็นหัวใจของระบบ (ฟังก่อนเห็นตัวหนังสือ)\n\n**ทางเลือก**\n\n| วิธี | ผล | แรง |\n|---|---|---|\n| เขียนคำถาม Think + เฉลย ให้ครบ 373 วัน | ดีที่สุด แต่ต้องอ่านเรื่องทีละวัน | ผมทำได้ ขอทยอยเป็นช่วง |\n| ย้ายคำถามจาก Step 2 มาไว้ Step 1 แทน | เร็ว ทำอัตโนมัติได้ทันที | 10 นาที — แต่ Step 2 จะเหลือแค่อ่าน |\n| ใส่คำถามกลาง ๆ แบบเดียวกันทุกวัน | เร็วสุด แต่ไม่ช่วยอะไรจริง | ไม่แนะนำ |\n\n## 8. ไม่มี analytics เลยทั้งเว็บ\n\nตรวจแล้วทั้ง 7 หน้าหลัก **ไม่มี** gtag / Cloudflare Insights / Plausible\nยิงโฆษณาไปก็ไม่รู้ว่าคนหลุดตรงไหน — Cloudflare Web Analytics ติดบรรทัดเดียว ฟรี\n\n## 9. ไม่มี `manifest.json`\n\nตรวจแล้วไม่มีทุกหน้า → ชวนผู้ใช้ iPhone *\"เพิ่มลงหน้าจอโฮม\"* ไม่ได้\nซึ่งเป็นทางเดียวที่ฟรีและกัน **กฎ 7 วันของ Safari** ที่จะลบความคืบหน้าทิ้ง (ดู `DATA_PERSISTENCE.md`)\n\n## 10. ระยะห่างวันทบทวนไม่สม่ำเสมอที่ Level 7\n\nปกติทุก 7 วัน แต่ช่วง **Day 201 → 207 → 217** เป็น 6 แล้ว 10\n(ส่วนช่วงรอยต่อ Level ที่เป็น 9 วัน เกิดเป็นระบบทุก Level ถือว่าตั้งใจ ไม่นับเป็นปัญหา)\n\n---\n\n# ✅ ผ่านหมด ไม่มีปัญหา\n\nทดสอบบนเว็บจริง 20 วัน ครอบคลุมทั้ง 15 Level:\n\n- **ไม่มี JavaScript error สักหน้าเดียว**\n- **ไม่มีจอล้นแนวนอน** ทุกหน้าพอดี 375px\n- สั่ง `go(0)` → `go(5)` เดินครบ 5 ขั้นได้ทุกไฟล์ ไม่มีหน้าที่เปิดไม่ติด\n- `pwPic` · `pwCollect` โหลดครบทุกหน้า\n- `pic.js` · `report.js` · `protect.js` ฝังครบ 448/448\n- หน้าหลักทั้ง 7 หน้าตอบ **HTTP 200** ทั้งหมด\n\nตรวจเนื้อหาจากไฟล์ทั้ง 448:\n\n- ครบ Day 1–448 ไม่ขาดวัน · วันเรียน 388 + วันทบทวน 60\n- ทุกวันเรียนมีครบ 6 หน้า (p0–p5) · วันทบทวนมี 9 หน้า (เกม 7 แบบ)\n- **ไม่มีคำซ้ำในวันเดียวกัน · ไม่มี emoji ซ้ำในวันเดียวกัน**\n- คำแปลไทย / IPA / emoji ครบทุกคำ\n- **ลิงก์วันถัดไปไม่มี 404** (ตรวจแบบ case-sensitive เหมือน Cloudflare)\n- **JS ผ่าน `node --check` ทั้ง 448 ไฟล์** หลังแก้\n\n---\n\n# 📋 ลำดับที่ควรทำ\n\n| # | เรื่อง | ผลกระทบ | แรง |\n|---|---|---|---|\n| 1 | **Deploy Code.gs ให้เป็น v6** | 🔴 สูงสุด | 5 นาที |\n| 2 | **push โค้ดที่แก้วันนี้** (1,100+ จุดใน 448 ไฟล์) | สูง | 1 นาที |\n| 3 | ทดสอบซื้อจริง 1 บาทให้ครบ flow | 🔴 สูง | 10 นาที |\n| 4 | ติด Cloudflare Web Analytics | สูง | 15 นาที |\n| 5 | ตัดสินใจเรื่อง **Step 1** (ข้อ 7) | สูง | แล้วแต่ทาง |\n| 6 | ภาพประกอบเรื่อง Day 1–7 ก่อน | สูง | ครึ่งวัน |\n| 7 | `manifest.json` + ชวนเพิ่มลงหน้าจอโฮม | กลาง | 30 นาที |\n| 8 | จัดระยะวันทบทวน Level 7 | ต่ำ | 20 นาที |\n\n---\n\n## ข้อจำกัดของการทดสอบรอบนี้\n\n- **ไมโครโฟนถูกบล็อกในเบราว์เซอร์ที่ใช้ทดสอบ** → Step 3 (พูดตาม) ตรวจได้แค่ว่าโค้ดโหลดและหน้าเปิดได้\n  **ยังไม่ได้ยืนยันว่าการให้คะแนนการออกเสียงทำงานจริง** — ต้องให้คนจริงลองบนมือถือจริง\n- ทดสอบ 20 วันจาก 448 บนเว็บจริง · อีก 428 วันตรวจจากไฟล์\n\n**สำรองไฟล์เดิม:** `/tmp/bk/` (Level 1, 7, 15)\n\n---\n\n# 🔴🔴 เพิ่มเติม 2026-10-05 — บั๊กร้ายแรงที่สุด พบและแก้แล้ว\n\n## หน้าเรียนว่างเปล่าเกือบทุกวัน — `pwPic is not defined`\n\n**อาการ:** เปิด Day ไหนก็ได้ → เห็นแค่ชื่อเรื่องกับปุ่ม \"Let's Start!\"\n**ไม่มีการ์ดคำศัพท์ ไม่มีจุดบอกขั้นตอน ไม่มีอะไรเลย**\n\n**สาเหตุ:** ตอนฝัง `js/pic.js` เข้า 448 ไฟล์ ผมวาง `<script src=\"../js/pic.js\">`\nไว้ที่**ท้าย `<body>`** แต่โค้ดในหน้าเรียก `pwPic()` ตั้งแต่ตอนโหลด (`checkLock()` → `initContent()`)\nซึ่งรัน**ก่อน** `pic.js` จะถูกโหลด\n\n```\nUncaught ReferenceError: pwPic is not defined\n```\n\nพอ throw ตรงนั้น `initContent()` ก็หยุดทั้งก้อน → การ์ด จุด และทุกอย่างที่สร้างต่อจากนั้นไม่เกิดขึ้น\n\n**ขอบเขต:** ทดสอบจริงบนเว็บ Day 1 · 3 · 31 · 121 · 421 — **พังทุกวันที่ทดสอบ ทุก Level**\nมีเพียงไฟล์กลุ่ม Day 15–20 ที่รอดเพราะเรียกใน `DOMContentLoaded`\n(นี่คือเหตุผลที่ Day 16 แสดงผลปกติ แต่วันอื่นว่าง)\n\n**แก้แล้ว:** ย้าย `<script src=\"../js/pic.js\">` ขึ้นไปใน `<head>` ทั้ง **448 ไฟล์**\nตรวจยืนยัน: pic.js อยู่ใน `<head>` และมาก่อนทุกจุดที่อ้าง `pwPic` — **448/448**\n\n**พิสูจน์ว่าแก้ได้จริง** (ดึงหน้าจากเว็บจริงมาแก้แบบเดียวกันแล้วรันเทียบ):\n\n| Day | ก่อนแก้ | หลังแก้ |\n|---|---|---|\n| 1 | 0 การ์ด | 6 ✅ |\n| 3 | 0 การ์ด | 6 ✅ |\n| 31 | 0 การ์ด | 6 ✅ |\n| 121 | 0 การ์ด | 7 ✅ |\n| 421 | 0 การ์ด | 9 ✅ |\n\n## ทำไมรอบตรวจที่แล้วไม่เจอ\n\nตอนนั้นผมดัก `window.addEventListener('error')` **หลังหน้าโหลดเสร็จ** — error เกิดไปแล้วตั้งแต่ก่อนหน้านั้น\nจึงรายงานว่า `errs: []` ทั้งที่หน้าพังอยู่ และผมดูแค่ว่า `pwPic` เป็น function ไหม (เป็น เพราะโหลดเสร็จแล้ว)\n**บทเรียน: ต้องดักerror ตั้งแต่ก่อน script แรกของหน้า ไม่ใช่หลังโหลด**\n\n**ต้อง push ด่วน** — ตอนนี้เว็บจริงยังพังอยู่ทุกวันยกเว้น Day 15–20\n", "AUDIT_REPORT": "# 🔍 PeekaWord — รายงานตรวจสอบโดยผู้เชี่ยวชาญ\n\n> 4 ผู้เชี่ยวชาญอิสระ · 5 รอบตรวจ · ทุก finding พิสูจน์ด้วยการรันจริง ไม่ใช่การอ่านโค้ด\n\n---\n\n## ผู้ตรวจ\n\n| ผู้ตรวจ | ขอบเขต |\n|---------|--------|\n| ครูสอนอังกฤษเด็กไทย | ไวยากรณ์ · ความเป็นธรรมชาติ · ระดับ CEFR · ความก้าวหน้าของความยาก |\n| QA engineer | เฉลยแบบฝึกหัดทุกข้อ · ตรรกะเกม 5 แบบ · การให้คะแนน |\n| บรรณาธิการภาษาไทย | คำแปล 588 คำ · IPA · emoji · ข้อความ UI 1,247 สตริง |\n| Front-end QA | flow การเล่นจริง · ระบบล็อก · การบันทึกความคืบหน้า |\n\n---\n\n## 🔴 บั๊กร้ายแรงที่เจอ (ทั้งหมดแก้แล้ว)\n\n### 1. ความคืบหน้า 95 จาก 104 วันไม่เคยบันทึกขึ้นเซิร์ฟเวอร์เลย\n\n`Code.gs` ตรวจว่ารหัสจบวันต้องยาว 7 ตัวพอดี แต่รหัสจริงยาวไม่เท่ากัน:\n\n| วัน | รหัส | ความยาว | ผลเดิม |\n|-----|------|---------|--------|\n| 1–9 | `D1-AB12` | 7 | ✅ ผ่าน |\n| 10–99 | `D10-AB12` | 8 | ❌ ถูกปฏิเสธ |\n| 100+ | `D104-AB12` | 9 | ❌ ถูกปฏิเสธ |\n\nเด็กเห็นหน้าจอ \"ผ่านแล้ว!\" สีเขียวทุกครั้ง แต่ข้อมูลไม่ถึงเซิร์ฟเวอร์\n→ เปลี่ยนเครื่อง = ความคืบหน้าหายทั้งหมด และ leaderboard ไม่มีข้อมูล\n\n**แก้:** เช็กด้วย pattern `^D{วัน}-[A-Z0-9]{4}$` แทนความยาวตายตัว — ทดสอบ 448/448 วันผ่าน, รหัสปลอม 5 แบบถูกปฏิเสธครบ\n\n### 2. login ครั้งแรกลบความคืบหน้าทิ้งทั้งหมด\n\n`login.html` ล้าง `wla_d1..448` เมื่อ `wla_last_code !== code` — แต่คีย์นั้นถูกเขียนตอน login สำเร็จเท่านั้น จึงเป็น `null` เสมอในการ login ครั้งแรก\n→ เด็กที่ทดลองเรียนไว้ 30 วันก่อนพ่อแม่สมัคร **เสียทั้ง 30 วัน** และกู้คืนไม่ได้เพราะบั๊กข้อ 1\n\n**แก้:** ล้างเฉพาะเมื่อ `prevCode` มีค่าจริงและต่างจากรหัสใหม่ (= สลับบัญชีจริงๆ)\n\n### 3. รหัสปลดล็อกที่ถูกต้องถูกปฏิเสธ 7 วัน\n\nDay 14/21/28 เช็กความยาว 7 กับรหัส 8 ตัว · Day 101–103 เช็ก 8 กับรหัส 9 ตัว · Day 15 อ่าน `#lockInput` ที่ไม่มีใน HTML\n→ เด็กที่เปลี่ยนเครื่องมาถึงวันนั้นแล้วไปต่อไม่ได้ ทั้งที่กรอกรหัสถูก\n\n**แก้:** เช็ก pattern เหมือนข้อ 1 ทั้ง 104 วัน + คืน `ADMIN-0000` ให้ 6 ไฟล์ที่หายไป\n\n### 4. Day 15 แสดง 3 จาก 5 ขั้นตอนเป็นหน้าว่าง\n\nเรียก `buildCards('acgrid')` แต่ HTML ประกาศ `id=\"cvA\"` และเรียก `buildDL()` ที่ไม่มีนิยาม → JS ตายกลางคัน ทำให้ `buildWM`/`buildSL`/`buildS4` ไม่ทำงาน\n→ **หลักสูตรหยุดที่ Day 15** ลูกค้าที่ซื้อ Level 1–4 เข้าถึงได้แค่ 15 จาก 104 วัน\n\n**แก้:** แก้ id ให้ตรง · ลบ `buildDL()` · เพิ่ม `buildS4()` · เพิ่มปุ่ม Finish\n\n### 5. `speakFb` ถูกเรียกแต่ไม่มีนิยาม — 72 ไฟล์ (Day 22–103)\n\nเสียงชม \"Correct!/Try again!\" ทำให้ JS พังตรงจุดตรวจคำตอบ Step 2 โค้ดหลังจากนั้นไม่ทำงาน\n\n### 6. เกมตัดสินคำตอบที่ถูกว่าผิด\n\n| เกม | ปัญหา | ความถี่ที่วัดได้ |\n|-----|-------|-----------------|\n| Whack-a-Word | คำเป้าหมายโผล่ 2 หลุม กดหลุมแรกได้ 0 คะแนน | 683/7,000 รอบ · เจอใน 72% ของการเล่น |\n| Speed Quiz | 👨‍🍳 มีทั้ง baker และ chef เป็นตัวเลือก กด chef = ผิด | 433/30,000 ข้อ |\n| Word Search | MAN อยู่ใน WOMAN — ลาก MAN ถูกแต่ไม่นับ | 387/400 ตาราง |\n\n**แก้แล้วทดสอบซ้ำ:** 20,000 รอบ ไม่มีคำซ้ำเลย · 951,500 การลาก ไม่มีการรับคำผิด\n\n### 7. ระบบคะแนนกลับด้าน — คนไม่ทำอะไรได้แต้มสูงกว่าคนตั้งใจ\n\n`score = score || 100` ทำให้ค่า `0` (ไม่ทำแบบฝึกหัดเลย) กลายเป็น **100 คะแนนเต็ม**\nรันจริงตลอด 30 วัน: เด็กกดข้ามได้ **53,040 แต้ม** · เด็กตั้งใจได้ **15,350 แต้ม**\n\nซ้ำร้าย คะแนนแต่ละวันคนละสเกล (0, 4, 6, 7, 60, 100, 255+) → **87% ของแต้มทั้งหมดมาจาก 8 วันจาก 30 วัน**\nleaderboard วัดว่า \"ทำวันไหน\" ไม่ใช่ \"ทำได้ดีแค่ไหน\" — ปัญหาใหญ่มากสำหรับระบบที่มีการแข่งขันชิงรางวัล\n\n**แก้:** ทุกวันส่งเป็นเปอร์เซ็นต์ 0–100 เหมือนกันหมด · แต้ม = 10 (เข้าเรียน) + 50 × เปอร์เซ็นต์ = **สูงสุด 60/วัน เท่ากันทุกวัน**\n\n| | เดิม | ใหม่ |\n|---|---|---|\n| ไม่ทำอะไรเลย 30 วัน | 53,040 | 300 |\n| ทำเต็มทุกวัน 30 วัน | 53,040 | 1,800 |\n\n---\n\n## 🟡 ที่แก้เพิ่มเติม\n\n- **ปุ่ม Finish เป็น latch** — กดจบแล้วกลับไปทำเพิ่ม คะแนนที่ทำได้หายทั้งหมด → sync ทุกครั้ง + backend อัปเดตให้ถ้าคะแนนดีขึ้น\n- **72 วันแจกคะแนนฟรี 3 ข้อ** (`updScore(ok+3,6)`) ตอบผิดหมดยังได้ 25 แต้ม\n- **Step 3 พูดตามให้ฟรี 2 คะแนน + เพดาน 4/6** พูดมั่วก็ได้คะแนน พูดเต็มก็ไม่ได้เต็ม\n- **72 วันไม่มีปุ่มจบวัน** จบได้ทางเดียวคือชนะเกม\n- **ลิงก์ข้าม Level เสีย** Day 60/90/97 ชี้ไฟล์ที่ไม่มีจริง\n- **ป้ายปุ่มเขียน \"Day 62\" 12 ไฟล์** ตกค้างจาก template\n- **เลข Week ผิด** Day 97/104 เขียน Week 17/18 ควรเป็น 13/14\n- **ไวยากรณ์ 8 จุด** `Leo teacher` · `white tooth` · `nine o clock` · `Lets count` · `a warm soup` · `moved apart from`\n- **ไม้ยมกเขียนติดคำ 135 จุด ใน 107 ไฟล์**\n- **คำแปล/emoji ผิด 5 จุด** — desk ใช้ 🪑 (เก้าอี้) · chair ใช้ 💺 (เบาะเครื่องบิน) · napkin ใช้ 🧻 (กระดาษชำระ) · listener แปล \"ผู้ฟังที่ดี\" · loyal ชนกับ honest\n- **คำศัพท์ 3 คำไม่ปรากฏในเรื่อง** head (D31) · wear (D40) · shop (D52)\n- **apostrophe ทำให้ปุ่ม ▶ ตาย 6 วัน** — `speak('Leo's ...')` เป็น SyntaxError\n- **path รูปผิดทั้งระบบ** อ้าง `img_dayN.png` แต่ไฟล์อยู่คนละโฟลเดอร์ → รูปไม่เคยขึ้นเลยแม้แต่รูปเดียว\n\n---\n\n## ⚠️ ข้อผิดพลาดที่การแก้ของผมเองสร้างขึ้น\n\nโปร่งใสไว้เพราะมีผลต่อการตัดสินใจว่าจะเชื่อรอบต่อไปแค่ไหน:\n\n| รอบ | ผมทำอะไรพัง | เจอโดย | สถานะ |\n|-----|-------------|--------|-------|\n| 2 | Day 93/99 ใส่ `g5found` ในเกมที่ไม่มีตัวแปรนั้น → พังตอนจบวัน | รอบ 2 | แก้แล้ว |\n| 2 | เปลี่ยน `\\|\\|100` เป็น 0 แต่ลืมอีก 2 จุด → คะแนนกลับด้าน | รอบ 3 | แก้แล้ว |\n| 3 | ใส่ apostrophe `nine o'clock` ทำให้ JS พัง | ตัวเอง | แก้แล้ว |\n| 3 | Day 15 ลบ `buildDL()` แต่ควรชี้ไป `buildS4()` | รอบ 4 | แก้แล้ว |\n| 5 | regex เขียนทับหัวฟังก์ชัน `syncToCloud` + วงเล็บเกิน **104 ไฟล์** | ตัวเอง | แก้แล้ว |\n\n**บทเรียน:** รอบแก้แต่ละรอบสร้างบั๊กใหม่จริง การตรวจ 5 รอบไม่ใช่ความเยิ่นเย้อ\n\n---\n\n## ✅ สถานะสุดท้าย\n\n| การตรวจ | ผล |\n|---------|-----|\n| JS syntax (111 ไฟล์ + Code.gs) | ผ่านทั้งหมด |\n| ฟังก์ชันเรียกแต่ไม่มีนิยาม | ไม่มี |\n| ลิงก์วันถัดไป | ครบทุกวัน |\n| ป้ายปุ่มตรงกับลิงก์ | ตรงทุกจุด |\n| คำศัพท์ 557 คำปรากฏในเรื่อง | ครบทุกคำ |\n| ทุกวันมีทางจบวัน | 104/104 |\n| unlock เช็ครัดกุม | 104/104 |\n| คะแนนสเกลเดียวกัน | 104/104 |\n| ไม้ยมก | ถูกหลักทุกจุด |\n\n**ตัวเลขจากการรันจริง:** ตอบถูกถูกตัดสินว่าผิด **0** จาก 696 ข้อ · ตอบผิดถูกตัดสินว่าถูก **0** · เด็กจบวันไม่ได้ **0** จาก 104 วัน\n\n---\n\n## 📖 คำอ่าน IPA — จัดใหม่ทั้งระบบ\n\n**IPA (International Phonetic Alphabet)** = สัทอักษรสากล บอกวิธีออกเสียงจริงซึ่งเดาจากตัวสะกดไม่ได้\nเช่น `tooth` ไม่ใช่ \"ทู-ท\" แต่เป็น `/tuːθ/` — `θ` คือเสียงเอาลิ้นแตะฟันที่ภาษาไทยไม่มี\n\n**ที่เจอ:**\n\n| ปัญหา | จำนวน |\n|-------|-------|\n| Day 3, 4, 6, 10, 11, 13 ไม่มีคำอ่านเลย | 36 คำ |\n| ไม่ใช่ IPA เป็นการถอดเสียงมั่ว `/faem-uh-lee/` `/smawl/` `/ty-dee/` | 11 คำ |\n| สัญลักษณ์อเมริกันปน `/hoʊm/` `/bɛd/` ทั้งที่วันอื่นเป็น British | 4 คำ |\n| คำเดียวกันอ่านต่างกันคนละวัน — big, small, door, window, chair, help, table | 7 คำ |\n| convention `(r)` ท้ายคำไม่สม่ำเสมอ (11 คำใช้ · 44 คำไม่ใช้) | 39 คำ |\n| ไม่มี emoji | 78 คำ |\n| emoji ซ้ำในวันเดียวกัน (ทำให้เกมจับคู่กำกวม) | 3 จุด |\n\n**แก้แล้ว: ทั้งระบบเป็น British RP (Oxford) แบบเดียวกันทุกคำ**\n\nตรวจ **510 คำ** ผ่าน 12 เกณฑ์:\nคำแปลไทยครบ · IPA ครบ · emoji ครบ · ไม่มี respelling · ไม่มีสัญลักษณ์อเมริกันปน ·\nรูปแบบ `//` ครบ · `(r)` สม่ำเสมอ · คำเดียวกันอ่านตรงกันทุกวัน · emoji ไม่ซ้ำในวัน ·\nคำแปลไม่ซ้ำในวัน · กฎการสะกด-เสียง (ch→/tʃ/, sh→/ʃ/, th→/θð/, หลายพยางค์ต้องมี ˈ) · JS syntax\n\n---\n\n## 🔧 ที่ยังไม่ได้แก้ (ตัดสินใจเชิงธุรกิจ)\n\n1. **ความยากไม่ไต่ระดับ** — Spearman ρ(วัน, ความยาก) = 0.186 ความยาวประโยคเฉลี่ย Day 1–10 = 6.11 คำ แต่ Day 80–90 = **5.80 คำ (ลดลง)** Day 75/84/86 ง่ายกว่า Day 1\n   → ควรกำหนดเกณฑ์ก่อนเขียน Day 105–448 ไม่ใช่มาแก้ย้อนหลัง\n\n2. **Ben ขัดกันเอง** — พูดใน Day 91 ในฐานะ \"หนึ่งในสามเพื่อน\" แต่ Day 98 มาถึงในฐานะ \"เด็กใหม่ชื่อ Ben\"\n   → สลับลำดับสัปดาห์ 17 กับ 18\n\n3. **ภาพประกอบขาด 101 จาก 104 รูป**\n\n4. **ไฟล์ Day เปิดตรงทาง URL ได้** โดยไม่ต้อง login — ต้องใช้ Cloudflare Worker ถ้าจะกันจริง\n", "AUTO_SETUP": "# 🤖 ทำให้ระบบทำงานเองทั้งหมด (คนเดียวก็ดูแลได้)\n\nอัปเดต 2026-10-06 · ใช้ชีตเดิม ไม่ต้องย้าย ไม่ต้องเปลี่ยน URL\n\n---\n\n# 🎯 ภาพรวม — หลังตั้งเสร็จจะเป็นแบบนี้\n\n```\nลูกค้าโอนเงิน → อัปสลิป → SlipOK อ่าน QR จากธนาคาร (~10 วินาที)\n   → ผ่าน → ระบบออกรหัสนักเรียน + เปิดสิทธิ์ + ส่งอีเมล + ขึ้นรหัสบนหน้าจอ\n   → ลูกค้ากด \"เข้าสู่ระบบ\" เรียนได้เลย\n```\n\n**คุณไม่ต้องทำอะไรเลย** — เข้าไปดูเฉพาะกรณีที่ตรวจอัตโนมัติไม่ผ่าน\n\n---\n\n# 🧹 ส่วนที่ 1 — ลบแท็บที่ไม่เกี่ยวข้อง\n\nชีต: https://docs.google.com/spreadsheets/d/1Bw39gtFwaFyoHKerWdxyrUecxZZgB-JFnFx8mMSlnQQ/edit\n\n## ✅ แท็บที่ใช้จริง — ห้ามลบ (7 แท็บ)\n\n| แท็บ | ใช้ทำอะไร |\n|---|---|\n| **Students** | รายชื่อนักเรียน · รหัส · อีเมล · สถานะ · แพ็กเกจ |\n| **Progress** | ความคืบหน้ารายวัน + คะแนนรายทักษะ (`sk_read` `sk_speak` `sk_write`) |\n| **Config** | ค่าตั้งระบบ — **สำคัญมาก** |\n| **Purchases** | คำสั่งซื้อ · ชื่อ · เบอร์ · อีเมล · สถานะ · สลิป |\n| **UsedSlips** | เลขอ้างอิงสลิปที่ใช้ไปแล้ว — **กันคนใช้สลิปเดิมซ้ำ** |\n| **QuizAttempts** | สิทธิ์สอบ placement test |\n| **QuizScores** | คะแนน quiz แข่งขัน |\n\n> ตรวจจากโค้ดแล้ว **ไม่มีแท็บอื่นที่โค้ดเรียกใช้เลย** — นอกจาก 7 ตัวนี้ลบได้หมด\n\n## 🗑️ ล้างข้อมูล + สร้างแท็บใหม่ให้ถูกต้อง — รันคำสั่งเดียว\n\nชีตตอนนี้มี 5 แท็บ และ **หัวคอลัมน์เป็นของเวอร์ชันเก่า**\n(Progress มีหัวแค่ 4 ช่อง แต่ข้อมูลล้นไป 6 ช่อง และยังไม่มี `sk_read` `sk_speak` `sk_write`)\n\nเพิ่มเครื่องมือไว้ใน `Code.gs` แล้ว 3 ตัว รันจากหน้า Apps Script\n\n### `resetAllSheets()` — ล้างทั้งหมด เริ่มใหม่หมดจด\n\n1. **สำรองก่อน** — ที่ชีต กด **File → Make a copy**\n2. **Extensions → Apps Script**\n3. ช่อง dropdown ด้านบน (ข้างปุ่ม ▶ Run) เลือก **`resetAllSheets`**\n4. กด **▶ Run** → ครั้งแรก Google ขอสิทธิ์ → **Allow**\n\nได้ผลลัพธ์: ลบทุกแท็บ → สร้าง **7 แท็บใหม่พร้อมหัวคอลัมน์ครบถูกต้อง**\nและ **Config ใส่ค่าเริ่มต้นให้ 16 แถวเลย** (เหลือแค่กรอก `slipok_api_key` กับ `payee_last4`)\n\n### `clearTestData()` — ลบเฉพาะข้อมูล เก็บหัวตารางและ Config ไว้\n\nใช้หลังทดสอบซื้อจริง 1 บาท เพื่อล้างข้อมูลทดสอบ\n\n### `checkSheets()` — ตรวจอย่างเดียว ไม่แก้อะไร\n\nบอกว่าแท็บครบไหม · หัวคอลัมน์เป็นอะไร · มีกี่แถว · **แท็บไหนไม่ได้ใช้ ลบได้**\n\n> ทดสอบ 18 เคสผ่านหมดแล้ว — รวมถึงกรณีชีตมีหัวเก่าแบบตอนนี้\n\n# ⚙️ ส่วนที่ 2 — เปิดตรวจสลิปอัตโนมัติ (SlipOK)\n\n**นี่คือจุดเดียวที่ขวางไม่ให้ระบบเป็น auto อยู่ตอนนี้**\nโค้ดเขียนรองรับครบแล้ว แต่ยังไม่มี API key → เลยตกไปโหมด \"ส่งให้ครูตรวจ\" ทุกครั้ง\n\n## 2.1 สมัคร SlipOK\n\n1. ไปที่ https://slipok.com\n2. สมัคร → ยืนยันตัวตน → ผูกบัญชีธนาคารที่ใช้รับเงิน\n3. ไปหน้า **API / Developer** → คัดลอก **API Key**\n\n> มีแพ็กเกจฟรีให้ลองก่อน แบบรายเดือนหลักร้อย ถ้ามีลูกค้า 30 คนก็คุ้มแล้ว\n> (เทียบกับเวลาที่ต้องมานั่งตรวจสลิปเองทุกวัน)\n\n## 2.2 ใส่ค่าในแท็บ Config\n\nเปิดแท็บ **Config** แล้วเพิ่มแถวเหล่านี้ (คอลัมน์ A = key, B = value)\n\n| key | value | จำเป็น |\n|---|---|---|\n| `slipok_api_key` | API key จาก SlipOK | 🔴 **ต้องมี** ไม่งั้นไม่เป็น auto |\n| `payee_last4` | เลข 4 ตัวท้ายบัญชีที่รับเงิน | 🔴 **ต้องมี** ใช้กันคนโอนเข้าบัญชีอื่น |\n| `site_url` | `https://peekaword.pages.dev/English/` | 🔴 ใช้ในลิงก์ที่ส่งทางอีเมล |\n| `pts_full_day` | `50` | แต้มเมื่อเรียนครบวัน |\n\n## 2.3 ด่านกันสลิปปลอม 4 ชั้น (โค้ดทำให้แล้ว)\n\n| ชั้น | กันอะไร |\n|---|---|\n| 1 | **แต่งรูปเอง** → SlipOK อ่าน QR จริงจากธนาคาร ปลอมไม่ได้ |\n| 2 | **โอนยอดน้อยกว่าราคา** → เทียบยอดกับราคาแพ็กเกจ |\n| 3 | **ใช้สลิปเก่าซ้ำ** → เทียบเลขอ้างอิงใน `UsedSlips` |\n| 4 | **โอนเข้าบัญชีอื่น** → เทียบเลขบัญชีปลายทางกับ `payee_last4` |\n\nถ้าไม่ผ่านชั้นไหน → ตกไปให้คนตรวจ ไม่ได้ปฏิเสธทิ้งทันที (ยกเว้นสลิปซ้ำ = ปฏิเสธเลย)\n\n---\n\n# 📧 ส่วนที่ 3 — ส่งอีเมลรหัสนักเรียนอัตโนมัติ (ทำให้แล้ว)\n\n**เพิ่มใน `Code.gs` รอบนี้** — พอตรวจสลิปผ่าน ระบบจะส่งอีเมลให้ลูกค้าทันที\n\nเนื้อหาอีเมล: รหัสนักเรียนตัวใหญ่ · ชื่อแพ็กเกจ · ปุ่มเข้าสู่ระบบ · วิธีตั้งรหัสผ่านครั้งแรก\n\n- ใช้ `MailApp` ของ Google — **ฟรี วันละ 100 ฉบับ** (เกินพอ)\n- ส่งจากอีเมล `pasasorn@gmail.com` เอง ไม่ต้องตั้งอะไรเพิ่ม\n- ถ้าส่งไม่สำเร็จ **ไม่ทำให้การเปิดสิทธิ์ล้มเหลว** — ลูกค้ายังเห็นรหัสบนหน้าจออยู่ดี\n- แยกข้อความ 2 แบบ: ซื้อใหม่ / เพิ่ม Level ให้บัญชีเดิม\n\n> ครั้งแรกที่ deploy Google จะขอสิทธิ์ **ส่งอีเมลแทนคุณ** → กด Allow\n\n**ทดสอบแล้ว 13 เคส ผ่านหมด** — อีเมลผิดรูปไม่ส่ง · ไม่มีรหัสไม่ส่ง · ข้อความอัปเกรดต่างจากซื้อใหม่\n\n---\n\n# 🖥️ ส่วนที่ 4 — หน้าสมัครใหม่ (ทำให้แล้ว)\n\n## ตัดขั้นตอนที่ต้องใช้คนออกหมด\n\n| เดิม | ใหม่ |\n|---|---|\n| \"⏳ รอครูอนุมัติ\" | **\"🎉 เปิดสิทธิ์เรียบร้อย\"** + ปุ่มเข้าสู่ระบบ |\n| \"ครูจะตรวจสอบภายใน 24 ชั่วโมง\" | **\"ตรวจสลิปอัตโนมัติผ่านแล้ว\"** |\n| \"รอรับลิงก์ลงทะเบียนทาง Line\" | **\"ส่งรหัสไปที่อีเมลแล้ว\"** |\n| \"กรอกข้อมูลเพื่อรอครูอนุมัติ\" | **\"ตั้งรหัสผ่านของน้อง แล้วเข้าเรียนทันที\"** |\n\nหน้าจอ**สลับข้อความเองตามผลตรวจจริง** — ถ้าสลิปตรวจอัตโนมัติไม่ผ่าน\nจะขึ้นว่า *\"จะมีคนตรวจให้ภายในวันเดียวกัน\"* แทน พร้อม poll สถานะให้อัตโนมัติ\n\n---\n\n# 🚀 ส่วนที่ 5 — Deploy\n\n`Code.gs` ตอนนี้เป็น **v7** (เพิ่ม `auto-slip-email`) ไวยากรณ์ผ่านแล้ว 1,712 บรรทัด\n\n1. เปิดชีต → **Extensions → Apps Script**\n2. `Ctrl+A` → `Delete` → วาง `Code.gs` ใหม่ → `Ctrl+S`\n3. **Deploy → Manage deployments** *(ไม่ใช่ New deployment)*\n4. กด **✏️** → ช่อง **Version** เลือก **New version** → **Deploy**\n5. กด **Allow** ตอน Google ขอสิทธิ์ส่งอีเมล\n6. เปิด `_docs\\check_backend.html` → ต้องได้ `\"version\":\"v7\"`\n\nแล้ว push เว็บ:\n\n```powershell\ncd C:\\Users\\user\\Documents\\GitHub\\lexigo\\English\ngit add -A\ngit commit -m \"feat: fully automatic purchase flow (slip verify + welcome email)\"\ngit push\n```\n\n---\n\n# ✅ เช็กลิสต์\n\n- [ ] สำรองชีต (File → Make a copy)\n- [ ] ลบแท็บที่ไม่อยู่ใน 7 ตัวข้างบน\n- [ ] สมัคร SlipOK → ได้ API key\n- [ ] Config: `slipok_api_key` · `payee_last4` · `site_url` · `pts_full_day`\n- [ ] Deploy Code.gs v7 (New version) + Allow สิทธิ์ส่งอีเมล\n- [ ] `check_backend.html` ผ่านทั้ง 2 ส่วน\n- [ ] push GitHub\n- [ ] **ทดสอบซื้อจริง 1 บาท** → ต้องได้รหัสขึ้นหน้าจอ **และ** อีเมลเข้าภายใน 1 นาที\n- [ ] ลบข้อมูลทดสอบออกจาก Students / Progress / Purchases / UsedSlips\n\n---\n\n# 🔐 ที่ยังควรทำ ถ้าจะเปิดขายจริง\n\n| เรื่อง | ทำไมสำคัญ |\n|---|---|\n| **เปลี่ยนรหัสครู** `<รหัสครูของคุณ>` → อะไรก็ได้ที่เดายาก | อยู่ใน `Code.gs` บรรทัด 13 `TEACHER_PASS` · ใครเดาได้เข้าหน้า teacher แก้ข้อมูลนักเรียนได้หมด |\n| **ติด analytics** | ตอนนี้ไม่มีทั้งเว็บ ยิงโฆษณาไปจะไม่รู้ว่าคนหลุดตรงไหน · Cloudflare Web Analytics ฟรี ติดบรรทัดเดียว |\n| **ภาพประกอบเรื่อง** | ยังขาด 385 วัน — มี prompt ให้แล้วใน `_docs/story_prompts.html` |\n\n---\n\n# 📊 สิ่งที่ยังต้องเข้าไปดูเองบ้าง (น้อยที่สุดแล้ว)\n\n| เมื่อไหร่ | ทำอะไร |\n|---|---|\n| สลิปตรวจอัตโนมัติไม่ผ่าน | เปิด `teacher.html` แท็บ Orders → กด Approve (ระบบออกรหัส + ส่งอีเมลให้เอง) |\n| ลูกค้าพิมพ์อีเมลผิด login ไม่ได้ | `teacher.html` แท็บนักเรียน → ปุ่ม ✏️ แก้อีเมล |\n| อยากดูว่าเด็กคนไหนอ่อนทักษะไหน | `teacher.html` → ปุ่ม 📊 |\n\n**ที่เหลือระบบทำเองหมด**\n", "CLOUDFLARE_MIGRATION": "# ☁️ ย้าย PeekaWord ไป Cloudflare Pages\n\n> ใช้เวลา ~15 นาที | ฟรี | **ไม่ต้องแก้ไฟล์ใดๆ** | GitHub Pages เดิมยังใช้ได้ต่อ (ไม่ต้องปิด)\n\n---\n\n## ทำไมต้องย้าย\n\n| | GitHub Pages | Cloudflare Pages |\n|---|---|---|\n| ความเร็วในไทย | ปานกลาง (server US) | 🚀 เร็วกว่า (CDN มี PoP กรุงเทพ) |\n| Bandwidth | จำกัด soft 100GB/เดือน | ไม่จำกัด |\n| Build/deploy | ~1-2 นาที | ~30 วินาที |\n| Custom domain + SSL | ได้ | ได้ (ฟรี) |\n| Workers (API/paywall) | ❌ | ✅ ต่อยอดได้ |\n\n---\n\n## 📝 ขั้นตอน (ทำครั้งเดียว)\n\n### 1. สมัคร Cloudflare (ถ้ายังไม่มี)\n- ไปที่ https://dash.cloudflare.com/sign-up\n- สมัครด้วย email → ยืนยัน email\n\n### 2. สร้าง Pages project\n1. เข้า Dashboard → เมนูซ้าย **Workers & Pages**\n2. กด **Create** → แท็บ **Pages** → **Connect to Git**\n3. กด **Connect GitHub** → อนุญาต (authorize) Cloudflare\n4. เลือก repository: **`peekaword`**\n5. กด **Begin setup**\n\n### 3. ตั้งค่า Build (สำคัญ — ใส่ให้ตรง)\n\n| ช่อง | ใส่อะไร |\n|------|---------|\n| **Project name** | `peekaword` (จะได้ URL `peekaword.pages.dev`) |\n| **Production branch** | `main` |\n| **Framework preset** | **None** |\n| **Build command** | *(เว้นว่าง)* |\n| **Build output directory** | *(เว้นว่าง หรือใส่ `/`)* |\n\n> ⚠️ เว็บเราเป็น static HTML ล้วน **ห้ามใส่ build command** ไม่งั้น build fail\n\n6. กด **Save and Deploy** → รอ ~30 วินาที\n\n### 4. ได้ URL ใหม่\n```\nhttps://peekaword.pages.dev/English/dashboard.html\nhttps://peekaword.pages.dev/English/register.html\nhttps://peekaword.pages.dev/English/login.html\n```\n\n> โครงสร้างโฟลเดอร์เหมือนเดิมทุกอย่าง แค่เปลี่ยน domain\n\n---\n\n## ✅ ทดสอบหลัง deploy\n\n- [ ] เปิด `peekaword.pages.dev/English/login.html` → หน้าโหลดขึ้น\n- [ ] login → เข้า dashboard ได้\n- [ ] เปิด Day ใดวันหนึ่ง → **ทดสอบไมค์ (Chrome)** ต้องทำงาน\n- [ ] register → QR แสดง → อัปสลิปได้\n- [ ] teacher.html → อนุมัติได้\n\n> **ไมค์ต้องทำงาน** เพราะ Cloudflare ให้ HTTPS อัตโนมัติ (เงื่อนไขเดียวของ SpeechRecognition)\n\n---\n\n## 🔄 หลังจากนี้ deploy อัตโนมัติ\n\n```\nแก้ไฟล์ → GitHub Desktop → Commit → Push\n   ↓ (อัตโนมัติ ~30 วินาที)\nCloudflare build & deploy → เว็บอัปเดตเอง\n```\n\nไม่ต้องทำอะไรเพิ่ม เหมือน GitHub Pages แต่เร็วกว่า\n\n---\n\n## 🌐 (ทางเลือก) ใช้ domain ตัวเอง เช่น peekaword.com\n\n1. ซื้อ domain (Namecheap / Cloudflare Registrar / GoDaddy)\n2. Cloudflare Pages → project → **Custom domains** → **Set up a domain**\n3. ใส่ชื่อ domain → ทำตามที่ระบบบอก (ชี้ nameserver หรือ CNAME)\n4. รอ ~5–30 นาที → SSL ออกให้อัตโนมัติ\n\n**ผลลัพธ์:** `https://peekaword.com/English/login.html` (ดูมืออาชีพกว่า `.pages.dev`)\n\n> 💡 ถ้าซื้อ domain ที่ Cloudflare Registrar จะตั้งค่าง่ายสุด (ไม่ต้องย้าย nameserver)\n\n---\n\n## 📌 หลังย้ายเสร็จ ต้องอัปเดตอะไรบ้าง\n\n**ต้องแก้:**\n- [ ] `_docs/MASTER_ADMIN.md` + `ALL_LINKS.md` → เปลี่ยน base URL\n- [ ] ลิงก์ที่ส่งลูกค้าใน LINE / โฆษณา\n\n**ไม่ต้องแก้:**\n- ✅ ไฟล์ HTML ทั้งหมด (ใช้ relative path อยู่แล้ว)\n- ✅ Code.gs / Google Apps Script (API URL เดิม)\n- ✅ ลิงก์ระหว่างหน้า (Day → Day, dashboard → Level)\n\n---\n\n## ⚠️ ข้อควรรู้\n\n1. **GitHub Pages เดิมยังทำงานอยู่** — ไม่ต้องปิด ใช้เป็น backup ได้\n   (ถ้าอยากปิด: repo → Settings → Pages → Unpublish)\n\n2. **นักเรียนเก่าที่ bookmark URL เดิม** ยังเข้าได้ (GitHub Pages ยังอยู่)\n   แต่ progress แยกกันคนละ domain! (localStorage ผูกกับ domain)\n   → **ควรแจ้งนักเรียนให้ใช้ URL ใหม่อย่างเดียว** หรือปิด GitHub Pages ไปเลยเพื่อกันสับสน\n\n3. **Cloudflare ฟรี** จนกว่าจะเกิน limit ที่สูงมาก (500 builds/เดือน, bandwidth ไม่จำกัด)\n\n---\n\n## 🚀 ต่อยอดในอนาคต (Cloudflare Workers)\n\nเมื่อย้ายมาแล้ว ทำเพิ่มได้:\n- **Paywall จริง** — ตรวจสิทธิ์ก่อนส่งไฟล์ Day (แก้ปัญหาเดา URL เข้าฟรี)\n- **API ของตัวเอง** — แทน Google Apps Script (เร็วกว่า, ไม่จำกัด quota)\n- **Auth ระบบใหม่** — email + password + reset (ถ้าอยากเปลี่ยนภายหลัง)\n\nทั้งหมดฟรีใน free tier\n", "DATA_PERSISTENCE": "# 💾 ทำยังไงให้ข้อมูลไม่หาย\n\n## ปัญหาจริงที่ต้องรู้ก่อน\n\nข้อมูลเดิมอยู่ใน **localStorage** ของเบราว์เซอร์เท่านั้น หายเมื่อ:\n\n| สาเหตุ | เกิดบ่อยแค่ไหน |\n|---|---|\n| ล้างแคช / ล้างข้อมูลเว็บไซต์ | บ่อย |\n| เปลี่ยนเครื่อง / เปลี่ยนเบราว์เซอร์ | บ่อยมาก |\n| โหมดไม่ระบุตัวตน (Incognito) | ปิดแท็บ = หายทันที |\n| **iPhone/iPad Safari: ไม่เข้าเว็บ 7 วัน** | **อันตรายที่สุด** |\n\n### ⚠️ กฎ 7 วันของ Safari\n\nApple ลบ localStorage ทิ้งทั้งหมดถ้าไม่มีการ **โต้ตอบกับเว็บนั้น** ภายใน 7 วันที่ใช้ Safari\n(นโยบายนี้มีมาตั้งแต่ iOS 13.4 และยังใช้อยู่)\n\n**ตัวจับเวลาจะรีเซ็ตทุกครั้งที่เด็กเข้ามาเรียน** → เรียนสม่ำเสมอก็ไม่มีปัญหา\nแต่ถ้าหยุดยาว เช่น ปิดเทอมหรือไปเที่ยว 2 สัปดาห์ กลับมาแล้ว **ข้อมูลหายหมด**\n\n**ข้อยกเว้นสำคัญ:** เว็บที่ **เพิ่มลงหน้าจอโฮม (Add to Home Screen)** ไม่นับเป็น Safari\nมีตัวนับของตัวเอง และ Apple ระบุว่าจะไม่ลบข้อมูล → **นี่คือทางแก้ที่ฟรีและได้ผลจริงบน iOS**\n\n---\n\n# ✅ ที่ทำให้แล้ว\n\n## 1. สำรองบนคลาวด์อัตโนมัติ — ผู้เรียนที่ล็อกอินแล้ว\n\nทุกครั้งที่กด Finish ระบบส่งขึ้น Google Sheet:\n\n```\n&score=72&sk_r=82&sk_s=68&sk_w=54\n```\n\nชีต **Progress** เพิ่ม 3 คอลัมน์: `sk_read` · `sk_speak` · `sk_write`\nเล่นซ้ำแล้วทำได้ดีขึ้น → อัปเดตค่าที่ดีที่สุด ไม่ลงโทษการฝึกซ้ำ\n\n**ตอน login ดึงกลับมาทั้งหมด** → เปลี่ยนเครื่อง ล้างแคช เข้าใหม่ก็ครบเหมือนเดิม\n(`skillsFor_()` ใน `Code.gs` → `pwMergeCloud()` ใน `login.html`)\n\n> ของเดิมกู้คืนได้อยู่แล้วเฉพาะ **รหัสปลดล็อกรายวัน** (`wla_dN`)\n> รอบนี้เพิ่ม **คะแนนรายทักษะ** เข้าไปด้วย\n\n## 2. ขอสิทธิ์ไม่ให้เบราว์เซอร์ล้างทิ้ง\n\n`js/report.js` เรียก `navigator.storage.persist()` อัตโนมัติทุกครั้งที่โหลดหน้า\nChrome / Edge / Android อนุมัติให้เองถ้าผู้ใช้เข้าเว็บสม่ำเสมอ → ข้อมูลไม่โดนล้างอัตโนมัติอีก\n(Safari ไม่รองรับ — ต้องใช้วิธี Add to Home Screen แทน)\n\n## 3. สำรองเป็นไฟล์ — ตาข่ายนิรภัยสำหรับคนที่ยังไม่มีบัญชี\n\nในหน้า `report.html` มีการ์ด **💾 สำรองความคืบหน้า**\n\n- **⬇️ บันทึกเป็นไฟล์** → ได้ `peekaword-progress-2026-08-29.json`\n  (เก็บทั้งคะแนนรายทักษะและรหัสปลดล็อกทุกวัน)\n- **⬆️ กู้คืนจากไฟล์** → เอาไฟล์กลับมาใส่เครื่องใหม่ได้ทันที\n\n---\n\n# ⬜ แนะนำให้ทำเพิ่ม\n\n## A. ชวนผู้ใช้ iOS เพิ่มลงหน้าจอโฮม ← คุ้มที่สุดที่ยังไม่ได้ทำ\n\nแก้ปัญหากฎ 7 วันของ Safari ได้ตรงจุด และฟรี\n\nต้องมี 2 อย่าง:\n1. `manifest.json` + ไอคอน 192px / 512px\n2. แบนเนอร์เล็ก ๆ ตรวจว่าเป็น iOS Safari แล้วบอกวิธี — *\"แตะ ⬆️ แล้วเลือก เพิ่มไปยังหน้าจอโฮม เพื่อไม่ให้ความคืบหน้าหาย\"*\n\nบอกได้เลยถ้าจะให้ทำ ใช้เวลาไม่นาน\n\n## B. เตือนก่อนข้อมูลจะหาย\n\nถ้าเป็น iOS Safari + ไม่ได้เข้ามา 5 วัน → ขึ้นเตือนให้กดสำรองไฟล์หรือสมัครบัญชี\n\n## C. ผูกบัญชีตั้งแต่ทดลอง\n\nแก้ได้ 100% แต่ขัดกับที่เพิ่งเอา email gate ออก — **ไม่แนะนำ**\nทางที่ดีกว่าคือใช้ข้อ A + ปุ่มสำรองไฟล์ที่มีอยู่แล้ว\n\n---\n\n## สรุปเทียบ\n\n| วิธี | ผู้ทดลอง | ผู้ซื้อแล้ว | ค่าใช้จ่าย | สถานะ |\n|---|---|---|---|---|\n| คลาวด์ (Google Sheet) | ❌ ไม่มีบัญชี | ✅ ครบ | ฟรี | ✅ ทำแล้ว |\n| `navigator.storage.persist()` | ✅ Chrome/Android | ✅ | ฟรี | ✅ ทำแล้ว |\n| สำรองเป็นไฟล์ | ✅ | ✅ | ฟรี | ✅ ทำแล้ว |\n| Add to Home Screen | ✅ แก้ปัญหา iOS | ✅ | ฟรี | ⬜ ยังไม่ทำ |\n| ผูกบัญชีตั้งแต่ทดลอง | ✅ | — | ฟรี | ❌ ไม่แนะนำ |\n\n---\n\n## ⚠️ ต้อง Deploy Code.gs ใหม่\n\n`Code.gs` เป็น **v6** แล้ว — ถ้าไม่ deploy คะแนนรายทักษะจะ**ไม่ถูกเก็บบนคลาวด์**\n\nตรวจ: `?action=version` → ต้องได้ `\"version\":\"v6\"` และมี `\"skill-sync\"` ใน features\n\nชีต **Progress** ที่มีอยู่แล้วจะไม่มีหัวคอลัมน์ใหม่อัตโนมัติ (โค้ดสร้างหัวเฉพาะตอนสร้างชีตครั้งแรก)\n→ พิมพ์เพิ่มเองในแถวที่ 1 คอลัมน์ G, H, I: `sk_read` `sk_speak` `sk_write`\n*(ไม่ใส่ก็ยังทำงานได้ ข้อมูลจะลงคอลัมน์ถูกอยู่ดี แค่ไม่มีชื่อหัวตาราง)*\n\n---\n\n## การทดสอบ\n\n`/tmp/qa/t_persist.js` — 17 เคส ผ่านหมด\nครอบคลุม: สร้าง query ส่งคลาวด์ · ข้ามขั้นส่งเฉพาะที่มี · กู้คืนเครื่องใหม่ ·\nรวมข้อมูลเก็บค่าที่ดีกว่า · `null` ไม่ถูกนับเป็น 0 · เรียก `persist()` · การเชื่อมต่อครบทุกไฟล์\n\nJS ผ่านทั้ง 456 ไฟล์\n", "DEPLOY_NOW": "# 🚀 Deploy — ทำตามลำดับนี้ (~15 นาที)\n\n> ทำครั้งเดียว หลังจากนี้แก้เว็บแล้ว push ก็พอ ไม่ต้อง deploy ซ้ำ\n\n---\n\n## ขั้นที่ 1 — เพิ่ม Config 3 บรรทัดในชีต (ทำก่อน)\n\n⚠️ **สำคัญ:** โค้ดจะสร้าง Config อัตโนมัติเฉพาะตอนสร้างชีตครั้งแรกเท่านั้น\nชีตคุณมีอยู่แล้ว → **ต้องพิมพ์เพิ่มเอง ไม่งั้นระบบใหม่ไม่ทำงาน**\n\nเปิด Google Sheet → แท็บ **Config** → เลื่อนลงล่างสุด → พิมพ์เพิ่ม 3 แถว:\n\n| คอลัมน์ A (key) | คอลัมน์ B (value) |\n|---|---|\n| `payee_last4` | เลข 4 ตัวท้ายบัญชี/พร้อมเพย์ที่รับเงิน เช่น `4821` |\n| `site_url` | `https://peekaword.pages.dev/English/` |\n| `pts_full_day` | `50` |\n\n**แต่ละอันทำอะไร**\n\n- `payee_last4` — กันคนโอนเข้าบัญชีคนอื่นแล้วส่งสลิปมา (ถ้าเว้นว่าง ระบบข้ามการเช็กข้อนี้)\n- `site_url` — ใช้สร้างลิงก์ในเมล \"ตั้งรหัสผ่านใหม่\"\n- `pts_full_day` — คะแนนเต็มต่อวัน (10 เข้าเรียน + 50 ตามผลงาน = 60)\n\n> `pts_per_correct` เดิมไม่ใช้แล้ว ไม่ต้องลบ ปล่อยไว้ได้\n\n---\n\n## ขั้นที่ 2 — วาง Code.gs\n\n1. Google Sheet → **Extensions → Apps Script**\n2. **ลบโค้ดเดิมทั้งหมด** (Ctrl+A → Delete)\n3. เปิด `Code.gs` ในโฟลเดอร์โปรเจกต์ → copy ทั้งไฟล์ (1,631 บรรทัด) → วาง\n4. **Ctrl+S** บันทึก\n\n---\n\n## ขั้นที่ 3 — Deploy (จุดที่พลาดกันบ่อย)\n\n**Deploy → Manage deployments** *(ไม่ใช่ New deployment)*\n\n→ กดรูป **✏️ ดินสอ** ที่ deployment เดิม\n→ ช่อง **Version** เลือก **New version**\n→ กด **Deploy**\n\n> ❌ **ห้ามกด \"New deployment\"** — URL จะเปลี่ยน แล้วทุกหน้าเว็บจะเรียก API ไม่ได้ทั้งระบบ\n\nURL ต้องเป็นอันเดิม:\n```\nhttps://script.google.com/macros/s/AKfycbz8SuCV8PsUkIElDN3rFm9eE1TKm0UOFS5M_u6TrHmxkslAOQuopYmv3IFM0JBoRYq-/exec\n```\n\n---\n\n## ขั้นที่ 4 — ทดสอบทันที (สำคัญที่สุด)\n\nเอา URL ข้างบนไปวางในเบราว์เซอร์ แล้วต่อท้ายด้วย:\n\n**ทดสอบ 1 — รหัสจบวันยาว 8 ตัว (บั๊กที่ใหญ่ที่สุดที่แก้ไป)**\n```\n?action=save&code=<รหัสนักเรียนของคุณ>&day=22&completion=D22-AB12&score=100\n```\n- ✅ ต้องได้ `{\"status\":\"ok\",\"day_points\":60}`\n- ❌ ถ้าได้ `completion code ผิด format` = ยังใช้โค้ดเก่า ให้กลับไปทำขั้นที่ 3 ใหม่\n\n**ทดสอบ 2 — คะแนน 0 ต้องไม่กลายเป็นเต็ม**\n```\n?action=save&code=<รหัส>&day=23&completion=D23-AB12&score=0\n```\n- ✅ ต้องได้ `day_points: 10` (ไม่ใช่ 60)\n\n**ทดสอบ 3 — วันนอกช่วงต้องถูกปฏิเสธ**\n```\n?action=save&code=<รหัส>&day=999&completion=D999-AB12&score=100\n```\n- ✅ ต้องได้ `เลขวันไม่ถูกต้อง`\n\n> ลบแถวทดสอบออกจากชีต **Progress** เมื่อทดสอบเสร็จ\n\n---\n\n## ขั้นที่ 5 — SlipOK (ทำทีหลังก็ได้)\n\nยังไม่ใส่ = ระบบส่งสลิปให้ครูตรวจมือเหมือนเดิม ไม่พัง\n\n1. https://slipok.com → สมัคร → ยืนยันบัญชีที่รับเงิน (**ฟรี 100 สลิป/เดือน**)\n2. คัดลอก API key\n3. ชีต **Config** → แถว `slipok_api_key` → วางทับ `YOUR_SLIPOK_KEY_HERE`\n4. ทดสอบ: สมัครเองที่ `register.html` → อัปสลิปจริง → ต้องได้รหัสภายใน ~5 วินาที\n\n---\n\n## ✅ เช็กลิสต์หลัง deploy\n\n- [ ] `?action=save&...&day=22&completion=D22-AB12` → `status: ok`\n- [ ] `score=0` → ได้ 10 แต้ม (ไม่ใช่ 60)\n- [ ] `day=999` → ถูกปฏิเสธ\n- [ ] ชีต `Students` มีคอลัมน์ **J, K, L** = `pass_hash` `pass_salt` `reset_token` โผล่มาเอง\n- [ ] เข้า `login.html` ด้วยรหัสนักเรียน → ระบบให้ตั้งอีเมล+รหัสผ่าน\n- [ ] logout → เข้าใหม่ด้วยอีเมล+รหัสผ่าน → เข้าได้\n- [ ] กด \"ลืมรหัสผ่าน\" → ได้เมล → กดลิงก์ → ตั้งใหม่ → เข้าได้\n- [ ] เปิด Day 22 ใน **Chrome** บนมือถือ → ไมค์ทำงาน → จบวัน → เช็กชีต Progress ว่ามีแถวใหม่\n\n---\n\n## 🆘 ถ้าพัง\n\n| อาการ | สาเหตุ | แก้ |\n|---|---|---|\n| ทุกหน้าเรียก API ไม่ได้ | กด New deployment แทน edit | ลบ deployment ใหม่ → กลับไปใช้อันเดิม → edit → New version |\n| `completion code ผิด format` | Code.gs ยังเป็นเวอร์ชันเก่า | วางใหม่ + New version |\n| อีเมลรีเซ็ตไม่ถูกส่ง | โควตา MailApp เต็ม (100 ฉบับ/วัน) | รอวันถัดไป หรือใช้ \"เข้าด้วยรหัสนักเรียน\" แทน |\n| ตรวจสลิปขึ้น `manual` ตลอด | ยังไม่ใส่ SlipOK key | ทำขั้นที่ 5 |\n| แต้มยังเป็น 510/วัน | ลืมเพิ่ม `pts_full_day` ในชีต | ทำขั้นที่ 1 |\n", "DEPLOY_v5": "# 🚀 Deploy Code.gs v5 — ทำตามนี้ (~5 นาที)\n\n> รอบนี้แก้เรื่องเดียว: **เก็บชื่อ/อีเมล/เบอร์ ตอนลูกค้าจ่ายเงิน**\n> ถ้าไม่ deploy ระบบยังใช้ได้ แต่ชีต Purchases จะยังว่าง 3 คอลัมน์เหมือนเดิม\n\n---\n\n## ขั้นที่ 1 — วางโค้ดใหม่\n\n1. Google Sheet → **Extensions → Apps Script**\n2. **Ctrl+A → Delete** (ลบของเดิมทั้งหมด)\n3. เปิด `English/Code.gs` → **Ctrl+A → Ctrl+C** → กลับมาวาง (**1,639 บรรทัด**)\n4. **Ctrl+S**\n\n## ขั้นที่ 2 — Deploy\n\n**Deploy → Manage deployments** *(ไม่ใช่ New deployment)*\n→ กด ✏️ **ดินสอ** ที่ deployment เดิม\n→ ช่อง **Version** เลือก **New version**\n→ **Deploy**\n\n> ❌ **ห้ามกด \"New deployment\"** — URL จะเปลี่ยน แล้วทั้งเว็บเรียก API ไม่ได้\n\n---\n\n## ขั้นที่ 3 — ตรวจว่า deploy ติดจริง ⭐\n\nวางใน browser:\n\n```\nhttps://script.google.com/macros/s/AKfycbz8SuCV8PsUkIElDN3rFm9eE1TKm0UOFS5M_u6TrHmxkslAOQuopYmv3IFM0JBoRYq-/exec?action=version\n```\n\n**ต้องได้:**\n```json\n{\"status\":\"ok\",\"version\":\"v5\",\"deployed\":\"2026-08-29\",\n \"features\":[...,\"purchase-contact-info\",\"trial-lead-capture\"]}\n```\n\n- ✅ ได้ `\"version\":\"v5\"` → deploy สำเร็จ ไปขั้นที่ 4\n- ❌ ยังได้ `\"version\":\"v4\"` → **ยังไม่ได้เลือก New version** กลับไปทำขั้นที่ 2 ใหม่\n\n*(นี่คือจุดที่พลาดบ่อยที่สุด — ครั้งก่อนกด Deploy 3 รอบแล้วยังเป็นโค้ดเก่า เพราะลืมสลับ Version dropdown)*\n\n---\n\n## ขั้นที่ 4 — ทดสอบว่าเก็บข้อมูลติดต่อได้จริง\n\nวางใน browser (แทน URL ยาวข้างบนด้วย `...` เพื่อความสั้น):\n\n```\n.../exec?action=newPurchase&order_id=TEST-001&pkg=ทดสอบ&price=1&type=trial&name=ทดสอบ ระบบ&email=Test@Mail.com&phone=0XXXXXXXXX\n```\n\n**ต้องได้:** `{\"status\":\"ok\",\"order_id\":\"TEST-001\"}`\n\nจากนั้นเปิดชีต **Purchases** → แถวล่างสุดต้องเป็น:\n\n| order_id | name | phone | line_id | email | pkg_name |\n|---|---|---|---|---|---|\n| TEST-001 | ทดสอบ ระบบ | 0812345678 | *(ว่าง)* | test@mail.com | ทดสอบ |\n\n- ✅ ชื่อ/เบอร์/อีเมลขึ้นครบ + อีเมลเป็นตัวพิมพ์เล็ก → **เสร็จ**\n- ❌ ยังว่าง → โค้ดเก่ายังทำงานอยู่ กลับไปขั้นที่ 2\n\n**ลบแถว TEST-001 ทิ้งเมื่อทดสอบเสร็จ**\n\n---\n\n## ขั้นที่ 5 — push เว็บขึ้น GitHub\n\nไฟล์ฝั่งเว็บที่แก้รอบนี้:\n\n```\nEnglish/register.html      ← เพิ่มช่องชื่อ/อีเมล/เบอร์ ตอนจ่ายเงิน\nEnglish/trial.html         ← ส่ง lead ไปเก็บที่ backend\nEnglish/login.html         ← เก็บอีเมลเข้า session (ให้ลายน้ำแสดงได้)\nEnglish/js/protect.js      ← ลายน้ำ + ป้องกันการคัดลอก (ไฟล์ใหม่)\nEnglish/Level*/Day*.html   ← ฝัง protect.js 448 ไฟล์\nEnglish/dashboard.html\nEnglish/Code.gs\n```\n\nCloudflare Pages จะ deploy ให้เองหลัง push\n\n---\n\n## ✅ เช็กลิสต์\n\n- [ ] `?action=version` → `v5`\n- [ ] ทดสอบ `newPurchase` → ชีต Purchases มีชื่อ/เบอร์/อีเมลครบ\n- [ ] ลบแถว TEST-001\n- [ ] push GitHub → รอ Cloudflare deploy (~1 นาที)\n- [ ] เปิด `register.html` จริง → เห็นกล่องเขียว \"📇 ข้อมูลติดต่อกลับ\" ก่อนช่องแนบสลิป\n- [ ] เปิด Day ไหนก็ได้ → เห็นลายน้ำจางๆ ทั้งหน้า\n- [ ] **ซื้อจริง 1 บาท ให้ครบ flow** ← สำคัญที่สุด อย่าข้าม\n", "Day_Blueprint": "# Daily Lesson Blueprint — Oxford 3000 Word Adventure\n\n## โครงสร้างทั้งหมด: Cover + 5 Steps\n\n---\n\n## 🏠 Cover Page (p0)\n\n**จุดประสงค์:** แนะนำคำศัพท์ก่อนเรียน\n\n**มีอะไร:**\n- Emoji ประจำวัน + ชื่อเรื่อง + จำนวนคำ\n- Vocab Cards 6 ใบ (grid 2×3) — แต่ละใบมี SVG icon, คำภาษาอังกฤษ, สัทอักษร, คำแปลภาษาไทย\n- กดการ์ดแล้วออกเสียงคำนั้น (TTS)\n- ปุ่ม \"Let's Start!\" → ไป Step 1\n\n**Data ที่ต้องกำหนดในแต่ละไฟล์:**\n```js\nconst WORDS = [\n  {e:'cat', t:'แมว', ph:'/kæt/'},\n  ...\n]\n```\n\n---\n\n## 🎧 Step 1 · Listen First (p1)\n\n**จุดประสงค์:** ฝึกทักษะ Listening — ฟังเรื่องโดยไม่ดูตัวหนังสือ\n\n**มีอะไร:**\n- ปุ่ม ▶ Play Story → เล่น TTS เรื่องทั้งหมด\n- ปุ่ม ■ Stop\n- รูป illustration (img_dayN.png) — ซ่อนอัตโนมัติถ้าไม่มีไฟล์\n- Think box — คำถาม comprehension 1 ข้อ\n\n**Data:**\n```js\nconst STORY = \"Leo has a cat. Her name is Nala...\"\n```\n\n**หมายเหตุ:** ยังไม่มี scoring — เป็น warm-up\n\n---\n\n## 📖 Step 2 · Read + Listen (p2)\n\n**จุดประสงค์:** ฝึก Reading + Speaking โดยมีเสียงช่วย\n\n**มีอะไร:**\n- ปุ่ม ▶ Play Story + ■ Stop\n- รูป illustration (img_dayN.png)\n- เรื่องสั้น — คำศัพท์ highlight สีม่วง (`.vocab`)\n- ปุ่ม 🎤 \"อ่านทั้งเรื่อง\" — บันทึกเสียงทั้งเรื่อง\n- Progress bar แสดงคะแนน % แบบ real-time\n- Auto-stop หลังเงียบ 2.5 วินาที\n- Step Summary แสดงคะแนนแยกทีละประโยค\n\n**Scoring:** เปรียบเทียบ transcript vs. ประโยคในเรื่อง (word match %)\n\n**Data:**\n```js\nconst SS = [  // Speak Sentences — ทุกประโยคในเรื่อง\n  \"Leo has a cat.\",\n  \"Nala is small and white.\",\n  ...\n]\n```\n\n---\n\n## 🗣️ Step 3 · Read + Speak (p3)\n\n**จุดประสงค์:** ฝึก Speaking ทีละประโยค — อ่านตามแล้ววัดคะแนน\n\n**มีอะไร:**\n- ประโยคละ 1 row มี: ตัวหนังสือ + ▶ ฟัง + 🎤 พูด\n- กด 🎤 → บันทึก → แสดงคะแนน % + สี (เขียว/เหลือง/แดง)\n- แสดงข้อความที่ได้ยิน (\"ได้ยิน: ...\")\n- Step Summary รวมคะแนนเฉลี่ยทุกประโยค\n\n**Scoring:** word match % เทียบกับ target sentence\n\n**Data:** ใช้ `SS` เดิมจาก Step 2\n\n---\n\n## ✏️ Step 4 · Listen + Write / Dictation (p4)\n\n**จุดประสงค์:** ฝึก Writing — ฟังแล้วพิมพ์\n\n**มีอะไร:**\n- 3 ประโยค (คัดจากเรื่อง)\n- แต่ละข้อ: ปุ่ม ▶ Play + ช่องพิมพ์\n- ปุ่ม \"Check ✓\" → ตรวจทุกข้อพร้อมกัน + เสียง feedback\n  - ถูกทุกข้อ → \"Perfect!\" / \"Amazing!\"\n  - ถูกบางข้อ → \"Correct!\" / \"Great job!\"\n  - ผิดทุกข้อ → \"Try again!\" / \"Keep trying!\"\n- ปุ่ม \"Show Answers\" → เฉลย\n\n**Data:**\n```js\nconst DS = [  // Dictation Sentences — 3 ประโยค\n  \"Leo has a cat.\",\n  \"Boon is big and brown.\",\n  \"Leo loves all his animals.\"\n]\n```\n\n---\n\n## 🎮 Step 5 · Word Match Game (p5)\n\n**จุดประสงค์:** ฝึก Vocabulary — จับคู่คำ EN ↔ TH\n\n**มีอะไร:**\n- คอลัมน์ซ้าย: คำภาษาอังกฤษ (สุ่มลำดับ)\n- คอลัมน์ขวา: คำแปลภาษาไทย (สุ่มลำดับ)\n- กด EN → กด TH → ถ้าถูกเปลี่ยนเป็นสีเขียว + เสียง \"Correct!\"\n- ถ้าผิด สั่นแดง + เสียง \"Try again!\"\n- Progress bar + คะแนน / 6\n- เมื่อได้ ≥ 4/6 → แสดง Completion Screen\n\n**Completion Screen มี:**\n- Day Summary (bar chart Step 2–5 %)\n- Completion Code (D1-XXXX) — generate ครั้งเดียว บันทึก localStorage\n- ปุ่ม Copy Code\n- ลิงก์ → หน้าหลัก | Day ถัดไป\n\n---\n\n## ⚙️ ระบบที่ทำงานอยู่เบื้องหลัง\n\n| ระบบ | หน้าที่ |\n|------|--------|\n| TTS (Web Speech API) | อ่านออกเสียง — เลือก voice + ปรับ speed ได้ |\n| SpeechRecognition API | รับเสียงพูด Step 2, 3 |\n| localStorage | เก็บ completion code + progress + lock ระหว่าง Day |\n| Google Sheets API | sync คะแนนไปยัง cloud |\n| Feedback Sound | speakFb() — สุ่ม phrase ตาม correct/wrong/perfect |\n\n---\n\n## 🔒 Lock System\n\n- **Day 1:** ไม่มี lock — เปิดได้เลย\n- **Day 2+:** ตรวจ `localStorage.getItem('wla_dN')` ถ้าไม่มี → แสดง lock screen\n- **Admin bypass:** `localStorage.getItem('wla_admin') === '1'`\n- **Code format:** `D1-ABCD` (Day + 4 ตัวอักษร random)\n\n---\n\n## 📁 ไฟล์ที่เกี่ยวข้อง\n\n| ไฟล์ | หน้าที่ |\n|------|--------|\n| DayN_[Title]_A1.html | บทเรียนรายวัน |\n| img_dayN.png | รูป illustration (ใน Pic English/) |\n| admin.html | หน้าหลัก + ระบบ admin |\n| leaderboard.html | อันดับนักเรียน |\n| progress.html | สรุปความคืบหน้า |\n| competition-quiz.html | แข่งขัน 5 ด่าน |\n\n---\n\n## 🎨 Color Theme ตาม Week\n\n| Week | Theme | สี header |\n|------|-------|-----------|\n| 1 | Animals | Orange #FF9800 |\n| 2 | Food | Green #66BB6A |\n| 3 | Home/Family | Purple #AB47BC |\n| 4 | School | Blue #42A5F5 |\n", "IMAGE_PIPELINE": "# 🖼️ PeekaWord — Image Pipeline (ภาพประกอบ 104 วัน)\n\n> อัปเดต: 2026-07-29 | ยึดตาม **PeekaWord Brand Kit**\n\n---\n\n## สถานะปัจจุบัน\n\n| รายการ | จำนวน |\n|--------|-------|\n| Day ที่มีอยู่ | **104** (Day 1–104) |\n| ภาพที่ต้องมี | 104 |\n| ภาพที่มีแล้ว | **3** (Day 2, 3, 31) — สไตล์เก่า pastel ยังไม่ตรง Brand Kit |\n| **ยังขาด** | **101 รูป** |\n\n---\n\n## ⚠️ บั๊กที่แก้แล้ว (สำคัญ)\n\nเดิม Day file อ้างรูปว่า `src=\"img_day1.png\"` → resolve เป็น `Level1/img_day1.png`\nแต่ไฟล์จริงอยู่ใน `Pic English/` → **รูปไม่ขึ้นเลยแม้แต่รูปเดียว**\n\n**แก้แล้ว:** ทั้ง 90 ไฟล์เปลี่ยนเป็น `src=\"../img/img_dayN.png\"`\nและสร้างโฟลเดอร์ `img/` ที่ root พร้อมย้ายรูปที่มีเข้าไปแล้ว\n\n---\n\n## 📁 วิธีเพิ่มรูป\n\n1. gen รูปตาม prompt (ดูด้านล่าง)\n2. ตั้งชื่อ **`img_dayN.png`** (N = เลขวัน เช่น `img_day15.png`)\n3. วางใน `English/img/`\n4. commit + push → Cloudflare deploy อัตโนมัติ\n\n> ถ้ายังไม่มีรูป หน้าเว็บจะซ่อนกล่องรูปให้เอง (`onerror`) ไม่พัง\n\n---\n\n## 🎨 Prompt\n\nไฟล์พร้อมใช้ 2 แบบ (gen จากเนื้อเรื่องจริงของแต่ละวัน):\n\n| ไฟล์ | ใช้กับ |\n|------|--------|\n| `_docs/image_prompts.txt` | copy วางทีละอัน — Canva Magic Media / ChatGPT / Midjourney |\n| `_docs/image_prompts.csv` | ป้อนเข้า batch API / n8n / Make |\n\n**Style block (ตาม Brand Kit):**\n\n```\nChildren's educational storybook illustration for Thai families.\nWarm cream background (#FFF8EF), never pure white.\nSoft rounded shapes, no sharp corners.\nCute expressive semi-realistic characters — Thai/Southeast-Asian children,\nactively doing the action (speaking, pointing, reaching, playing),\nnever posing for the camera.\nGentle warm lighting.\nPalette: deep navy (#14204A) for outlines and dark areas,\nmango yellow (#FFB020) as the single eye-catching accent,\ncoral (#FF6B5A) and mint green (#12B886) as small touches only.\nLarge pale circles (12-16% opacity) in the background instead of patterns or gradients.\nABSOLUTELY NO text, letters, words, numbers or signage anywhere in the image.\n800x400 landscape banner, digital art, for ages 5-12.\nSCENE: [3 ประโยคแรกของเรื่องวันนั้น]\n```\n\n**ทำไม prompt เป็นแบบนี้** — map ตรงกับกฎภาพประกอบใน Brand Kit ทุกข้อ:\nพื้นครีม / มุมโค้ง / วงกลมจาง / เด็กกำลังทำอะไรอยู่ / ห้ามเด็กฝรั่ง / ห้ามข้อความ\n\n---\n\n## 🔧 ตัวเลือกเครื่องมือ (เรียงตามความคุ้ม)\n\n| ทาง | ราคา 101 รูป | ข้อดี | ข้อเสีย |\n|-----|-------------|-------|---------|\n| **Canva Magic Media** | ฟรี (Pro quota) | ไม่เสียเพิ่ม สไตล์ใช้ได้ | ทำมือทีละรูป ~3–4 ชม. |\n| **ChatGPT Plus / Gemini** | ฟรี (ใน subscription) | คุมสไตล์ดี ต่อรองได้ | ทำมือ ช้าพอกัน |\n| **Replicate (Flux schnell)** ⭐ | **~$0.10–0.30** | batch script รันครั้งเดียว 101 รูป ~10 นาที | ต้องมี API key |\n| **Ideogram / Recraft** | ~$10–20/เดือน | สม่ำเสมอสูง มี style reference | เสียรายเดือน |\n\n**แนะนำ:** Replicate Flux — ถูกสุด เร็วสุด และเป็น pipeline ที่รันซ้ำได้ตอนทำ Day 105–448\n(ถ้าอยากได้ตัวละคร Leo/Mimi/Sam หน้าเดิมทุกวัน ต้องใช้ตัวที่รองรับ character reference เช่น Ideogram)\n\n---\n\n## ✅ QA ก่อน commit\n\n- [ ] ไม่มีตัวหนังสือ/ตัวเลขในรูป (โมเดลชอบแอบใส่)\n- [ ] พื้นครีม ไม่ใช่ขาวล้วน\n- [ ] เด็กเป็นเอเชีย ไม่ใช่ฝรั่งในห้องเรียนต่างประเทศ\n- [ ] เด็กกำลังทำอะไรอยู่ ไม่ใช่นั่งยิ้มมองกล้อง\n- [ ] ขนาด 800×400 (หน้าเว็บ crop เป็น `max-height:220px`)\n- [ ] ชื่อไฟล์ `img_dayN.png` ตรงเลขวัน\n", "LAUNCH_PLAN": "# 🚀 แผนเปิดตัว PeekaWord\n\nตรวจสถานะจริงเมื่อ 2026-08-29 — **ยังไม่ 100% เหลือ 4 ข้อ**\n\n---\n\n# ✅ ยืนยันแล้วว่าขึ้นเว็บจริง\n\nเช็กจาก https://peekaword.pages.dev/English/ โดยตรง\n\n- หน้าแรกใหม่ — พาดหัว \"ท่องศัพท์แล้วลืม\" · ส่วน \"เหมาะกับใคร\" · ตัวอย่างรายงาน · ราคาอยู่ล่างสุด\n- ทดลองฟรี 7 วันเต็ม ไม่มี email gate\n- `js/report.js` + `js/protect.js` ขึ้นครบ (ลายน้ำ + เก็บคะแนนรายทักษะ)\n- FAQ อัปเดตแล้ว\n\n---\n\n# ⬜ 4 ข้อที่ต้องทำก่อนบอกใคร\n\n## 1. ยืนยันว่า Code.gs เป็น v6 แล้ว ⏱️ 30 วินาที\n\nเปิดลิงก์นี้ในเบราว์เซอร์:\n\n```\nhttps://script.google.com/macros/s/AKfycbz8SuCV8PsUkIElDN3rFm9eE1TKm0UOFS5M_u6TrHmxkslAOQuopYmv3IFM0JBoRYq-/exec?action=version\n```\n\nต้องได้ `\"version\":\"v6\"` และมี `\"skill-sync\"`\n\n**ถ้ายังเป็น v4/v5** → คะแนนรายทักษะไม่ถูกเก็บ + ข้อมูลติดต่อลูกค้าไม่ถูกบันทึก\nทำตาม `DEPLOY_v5.md` (ขั้นตอนเดียวกัน)\n\n## 2. เพิ่มแถวในชีต ⏱️ 2 นาที\n\n**ชีต Config** — เพิ่ม 3 แถว:\n\n| key | value |\n|---|---|\n| `payee_last4` | เลข 4 ตัวท้ายบัญชีที่รับเงิน |\n| `site_url` | `https://peekaword.pages.dev/English/` |\n| `pts_full_day` | `50` |\n\n**ชีต Progress** — แถวที่ 1 คอลัมน์ G, H, I:\n\n```\nsk_read    sk_speak    sk_write\n```\n\n## 3. ทดสอบซื้อจริง 1 รายการ ⏱️ 10 นาที ← **ห้ามข้าม**\n\nโอนเงินตัวเอง 1 บาท แล้วทำครบทุกขั้น:\n\n- [ ] เปิด `register.html` → เลือกแพ็กเกจ\n- [ ] กรอกชื่อ/อีเมล/เบอร์ + แนบสลิป → กดส่ง\n- [ ] เปิดชีต **Purchases** → ต้องเห็นชื่อ เบอร์ อีเมล ครบ **ไม่ว่าง**\n- [ ] ลงทะเบียน → ตั้งรหัสผ่าน\n- [ ] logout แล้ว login ด้วยอีเมล+รหัสผ่าน → เข้าได้\n- [ ] เรียน Day 1 จนจบ → เปิดชีต **Progress** ต้องมี `sk_read` `sk_speak` `sk_write`\n- [ ] เปิด `teacher.html` → กด 📊 → เห็นคะแนนรายทักษะ\n- [ ] ลบข้อมูลทดสอบออกจากชีต\n\n**ถ้าข้อไหนไม่ผ่าน หยุดทันที อย่าเปิดขาย**\n\n## 4. ตั้ง Analytics ⏱️ 15 นาที ← **สำคัญกว่าที่คิด**\n\nตอนนี้เว็บ **ไม่มีระบบเก็บสถิติใด ๆ เลย** ยิงคอนเทนต์ไปก็ไม่รู้ว่า:\n\n- คนเข้ามากี่คน มาจากช่องทางไหน\n- กี่คนกดเข้า Day 1 · กี่คนเรียนจบ Day 1 · กี่คนไปถึง Day 7\n- กี่คนเปิดหน้ารายงาน · กี่คนกดดูแพ็กเกจ\n- หลุดตรงไหนมากที่สุด\n\nถ้าไม่มีข้อมูลนี้ จะปรับปรุงไม่ถูกจุด และเสียเงินค่าโฆษณาฟรี\n\n**ทางเลือก**\n\n| เครื่องมือ | ราคา | ข้อดี |\n|---|---|---|\n| Cloudflare Web Analytics | ฟรี | อยู่ใน Cloudflare อยู่แล้ว · ไม่ใช้คุกกี้ · ติดบรรทัดเดียว |\n| Google Analytics 4 | ฟรี | ละเอียดสุด ทำ funnel ได้ · ตั้งค่าซับซ้อนกว่า |\n| เก็บเองในชีต | ฟรี | คุมข้อมูลเอง · ผมเขียนให้ได้ |\n\n**แนะนำ: Cloudflare Web Analytics** สำหรับ traffic + **เก็บ event เองในชีต** สำหรับ funnel\n\n---\n\n# 📣 แผนประชาสัมพันธ์\n\n## จุดขายที่แข็งที่สุด 3 อย่าง\n\n1. **ไม่ต้องสมัคร กดเข้าเรียนได้เลย** — คู่แข่งเกือบทุกเจ้าบังคับ add LINE หรือกรอกฟอร์มก่อน\n2. **รายงานบอกว่าลูกควรฝึกด้านไหน** — ไม่ใช่แค่ \"เรียนจบแล้ว\" แต่บอกว่าทำอะไรต่อ\n3. **จ่ายครั้งเดียว ไม่มีรายเดือน** — พ่อแม่ไทยเบื่อ subscription\n\n## ลำดับการเปิด — อย่ายิงสาธารณะเลย\n\n### สัปดาห์ 0 — Soft launch (5–10 คน)\n\nส่งให้คนรู้จักที่มีลูกวัย 5–12 ลองใช้จริง **ยังไม่ต้องขาย**\n\nขอ feedback 3 ข้อ:\n- ลูกเข้าใจว่าต้องทำอะไรมั้ย ไม่ต้องมีคนอธิบาย\n- ไมค์ทำงานบนเครื่องเขามั้ย\n- เรียนจบ Day 1 ใช้เวลาเท่าไหร่จริง\n\n**เป้าหมาย: หาบั๊กที่เหลือ ก่อนคนจ่ายเงินจะเจอ**\n\n### สัปดาห์ 1 — เปิด 30 ที่นั่ง\n\nประกาศพร้อมกันทุกช่องทาง เน้นว่า **ลองฟรีก่อนได้ ไม่ต้องสมัคร**\n\n### สัปดาห์ 2+ — ตามผลจริง\n\nดูจาก analytics ว่าหลุดตรงไหน แล้วแก้จุดนั้นก่อนดันต่อ\n\n---\n\n## คอนเทนต์ 6 ชิ้นแรก\n\nใช้หลักที่คุณส่งมา: **ไม่พูดว่าของเราดี · พูดถึงปัญหาที่หายไป · บอกว่าเหมาะกับใคร**\n\n### 1. \"ลูกท่องศัพท์ได้ 100 คำ แต่พูดไม่ออกสักคำ\"\nเปิดด้วยปัญหาที่พ่อแม่พยักหน้าตาม → เพราะท่องอย่างเดียวไม่เคยได้ใช้\n→ ปิดท้าย: ลองให้ลูกอ่านออกเสียงแล้วให้ AI ฟัง ฟรี ไม่ต้องสมัคร\n\n### 2. อัดจอจริงตอนลูกพูดแล้ว AI ให้คะแนน\nคอนเทนต์ที่ขายตัวเองที่สุด — เห็นเลขขึ้นทันที ไม่ต้องอธิบาย\nใช้เสียงเด็กจริง (ขออนุญาตผู้ปกครองก่อน)\n\n### 3. โชว์หน้ารายงานผล\n\"เรียน 7 วันแล้วรู้เลยว่าลูกควรฝึกด้านไหน\"\nจับภาพหน้าจอจริง — อ่าน 82% พูด 68% เขียน 54%\n\n### 4. \"3 แบบที่ไม่เหมาะกับคอร์สนี้\"\nบอกว่าใครไม่ควรซื้อ → คนเชื่อถือมากขึ้น และคนที่ซื้อคือคนที่ใช่\n(เอาจากส่วน \"ยังไม่เหมาะ\" ในหน้าแรกได้เลย)\n\n### 5. \"ทำไมต้อง 448 วัน ไม่ใช่ 30 วัน\"\nอธิบายว่า 3,000 คำใน 30 วันเป็นไปไม่ได้ — ตอบโจทย์คนที่สงสัยว่าทำไมช้า\nสร้างความน่าเชื่อถือด้วยการไม่สัญญาเกินจริง\n\n### 6. เบื้องหลัง — คำศัพท์เรียงตาม Oxford 3000 ไม่ได้สุ่ม\nโชว์ตาราง A1 → B2 · Day 1 คำว่า cat, Day 447 คำว่า unwavering\n\n## ช่องทาง\n\n| ช่องทาง | ทำอะไร |\n|---|---|\n| **TikTok / Reels** | คอนเทนต์ 1–3 · พ่อแม่ไทยอยู่เยอะที่สุด |\n| **กลุ่ม Facebook พ่อแม่** | อ่านกฎกลุ่มก่อน หลายกลุ่มห้ามขายตรง — แชร์แบบให้ความรู้แล้วแปะลิงก์ทดลองฟรี |\n| **LINE OA @PeekaWord** | มีอยู่แล้ว · ตั้งข้อความต้อนรับให้ส่งลิงก์ทดลองฟรีอัตโนมัติ |\n\n## ⚠️ ข้อควรระวัง\n\n- **อย่าใช้ hook แนวขู่พ่อแม่** เช่น \"ลูกคุณกำลังตามหลังเพื่อน\" — ได้ยอดเร็วแต่คนซื้อเพราะกลัวมักขอคืนเงิน และเสียชื่อระยะยาว\n- **อย่าสัญญาผลลัพธ์ที่วัดไม่ได้** เช่น \"พูดได้ใน 30 วัน\" — คุณมีข้อมูลจริงจากระบบอยู่แล้ว ใช้ตัวเลขจริงดีกว่า\n- **ขออนุญาตก่อนใช้ภาพ/เสียงเด็ก** ทุกครั้ง แม้เป็นลูกหลานตัวเอง\n- **เตรียมรับมือ 30 ที่นั่งเต็มเร็ว** — ตัดสินใจไว้ล่วงหน้าว่าจะขึ้นราคาตามที่ประกาศ หรือขยายที่นั่ง (ถ้าขยายต้องบอกเหตุผลให้ชัด ไม่งั้นเสียความน่าเชื่อถือ)\n\n---\n\n## ตัวเลขที่ควรจับตั้งแต่วันแรก\n\n| ตัวเลข | เกณฑ์ที่พอใช้ได้ |\n|---|---|\n| เข้าหน้าแรก → กดทดลอง | > 30% |\n| กดทดลอง → เรียนจบ Day 1 | > 40% |\n| เรียนจบ Day 1 → ถึง Day 7 | > 20% |\n| ถึง Day 7 → กดดูแพ็กเกจ | > 25% |\n\nถ้าตัวไหนต่ำกว่านี้มาก แปลว่าปัญหาอยู่ตรงนั้น ไม่ใช่ที่ราคา\n", "LAUNCH_READINESS": "# 🚦 ความพร้อมก่อนเปิดขาย — ตรวจ 2026-08-29\n\n## ✅ ทดลองเรียนฟรี 7 วัน — มีแล้ว ใช้ได้\n\nไฟล์ `trial.html` · เข้าจาก `index.html` 2 จุด\n\n| | |\n|---|---|\n| **Day 1–3** | เปิดเลย ไม่ต้องกรอกอะไร |\n| **Day 4–7** | ปลดล็อกหลังกรอก **ชื่อเล่น + อีเมล** |\n| **วันหมดอายุ** | ❌ ไม่มี — ปลดแล้วปลดถาวร (ตั้งใจให้เป็นแบบนี้) |\n| **ปนกับบัญชีจริงมั้ย** | ✅ ไม่ปน — ตั้ง `wla_last_code='TRIAL'` กันไว้ |\n| **เตือน LINE/FB browser** | ✅ มี (ไมค์ใช้ไม่ได้ใน in-app browser) |\n| **ปุ่มไปสมัคร / เข้าสู่ระบบ** | ✅ มีทั้งคู่ |\n\n> ถ้าอยากให้ **หมดอายุใน 7 วันจริง** บอกได้ ตอนนี้ปลดแล้วเรียนได้ตลอด\n\n## ✅ Login — พร้อม\n\n`login.html` + `reset.html`\n\n- เข้าด้วย **อีเมล + รหัสผ่าน**\n- เข้าครั้งแรกด้วยรหัสนักเรียน → บังคับตั้งอีเมล+รหัสผ่าน\n- **ลืมรหัสผ่าน** → ส่งลิงก์ทางอีเมล หมดอายุ 30 นาที\n- **ลืมรหัสนักเรียน** → กู้ด้วยอีเมล\n- เปลี่ยนบัญชี → ล้าง progress เก่าอัตโนมัติ\n- `dashboard.html` มี guard เด้งไป login ถ้าไม่มี session\n\n## ✅ Register — พร้อมแล้ว (เพิ่งอุดช่องโหว่ใหญ่)\n\nลำดับ: เลือกแพ็กเกจ → **จ่ายเงิน + กรอกข้อมูลติดต่อ + แนบสลิป** → ตรวจสลิปอัตโนมัติ → ลงทะเบียน → ตั้งรหัสผ่าน\n\n---\n\n# 🔴 บั๊กที่เจอตอนตรวจครั้งนี้ (แก้แล้วทั้งหมด)\n\n## 1. จ่ายเงินแล้วไม่รู้ว่าใครโอน ← ร้ายแรงที่สุด\n\n**อาการเดิม:** `newPurchase` ส่งแค่ `order_id, pkg, price, type`\nคอลัมน์ **name / phone / email** ในชีต `Purchases` **ว่างเปล่า**\n\n**ผลถ้าไม่แก้:** ลูกค้าโอนเงิน → แนบสลิป → ปิดหน้าเว็บก่อนกรอกชื่อ\n→ คุณมี **เงินเข้าบัญชี + สลิปในไดรฟ์ แต่ไม่รู้ว่าใคร ติดต่อกลับไม่ได้เลย**\nยิ่งเปิดขาย 30 ที่นั่งพร้อมกัน ยิ่งมีโอกาสเจอ\n\n**แก้แล้ว:**\n- เพิ่ม **ชื่อผู้โอน / อีเมล / เบอร์โทร** บนหน้าจ่ายเงิน (บังคับกรอก อยู่**ก่อน**ช่องแนบสลิป)\n- `newPurchase` ส่งครบ 3 ค่า\n- `Code.gs` เขียนลงคอลัมน์ที่ถูกต้อง (`orderId, name, phone, existingCode, email, ...`)\n- ข้อมูลถูก **เติมให้อัตโนมัติ** ในฟอร์มลงทะเบียน — ผู้ปกครองไม่ต้องพิมพ์ซ้ำ\n\n## 2. ทดลองเรียนเก็บ lead ไม่ได้จริง\n\n**อาการเดิม:** ขอชื่อ+อีเมลเพื่อปลดล็อก Day 4–7 แต่โค้ด**ไม่ได้ส่งไป backend**\nเก็บแค่ใน localStorage ของเครื่องเด็ก → **คุณไม่ได้ lead สักคน**\n\n**แก้แล้ว:** ส่ง `name` + `email` ไปเก็บในชีต `Purchases` (type = `trial`)\nถ้า backend ล่ม ยังปลดล็อกให้เด็กเหมือนเดิม ไม่กั้น\n\n---\n\n# ⬜ ยังต้องทำก่อนเปิดขายจริง\n\n| # | เรื่อง | ใครทำ | หมายเหตุ |\n|---|---|---|---|\n| 1 | **Deploy Code.gs ใหม่** | คุณ | แก้ `actionNewPurchase` แล้ว ต้อง Deploy → Manage deployments → **New version** |\n| 2 | **เพิ่ม Config 3 แถว** ในชีต | คุณ | `payee_last4` · `site_url` · `pts_full_day`=50 (ดู `DEPLOY_NOW.md`) |\n| 3 | **ใส่ SlipOK API key** | คุณ | ยังไม่ใส่ = ตกไปที่ครูตรวจมือ ระบบไม่พัง |\n| 4 | **ทดสอบซื้อจริง 1 รายการ** | คุณ | โอน 1 บาทเข้าตัวเอง → ดูว่าชีต Purchases มีชื่อ/อีเมล/เบอร์ครบ |\n| 5 | รูปประกอบบทเรียน | เลื่อนได้ | ไม่กระทบการเรียน |\n| 6 | Cloudflare Worker กันเปิดไฟล์ตรง | เลื่อนได้ | ตอนนี้เปิด URL ตรงได้โดยไม่ล็อกอิน |\n\n## ⚠️ ข้อ 4 สำคัญมาก\nอย่าเปิดขายก่อนทดสอบซื้อจริง 1 รายการให้ครบ flow\nเพราะจุดที่พังบ่อยที่สุดคือ **ลืม Deploy version ใหม่** แล้ว backend ยังเป็นโค้ดเก่า\n\n---\n\n## การทดสอบที่รันแล้ว\n\n`/tmp/qa/t_flow.js` — 21 เคส ผ่านหมด\nครอบคลุม: ตำแหน่งช่องกรอก · การตรวจก่อนส่ง · พารามิเตอร์ที่ส่งไป backend ·\nคอลัมน์ที่เขียนลงชีต · การเติมฟอร์มอัตโนมัติ · ไม่ทับค่าที่ผู้ใช้พิมพ์เอง\n\nJS syntax ผ่านทั้ง `register.html` · `trial.html` · `login.html` · `Code.gs`\n", "Level2_Plan_Day31-60": "# 📘 Level 2 Plan — Day 31–60 (A1 ต่อ)\n\n> Oxford 3000 Word Adventure | CEFR: A1 | 6 คำ/วัน | ~168 คำใหม่\n> ตรวจสอบแล้ว: ไม่ซ้ำกับคำ Day 1–30\n\n---\n\n## ภาพรวม 4 สัปดาห์\n\n| Week | Days | Theme | สีประจำสัปดาห์ | คำใหม่ |\n|------|------|-------|---------------|--------|\n| 5 | 31–37 | 🙋 My Body & Senses | Coral `#FF8A65` | 36 |\n| 6 | 38–44 | 👕 Clothes & Dressing | Purple `#BA68C8` | 36 |\n| 7 | 45–51 | 🌦️ Weather & Seasons | Sky Blue `#4FC3F7` | 36 |\n| 8 | 52–58 | 🏙️ My Town | Teal `#4DB6AC` | 36 |\n| — | 59–60 | 🚗 Transport (เริ่มต้น) | Amber `#FFB300` | 12 |\n\n**Narrative arc:** Leo กับ Mimi (ตัวละครเดิมจาก Level 1) เรียนรู้เกี่ยวกับร่างกายตัวเอง → แต่งตัวไปเที่ยว → เจอสภาพอากาศ 4 ฤดู → สำรวจเมือง → ขึ้นรถออกเดินทางสู่ Level 3\n\n**ตัวละคร:** Leo (สิงโตน้อยใจกล้า สีทอง) และ Mimi (แมวน้อยขี้สงสัย สีขาวส้ม) — original characters ต่อเนื่องจาก Level 1\n\n---\n\n## 🙋 Week 5 — My Body & Senses (Day 31–37)\n\n### Day 31 — My Face\n| # | Word | POS | Thai | ตัวอย่าง |\n|---|------|-----|------|---------|\n| 1 | head | n | หัว | Touch your head! |\n| 2 | face | n | ใบหน้า | Leo has a happy face. |\n| 3 | eye | n | ตา | I have two eyes. |\n| 4 | ear | n | หู | Mimi has small ears. |\n| 5 | nose | n | จมูก | My nose is little. |\n| 6 | mouth | n | ปาก | Open your mouth! |\n\nStory seed: Leo ส่องกระจกครั้งแรก แล้วชวน Mimi เล่นเกมชี้อวัยวะบนใบหน้า\n\n### Day 32 — My Body\n| # | Word | POS | Thai | ตัวอย่าง |\n|---|------|-----|------|---------|\n| 1 | body | n | ร่างกาย | My body is strong. |\n| 2 | hair | n | ผม | Mimi has soft hair. |\n| 3 | hand | n | มือ | Wave your hand! |\n| 4 | arm | n | แขน | Leo has two arms. |\n| 5 | leg | n | ขา | My legs can run. |\n| 6 | foot | n | เท้า | One foot, two feet! |\n\nStory seed: Leo กับ Mimi เต้นเพลง body dance ขยับทีละส่วน\n\n### Day 33 — Smile & Laugh\n| # | Word | POS | Thai | ตัวอย่าง |\n|---|------|-----|------|---------|\n| 1 | tooth | n | ฟัน | Brush your teeth! |\n| 2 | finger | n | นิ้วมือ | Count your fingers. |\n| 3 | neck | n | คอ | The giraffe has a long neck. |\n| 4 | smile | v | ยิ้ม | Mimi smiles every day. |\n| 5 | laugh | v | หัวเราะ | Leo laughs — ha ha! |\n| 6 | cry | v | ร้องไห้ | Do not cry, Leo. |\n\nStory seed: Mimi เล่าเรื่องตลกให้ Leo ฟังจนหัวเราะ ฟันขาวๆ โผล่มา\n\n### Day 34 — Five Senses\n| # | Word | POS | Thai | ตัวอย่าง |\n|---|------|-----|------|---------|\n| 1 | see | v | มองเห็น | I can see a bird. |\n| 2 | hear | v | ได้ยิน | Can you hear the song? |\n| 3 | smell | v | ดมกลิ่น | Smell the flower! |\n| 4 | taste | v | ชิมรส | Taste the sweet cake. |\n| 5 | touch | v | สัมผัส | Touch the soft cat. |\n| 6 | feel | v | รู้สึก | I feel happy today. |\n\nStory seed: Leo กับ Mimi เล่นเกมปิดตา ทายของด้วยประสาทสัมผัสทั้ง 5\n\n### Day 35 — Move Your Body!\n| # | Word | POS | Thai | ตัวอย่าง |\n|---|------|-----|------|---------|\n| 1 | stand | v | ยืน | Stand up, please! |\n| 2 | dance | v | เต้น | Mimi loves to dance. |\n| 3 | wash | v | ล้าง | Wash your hands! |\n| 4 | brush | v | แปรง | Brush your hair. |\n| 5 | move | v | ขยับ | Move your arms! |\n| 6 | carry | v | ถือ/แบก | Leo can carry the bag. |\n\nStory seed: เช้าวันใหม่ของ Leo — ตื่น ยืน ล้างหน้า แปรงฟัน แล้วเต้นไปโรงเรียน\n\n### Day
