|\n| 🔴 รหัสใน object/JSON | `{ api_key: '...' }` |\n| 🔴 คีย์ผู้ให้บริการ | `sk_live_` · `sk-` · `AIza` · `ghp_` · `xox[bapr]-` |\n| 🟠 รหัสที่เคยรั่ว | กันไม่ให้นำกลับมาใช้ซ้ำ |\n| 🟠 เลขบัญชี / พร้อมเพย์ | |\n| 🟡 เบอร์โทรส่วนตัว | |\n\nท้ายผลยังลิสต์ URL ของไฟล์ใน `_docs/` ที่เปิดจากเน็ตได้ ให้เห็นทุกครั้ง\n\n**ทดสอบแล้วว่าจับได้จริง** — ลองใส่คีย์ปลอม 3 แบบ จับครบ 3 แล้วลบออกกลับมาสะอาด\n`--strict` ตอบ exit code 1 เอาไปใส่ CI ได้\n\n**ทำให้เป็นนิสัย: รันก่อน `git push` ทุกครั้ง**\n\n---\n\n# ⚠️ ที่ยังแก้ไม่ได้ด้วยวิธีนี้\n\nไฟล์ยัง public อยู่เหมือนเดิม แค่ไม่มีความลับข้างใน ถ้าอยากปิดจริงต้องเลือก:\n\n| วิธี | ผล |\n|---|---|\n| ตั้ง **Build output directory** ใน Cloudflare Pages ให้ชี้โฟลเดอร์ที่ไม่มี `Code.gs` / `_docs/` | ปิดได้จริง · ต้องจัดโครงสร้างโฟลเดอร์ใหม่ |\n| **Cloudflare Access** คุม path `/English/_docs/*` | ฟรีถึง 50 ผู้ใช้ · ตั้งในหน้า Cloudflare ไม่ต้องแก้โค้ด |\n| ย้าย `Code.gs` + `_docs/` ออกไปอีก repo | ง่ายสุด แต่แยกที่เก็บ |\n\n**แต่ต่อให้ปิดได้ เนื้อหา `Level*/Day*.html` ก็ยังเปิดตรงจาก URL ได้อยู่ดี** — อันนั้นต้อง Cloudflare Worker\n", "SETUP_NEW_SHEET": "# 🆕 วางระบบใหม่บน Google Sheet ใหม่\n\nใช้เวลารวม ~15 นาที · ทำตามลำดับ ห้ามข้าม\n\n---\n\n## ทำไมถึงคุ้มที่จะเริ่มใหม่\n\nชีตเดิม (`LexiGo`) มีแต่ข้อมูลทดสอบ — รหัส `123456` · `789454` · `182018` รวม **13 แถว ไม่มีลูกค้าจริง**\nและชีตเดิมสร้างสมัยโค้ดยังเป็น v3 หัวคอลัมน์เลยไม่ครบ\n\n**เริ่มใหม่แล้วได้เปรียบตรงนี้:** Code.gs จะ**สร้างทุกแท็บพร้อมหัวคอลัมน์ที่ถูกต้องให้เอง**\nรวมถึง `sk_read` · `sk_speak` · `sk_write` ที่ชีตเก่าต้องพิมพ์เพิ่มเอง\n\n---\n\n## ⚠️ จุดที่ต้องรู้ก่อนเริ่ม\n\nSheet ใหม่ → Apps Script ใหม่ → **URL ใหม่**\nซึ่งเว็บ hardcode URL เดิมไว้ **462 จุด ใน 462 ไฟล์**\n\nเตรียมสคริปต์เปลี่ยนให้แล้ว รันคำสั่งเดียวจบ (ขั้นที่ 5) **อย่าแก้มือ**\n\n---\n\n# ขั้นที่ 1 — สร้าง Sheet ใหม่\n\n1. เปิด https://sheets.new\n2. ตั้งชื่อไฟล์ เช่น **PeekaWord DB**\n3. ไม่ต้องสร้างแท็บหรือพิมพ์หัวคอลัมน์อะไรทั้งนั้น — โค้ดสร้างให้เอง\n\n# ขั้นที่ 2 — ใส่โค้ด\n\n1. ในชีตใหม่ → **Extensions → Apps Script**\n2. ลบโค้ดตัวอย่าง (`function myFunction() {}`) ให้หมด — `Ctrl+A` → `Delete`\n3. เปิด `C:\\Users\\user\\Documents\\GitHub\\lexigo\\English\\Code.gs` ด้วย Notepad\n   → `Ctrl+A` → `Ctrl+C`\n4. กลับมาวางใน Apps Script → `Ctrl+V` → `Ctrl+S`\n5. ตั้งชื่อ project (ถ้าถาม) เช่น **PeekaWord API**\n\n# ขั้นที่ 3 — Deploy ครั้งแรก\n\n1. กด **Deploy** มุมขวาบน → **New deployment**\n   *(รอบนี้ใช้ New deployment ได้ เพราะเป็นของใหม่)*\n2. กดไอคอน **⚙️ เฟือง** ข้างคำว่า \"Select type\" → เลือก **Web app**\n3. ตั้งค่า **สำคัญมาก ทั้ง 2 ช่อง**\n\n   | ช่อง | ต้องเลือก |\n   |---|---|\n   | Execute as | **Me (pasasorn@gmail.com)** |\n   | Who has access | **Anyone** ← ไม่ใช่ \"Anyone with Google account\" |\n\n   > ถ้าเลือก \"Anyone with Google account\" เด็กที่ไม่ได้ล็อกอิน Google จะใช้ไม่ได้เลย\n\n4. กด **Deploy**\n5. Google จะขอสิทธิ์ → **Authorize access** → เลือกบัญชี →\n   ถ้าขึ้น *\"Google hasn't verified this app\"* → กด **Advanced** → **Go to … (unsafe)** → **Allow**\n   *(ปลอดภัย เพราะเป็นสคริปต์ของคุณเอง)*\n6. **คัดลอก Web app URL** ที่ได้ หน้าตาแบบนี้\n\n   ```\n   https://script.google.com/macros/s/AKfycb................../exec\n   ```\n\n# ขั้นที่ 4 — ตรวจว่า deploy ติด\n\nวาง URL ที่ได้ในเบราว์เซอร์ แล้วต่อท้ายด้วย `?action=version`\n\nต้องได้:\n\n```json\n{\"status\":\"ok\",\"version\":\"v6\",\"deployed\":\"2026-08-29\",\n \"features\":[..., \"skill-sync\", \"purchase-contact-info\"]}\n```\n\n- ✅ ได้ `v6` → ไปขั้นที่ 5\n- ❌ ขึ้นหน้าขอ login → กลับไปแก้ **Who has access** เป็น **Anyone**\n\n# ขั้นที่ 5 — เปลี่ยน URL ในเว็บทั้ง 462 จุด\n\n```powershell\ncd C:\\Users\\user\\Documents\\GitHub\\lexigo\\English\n\npy _docs\\set_api_url.py --show\n```\n\nดูว่าตอนนี้ใช้ URL อะไรอยู่ แล้วเปลี่ยน (ใส่ URL ใหม่ในเครื่องหมายคำพูด):\n\n```powershell\npy _docs\\set_api_url.py \"https://script.google.com/macros/s/วาง_URL_ใหม่_ที่นี่/exec\"\n```\n\nต้องขึ้น:\n\n```\nเปลี่ยนแล้ว 462 จุด ใน 462 ไฟล์\nเหลือ URL เก่าค้าง: ไม่มี ✅\n```\n\n> **ถ้าเปลี่ยนผิด** — `py _docs\\set_api_url.py --undo` ย้อนกลับได้ทันที (ทดสอบแล้ว)\n\n# ขั้นที่ 6 — ตั้งค่าในชีต\n\nกลับไปที่ Sheet ใหม่ แท็บต่าง ๆ จะยังไม่มี **จนกว่าจะมีคนเรียก API ครั้งแรก**\nลองเปิด `?action=version` ไปแล้วอาจยังไม่สร้าง — ให้เรียกอันนี้แทนเพื่อบังคับสร้าง:\n\n```\n<URL ใหม่>?action=checkCode&code=123456\n```\n\nจากนั้นในชีตจะมีแท็บ **Students · Progress · Config · QuizAttempts · QuizScores**\n\nไปที่แท็บ **Config** แล้วพิมพ์ 3 แถวนี้ (คอลัมน์ A = key, B = value):\n\n| key | value |\n|---|---|\n| `payee_last4` | เลข 4 ตัวท้ายบัญชีที่รับเงิน |\n| `site_url` | `https://peekaword.pages.dev/English/` |\n| `pts_full_day` | `50` |\n\n> แท็บ **Progress** ไม่ต้องทำอะไร — หัวคอลัมน์ `sk_read` `sk_speak` `sk_write` ถูกสร้างให้แล้ว\n\n# ขั้นที่ 7 — ตรวจทั้งระบบ\n\nเปิด `_docs\\check_backend.html` (ไฟล์นี้ถูกเปลี่ยน URL ให้แล้วในขั้นที่ 5)\n\n1. กด **▶ เริ่มตรวจ** — ต้องผ่านครบ 5 ข้อ\n2. กด **▶ ตรวจการเขียน** — ต้องผ่านครบ 4 ข้อ\n   ข้อสำคัญคือ *\"อ่านคะแนนรายทักษะกลับมา ต้องตรงกับที่ส่งไป\"* → `82 / 68 / 54`\n\n# ขั้นที่ 8 — push ขึ้นเว็บ\n\n```powershell\ngit add -A\ngit commit -m \"chore: point API to new Google Sheet backend\"\ngit push\n```\n\nรอ Cloudflare deploy ~1 นาที แล้วทดสอบบนเว็บจริง\n\n---\n\n# ✅ เช็กลิสต์\n\n- [ ] Sheet ใหม่ + วาง Code.gs + Save\n- [ ] Deploy → Web app → **Execute as: Me** + **Who has access: Anyone**\n- [ ] `?action=version` ได้ `\"v6\"` และมี `\"skill-sync\"`\n- [ ] `py _docs\\set_api_url.py \"<URL ใหม่>\"` → 462 จุด เหลือเก่า 0\n- [ ] เรียก `?action=checkCode&code=123456` เพื่อให้สร้างแท็บ\n- [ ] Config เพิ่ม `payee_last4` · `site_url` · `pts_full_day`\n- [ ] `check_backend.html` ผ่านทั้ง 2 ส่วน\n- [ ] push GitHub\n- [ ] **ทดสอบซื้อจริง 1 บาทให้ครบ flow** ← อย่าข้าม\n- [ ] ลบข้อมูลทดสอบออกจากชีต\n\n---\n\n# สิ่งที่ยังต้องตั้งเพิ่ม (ถ้าจะเปิดขาย)\n\n| เรื่อง | ทำที่ไหน |\n|---|---|\n| **SlipOK API key** ตรวจสลิปอัตโนมัติ | แท็บ Config — ดูชื่อ key ใน `Code.gs` ส่วน PART 1 |\n| **รหัสครู** (ตอนนี้ `<รหัสครูของคุณ>`) | `Code.gs` บรรทัด 13 `TEACHER_PASS` — **ควรเปลี่ยนก่อนเปิดขาย** |\n| **Analytics** | ยังไม่มีทั้งเว็บ — Cloudflare Web Analytics ติดบรรทัดเดียว |\n\n---\n\n# ชีตเก่ายังอยู่\n\n`LexiGo` ไม่ถูกลบ เก็บไว้เป็นสำรองได้\nhttps://docs.google.com/spreadsheets/d/1Bw39gtFwaFyoHKerWdxyrUecxZZgB-JFnFx8mMSlnQQ/edit\n\nถ้าระบบใหม่ใช้ได้ดีแล้วค่อยลบทีหลัง\n", "SLIP_AND_LOGIN_SETUP": "# 🔐 PeekaWord — ตรวจสลิปอัตโนมัติ + Login ด้วย Email/Password\n\n> อัปเดต: 2026-07-29 · **เก็บเป็นความลับ**\n\n---\n\n## ✅ ต้องทำ 3 อย่างก่อนใช้งานได้\n\n### 1. สมัคร SlipOK แล้วเอา API key มาใส่\n\n1. ไป https://slipok.com → สมัคร → ยืนยันบัญชีธนาคาร/พร้อมเพย์ที่ใช้รับเงิน\n2. **แพ็กฟรี = 100 สลิป/เดือน** พอสำหรับตอนนี้ (ถ้าเกิน มีแพ็กเริ่ม ~210 บาท/เดือน)\n3. คัดลอก API key\n4. เปิด Google Sheet → ชีต **Config** → หาแถว `slipok_api_key` → วาง key ทับ `YOUR_SLIPOK_KEY_HERE`\n5. เพิ่มแถวใหม่ (ถ้ายังไม่มี):\n\n| key | value |\n|-----|-------|\n| `payee_last4` | 4 ตัวท้ายเลขบัญชี/พร้อมเพย์ที่รับเงิน เช่น `4821` |\n| `site_url` | `https://peekaword.pages.dev/English/` |\n\n> `payee_last4` คือชั้นกันคนส่งสลิปที่โอนเข้าบัญชีคนอื่น — **ควรใส่**\n> ถ้าเว้นว่าง ระบบจะข้ามการเช็กข้อนี้\n\n### 2. Deploy Code.gs\n\nApps Script → วาง Code.gs ทับ → Save →\n**Deploy → Manage deployments → ✏️ edit → Version: New version → Deploy**\n\n> ⚠️ อย่ากด \"New deployment\" เพราะ URL จะเปลี่ยน ทุกหน้าจะพัง\n\n### 3. Push ไฟล์เว็บขึ้น GitHub\n\n`login.html` · `reset.html` (ใหม่) · `register.html` · `Code.gs`\n\n---\n\n## 🔎 ตรวจสลิปอัตโนมัติทำงานยังไง\n\nลูกค้าอัปสลิป → ระบบตรวจ **4 ชั้น** ภายใน ~5 วินาที:\n\n| ชั้น | กันอะไร |\n|------|---------|\n| 1. อ่าน QR จริงจากธนาคาร | สลิปแต่งรูป / capture ปลอม |\n| 2. ยอดเงินตรงราคาแพ็กเกจ | โอนน้อยกว่าที่ต้องจ่าย |\n| 3. เลขบัญชีปลายทางตรง `payee_last4` | โอนเข้าบัญชีคนอื่นแล้วส่งสลิปมา |\n| 4. `transRef` ไม่ซ้ำใน UsedSlips | เอาสลิปเก่าใช้ซ้ำ / คนละคนส่งสลิปเดียวกัน |\n\n**ผลลัพธ์ 3 แบบ:**\n\n| ผล | เกิดเมื่อ | ระบบทำอะไร |\n|----|----------|-----------|\n| ✅ `ok` | ผ่านทั้ง 4 ชั้น | **ออกรหัสนักเรียนทันที** ไม่ต้องรอครู |\n| ❌ `reject` | ยอดผิด / บัญชีผิด / สลิปซ้ำ | แจ้งเหตุผลให้ลูกค้าแก้ ไม่ให้ผ่าน |\n| ⏳ `manual` | API ล่ม / ยังไม่ใส่ key / สลิปเก่า >24 ชม. | ส่งให้ครูตรวจใน `teacher.html` เหมือนเดิม |\n\n> ออกแบบให้ **API ล่มแล้วลูกค้าไม่ตกหล่น** — ตกไปที่การตรวจมือเสมอ ไม่ปฏิเสธเงินลูกค้า\n\n---\n\n## 🔑 Login ด้วย Email + Password\n\n**หน้า login มี 2 แท็บ:**\n\n- **📧 อีเมล + รหัสผ่าน** ← ทางหลักจากนี้ไป\n- **🔢 รหัสนักเรียน** ← ลูกค้าเดิม + คนเข้าครั้งแรก\n\n**Flow ลูกค้าเดิม:** เข้าด้วยรหัส 6 หลัก → ระบบให้ตั้งอีเมล+รหัสผ่าน → ครั้งหน้าใช้อีเมลได้เลย\n(มีปุ่ม \"ข้ามไปก่อน\" ไม่บังคับ)\n\n**ลืมรหัสผ่าน:** กรอกอีเมล → ระบบส่งลิงก์ `reset.html?t=...` ทางเมล อายุ 30 นาที\n\n### ความปลอดภัย\n\n- รหัสผ่าน **hash ด้วย SHA-256 ตั้งแต่ในเบราว์เซอร์** ก่อนส่ง → รหัสจริงไม่เคยวิ่งผ่านเน็ต\n  (สำคัญ เพราะ JSONP ส่งผ่าน URL ซึ่งจะถูกบันทึกใน log ของ Google)\n- ฝั่ง server hash ซ้ำอีกชั้นพร้อม **salt เฉพาะคน** → ต่อให้ Sheet หลุด เอาไปใช้ login ไม่ได้\n- รหัสผิด/ไม่มีอีเมลนั้น → ตอบข้อความเดียวกัน กันคนไล่เดาว่าใครสมัครบ้าง\n- ขอ reset → ตอบเหมือนกันเสมอ ไม่บอกว่ามีอีเมลนี้ในระบบมั้ย\n\n### ⚠️ ข้อจำกัดที่ยังเหลือ (ควรรู้)\n\nLogin ระบบนี้กันคน**เข้าหน้า dashboard** ได้ แต่ **ไม่ได้กันคนเปิดไฟล์ Day ตรงๆ ทาง URL**\nเพราะเว็บเป็น static file ทั้งหมด — ใครรู้ `.../Level1/Day1_LeosBigDay_A1.html` ก็เปิดได้\n\nถ้าจะกันจริงต้องย้ายไฟล์ Day ไปหลัง **Cloudflare Worker** ที่ตรวจสิทธิ์ก่อนส่งไฟล์\n(ทำได้ฟรีใน free tier — แนะนำให้ทำตอนคอนเทนต์ครบ ~365 วัน หรือตอนเริ่มขายจริงจัง)\n\n---\n\n## 🧪 ทดสอบหลัง deploy\n\n- [ ] สมัครใหม่ + อัปสลิปจริง → ได้รหัสทันที ไม่ต้องรอครู\n- [ ] อัปสลิปเดิมซ้ำอีกรอบ → ต้องขึ้น \"สลิปนี้ถูกใช้ไปแล้ว\"\n- [ ] อัปสลิปยอดน้อยกว่าราคา → ต้องขึ้น \"ยอดโอนไม่ตรง\"\n- [ ] เข้าด้วยรหัส 6 หลัก → ตั้งอีเมล+รหัสผ่าน → logout → เข้าด้วยอีเมลได้\n- [ ] กด \"ลืมรหัสผ่าน\" → ได้เมล → กดลิงก์ → ตั้งใหม่ → เข้าได้\n- [ ] ใส่รหัสผ่านผิด → ขึ้น \"อีเมลหรือรหัสผ่านไม่ถูกต้อง\"\n- [ ] เช็ก Sheet ชีต `Students` มีคอลัมน์ `pass_hash` / `pass_salt` / `reset_token` เพิ่มมาเอง\n\n---\n\n## 📊 คอลัมน์ที่เพิ่มใน Google Sheet\n\n**Students** (สร้างอัตโนมัติตอนใช้งานครั้งแรก)\n\n| คอลัมน์ | J | K | L |\n|---------|---|---|---|\n| ชื่อ | `pass_hash` | `pass_salt` | `reset_token` |\n\n**Purchases** — คอลัมน์ 13 เก็บผลตรวจสลิป รูปแบบ `ok\\|ข้อความ` / `reject\\|เหตุผล` / `manual\\|เหตุผล`\n", "TEACHER_PANEL": "# 👩‍🏫 หน้า Teacher — ทำอะไรได้บ้าง\n\n**ลิงก์:** https://peekaword.pages.dev/English/teacher.html\n**รหัสครู:** `<รหัสครูของคุณ>` (เปลี่ยนได้ที่ `Code.gs` บรรทัด 13 `TEACHER_PASS`)\n\n> ทุกคำสั่งตรวจรหัสครูที่ **ฝั่งเซิร์ฟเวอร์** ไม่ใช่แค่ซ่อน URL\n> คนอื่นเปิดหน้านี้เจอก็ทำอะไรไม่ได้ถ้าไม่มีรหัส\n\n---\n\n## 📦 แท็บ Orders\n\n- ดูคำสั่งซื้อทั้งหมด พร้อม **ชื่อ / เบอร์ / อีเมล / สลิป**\n- **Approve** → สร้างรหัสนักเรียน + activate ให้ทันที\n- **Reject** → ปฏิเสธออเดอร์\n- คัดลอกรหัสนักเรียนส่งให้ลูกค้า\n\n## 👨‍🎓 แท็บ นักเรียน\n\n| ปุ่ม | ทำอะไร |\n|---|---|\n| **➕ เพิ่ม** | เพิ่มนักเรียนด้วยมือ (เว้นรหัสว่าง = สุ่มให้) |\n| **📊** | เปิดหน้าต่างดูผลรายคน ← *เพิ่มคะแนนรายทักษะแล้ว* |\n| **✏️** | แก้อีเมล — ใช้ตอนลูกค้าพิมพ์อีเมลผิดแล้ว login ไม่ได้ |\n| **🗑️** | ลบนักเรียน (soft delete — ความคืบหน้าใน Sheets ยังอยู่ กู้คืนได้) |\n| **Activate** | เปิดสิทธิ์ให้นักเรียนที่ยังไม่ active |\n\nค้นหาด้วยชื่อ/รหัส · เรียงตามวันที่เรียน หรือตามชื่อ\n\n---\n\n# 🎯 ของใหม่ — คะแนนรายทักษะรายคน\n\nกดปุ่ม **📊** ข้างชื่อนักเรียน จะเห็น:\n\n```\n🎯 คะแนนรายทักษะ\nอ่านออกเสียง   Step 2 · 12 วัน            82%  ████████░░\nพูดตามประโยค   Step 3 · 11 วัน            68%  ███████░░░\nฟังแล้วเขียน   Step 4 · 12 วัน            54%  █████░░░░░\n\n✅ ควรส่งเสริม: อ่านออกเสียง (82%)\n🔧 ควรฝึกเพิ่ม: ฟังแล้วเขียน (54%)\n```\n\nตามด้วยตารางรายวัน มีคอลัมน์ **อ่าน · พูด · เขียน · แต้ม · วันที่**\n\n**กติกาการอ่านค่า**\n\n- 🟢 ≥80 ทำได้ดี · 🟡 60–79 พอใช้ · 🔴 <60 ควรฝึกเพิ่ม\n- **`–` = เด็กข้ามขั้นนั้น ไม่ใช่ทำแล้วได้ 0** — ค่าว่างไม่ถูกนำมาเฉลี่ย\n- ถ้าเด็กไม่เคยกดไมค์เลย ช่อง \"พูด\" จะว่างทั้งคอลัมน์ ไม่ใช่ 0%\n\n---\n\n## ⚠️ ต้อง Deploy Code.gs ก่อนถึงจะเห็นข้อมูล\n\nคะแนนรายทักษะเริ่มเก็บตั้งแต่ **v6** เท่านั้น\n\n1. Apps Script → วาง `Code.gs` ใหม่ → Ctrl+S\n2. **Deploy → Manage deployments → ✏️ → Version: New version → Deploy**\n3. ตรวจ: `?action=version` → ต้องได้ `\"version\":\"v6\"` และมี `\"skill-sync\"`\n\n**นักเรียนเก่าจะยังไม่มีข้อมูลย้อนหลัง** — ข้อมูลเริ่มนับจากวันที่เรียนหลัง deploy\nหน้าต่างจะขึ้นข้อความบอกตรง ๆ ว่า *\"ยังไม่มีคะแนนรายทักษะ\"* ไม่แสดงเลข 0 หลอกตา\n\n### ชีต Progress\n\nโค้ดสร้างหัวคอลัมน์อัตโนมัติเฉพาะตอนสร้างชีตครั้งแรก\nชีตที่มีอยู่แล้ว → พิมพ์เพิ่มเองในแถวที่ 1 คอลัมน์ **G · H · I**:\n\n```\nsk_read    sk_speak    sk_write\n```\n\n*(ไม่ใส่ก็ทำงานได้ ข้อมูลลงคอลัมน์ถูกอยู่ดี แค่ไม่มีชื่อหัวตาราง)*\n\n---\n\n## หน้า admin อื่น\n\n| หน้า | ใช้ทำอะไร |\n|---|---|\n| `gate-k7m3x9q2p5.html` | ประตูเข้าโหมด admin — รหัส `<รหัส admin ของคุณ>` |\n| `panel-k7m3x9q2p5.html` | เปิด Day ไหนก็ได้โดยไม่ต้องปลดล็อก · ล้างข้อมูลทดสอบ |\n| `competition-dashboard.html` | แดชบอร์ดการแข่งขัน |\n\n---\n\n## ยังไม่มี UI (backend รองรับแล้ว)\n\n- `addAttempts` — เพิ่มสิทธิ์สอบ placement test\n- `getQuizLeaderboard` — กระดานคะแนน quiz\n\nบอกได้ถ้าอยากให้ทำเพิ่ม\n\n---\n\n## การทดสอบ\n\n`/tmp/qa/t_teacher.js` — 22 เคส ผ่านหมด\nครอบคลุม: ปุ่มครบ · ส่งรหัสครูทุกคำสั่ง · backend ตรวจสิทธิ์ทุกจุด ·\nค่าเฉลี่ยข้าม `null` ถูกต้อง · จัดอันดับเก่งสุด/อ่อนสุด · colspan ตรงกับจำนวนคอลัมน์\n\nJS ผ่านทั้ง 464 ไฟล์ · `Code.gs` ผ่าน\n**สำรองไฟล์เดิม:** `/tmp/qa/teacher_backup.html`\n", "UX_REVIEW": "# 🧪 ผลทดลองใช้จริง — สวมบทผู้ปกครองบนมือถือ\n\nทดสอบบนเว็บจริง `peekaword.pages.dev` · จอ 375×812 (ขนาด iPhone) · 2026-10-02\nเส้นทาง: หน้าแรก → ทดลองเรียน → Day 1 ครบ 5 ขั้น → จบวัน → รายงานผล → สมัคร\n\n---\n\n# 🔴 ปัญหาร้ายแรง (แก้แล้ว)\n\n## 1. ลายน้ำบดบังเนื้อหาจนอ่านไม่สบายตา\n\n**สิ่งที่เจอ:** ทุกหน้าถูกปูด้วยข้อความ `ยังไม่ได้เข้าสู่ระบบ · 2026-10-02 01:25 · PeekaWord`\nซ้ำ **17 แถว** ทับการ์ดคำศัพท์ ทับเนื้อเรื่อง ทับหน้ารายงาน\n\nผลเสีย 3 ชั้น:\n- หน้าดูรก เหมือนเว็บเสีย — ความประทับใจแรกของคนที่เพิ่งกดเข้ามาจากโฆษณา\n- ข้อความ **\"ยังไม่ได้เข้าสู่ระบบ\"** อ่านเหมือน error ทั้งที่เป็นพฤติกรรมปกติ\n- ลายน้ำอยู่บน **หน้าทดลองเรียนและหน้ารายงาน** ซึ่งเป็นหน้าที่ต้องสร้างความเชื่อมั่น ไม่ใช่หน้าที่ต้องปกป้อง\n\n**แก้แล้ว**\n- ลายน้ำขึ้น **เฉพาะคนที่ล็อกอินแล้ว** — คนทดลองเรียนเห็นหน้าสะอาด\n  (Day 1–7 แจกฟรีอยู่แล้ว ไม่มีอะไรต้องปกป้อง ส่วนคนจ่ายเงินแล้วยังตามรอยได้เหมือนเดิม)\n- จางลงครึ่งหนึ่ง `opacity .11 → .055` · ตัวเล็กลง 12px → 11px\n- เว้นห่างขึ้น 60% → เหลือ ~11 แถวแทน 17\n- ถอด `protect.js` ออกจาก `trial.html` และ `report.html`\n\n## 2. รายงานบอกว่า \"ฟังแล้วเขียน\" แต่ลูกไม่ได้เขียน\n\n**สิ่งที่เจอ:** Step 4 หัวข้อเขียนว่า *Listen + Write ✏️* แต่สิ่งที่เด็กทำจริงคือ\n**กดคำเรียงเป็นประโยค** (tap words to build the sentence) ไม่ได้สะกดคำเอง\n\nรายงานที่พ่อแม่อ่านจึงบอกผิด — และคำแนะนำยิ่งผิดหนัก:\n*\"ส่วนใหญ่พลาดที่สระและตัวสะกดท้ายคำ\"* ทั้งที่ไม่มีการสะกดเกิดขึ้นเลย\n\n**แก้แล้ว** เปลี่ยนเป็น **\"ฟังแล้วเรียงประโยค\"** ทุกที่ (`report.html` · `teacher.html` ·\n`index.html` · `trial.html` · `report.js`) พร้อมเขียนคำแนะนำใหม่ให้ตรงกับทักษะจริง\n*\"ส่วนใหญ่พลาดตำแหน่งคำขยาย ให้ฟังซ้ำ 2 รอบก่อนเริ่มเรียง\"*\n\n> หมายเหตุ: หัวข้อในไฟล์ Day 386 ไฟล์ยังเขียน *Listen + Write* อยู่\n> ถ้าอยากให้ตรงกันหมด ต้องแก้ 386 ไฟล์ — บอกได้ถ้าจะทำ\n\n## 3. การ์ดวันในหน้าทดลอง ชื่อติดกับเลขวัน\n\n`Day 1Leo's Big Day` — ขาด `display:block` ทำให้ไม่ขึ้นบรรทัดใหม่ **แก้แล้ว**\n\n---\n\n# 🟡 ข้อสังเกตที่ยังไม่ได้แก้ — รอตัดสินใจ\n\n## 4. ตัวเลือกเสียงเป็นศัพท์เทคนิค\n\nบนจอขึ้นว่า `Microsoft David - Eng` · `0.85×` · `✓ 12 เสียงคน`\nผู้ปกครองและเด็กไม่รู้ว่าคืออะไร และชื่อเสียงจะต่างกันไปทุกเครื่อง\n\n**ข้อเสนอ:** เปลี่ยนเป็น *\"เสียงผู้ชาย / เสียงผู้หญิง\"* · ซ่อน `0.85×` ไว้หลังปุ่ม ⚙️\nหรือยุบทั้งแถบเป็นไอคอนเดียว กดแล้วค่อยกาง\n\n## 5. Step 1 โล่งเกินไป\n\nมีแค่ปุ่ม Play/Stop กับคำถาม 1 ข้อ แล้วเหลือพื้นที่ว่างครึ่งจอ\nดูเหมือนหน้ายังโหลดไม่เสร็จ\n\n**ข้อเสนอ:** ใส่ภาพประกอบ (ที่ยังไม่มี) หรือรูปคลื่นเสียงขณะเล่น หรือข้อความชวนคิด\nถ้าใส่ภาพได้จะแก้ทั้งข้อนี้และทำให้หน้าน่าสนใจขึ้นมาก\n\n## 6. \"Score: 0 / 6\" ขึ้นตั้งแต่ยังไม่ทำอะไร\n\nเด็กเห็นเลข 0 ตั้งแต่เปิดหน้า อาจรู้สึกแย่ก่อนเริ่ม\n\n**ข้อเสนอ:** ซ่อนแถบคะแนนจนกว่าจะได้คะแนนแรก หรือเปลี่ยนเป็น *\"เริ่มเก็บดาวกันเลย!\"*\n\n## 7. ภาพประกอบยังไม่มี\n\n`img/img_day1.png` ขึ้น 404 — ระบบซ่อนช่องภาพให้อัตโนมัติ ไม่มีไอคอนรูปแตก ✅\nแต่หน้าก็ขาดภาพไปทั้งหมด ซึ่งสำคัญมากกับเด็ก 5–12 ปี\n\n**นี่คือสิ่งที่กระทบประสบการณ์มากที่สุดที่ยังเหลืออยู่**\n\n---\n\n# ✅ สิ่งที่ทำได้ดีอยู่แล้ว\n\n- เส้นทางจากหน้าแรก → เรียนได้จริง **ไม่มีสะดุด ไม่ต้องสมัคร ไม่ต้องกรอกอะไร**\n- 5 ขั้นตอนไหลลื่น ปุ่ม Back/Next ชัดเจน ไม่หลง\n- คำศัพท์ไฮไลต์ในเนื้อเรื่อง เห็นบริบททันที\n- รหัสจบวัน + ปลดล็อกวันถัดไปทำงานถูกต้อง\n- **เก็บคะแนนรายทักษะทำงานจริงบนเว็บจริง** — ทดสอบแล้วได้ `read 78 · speak 62 · write 45 · total 62`\n- รายงานผลสรุป \"ควรส่งเสริม / ควรปรับปรุง\" ออกมาถูกต้องตามข้อมูล\n- ไม่มี JS error · ไม่มี layout ล้นจอ · ไม่มีแถบเลื่อนแนวนอน\n\n---\n\n# 📋 ลำดับที่ควรทำต่อ\n\n| # | เรื่อง | ผลกระทบ | แรง |\n|---|---|---|---|\n| 1 | **push โค้ดที่แก้วันนี้ขึ้น GitHub** | สูง | 1 นาที |\n| 2 | **Deploy Code.gs v6** (ยังไม่ยืนยัน) | สูง | 5 นาที |\n| 3 | **ทดสอบซื้อจริง 1 บาท** | สูง | 10 นาที |\n| 4 | **ภาพประกอบ Day 1–7** อย่างน้อยช่วงทดลอง | สูง | ครึ่งวัน |\n| 5 | ติด analytics | สูง | 15 นาที |\n| 6 | ปรับแถบเสียงให้เป็นภาษาคน | กลาง | 30 นาที |\n| 7 | ซ่อน Score 0/6 ตอนเริ่ม | ต่ำ | 10 นาที |\n| 8 | เติมภาพ Day 8–448 | กลาง | ทยอยทำ |\n\n**ข้อ 4 สำคัญกว่าที่คิด** — 7 วันทดลองคือด่านตัดสินว่าพ่อแม่จะจ่ายหรือไม่\nหน้าที่ไม่มีภาพเลยสำหรับเด็ก 5 ขวบ ทำให้ดูเหมือนเอกสาร ไม่ใช่สื่อการเรียน\nถ้าทำภาพได้แค่ 7 วันแรกก่อนก็พอ\n\n---\n\n**สำรองไฟล์เดิม:** `/tmp/qa/protect_backup.js`\n**JS ผ่านทั้ง 464 ไฟล์** หลังแก้\n", "WATERMARK_AND_PROTECTION": "# 🔒 ลายน้ำ + ชั้นป้องกันการคัดลอก\n\nไฟล์เดียว: `English/js/protect.js` — ฝังไว้ท้ายทุกหน้าแล้ว (448 day + dashboard + trial)\n\n---\n\n## ทำอะไรได้จริง\n\n| กลไก | ผล |\n|---|---|\n| **ลายน้ำ** อีเมล + รหัสนักเรียน + วันเวลา ทับทั้งหน้าแบบเอียง 24° | ติดไปกับภาพที่แคปทุกภาพ ระบุได้ว่าใครทำหลุด |\n| **จอดำตอนสลับแอป / สลับแท็บ / เสียโฟกัส** | ครอบคลุม Win+Shift+S, screen recorder บางตัว, การแชร์หน้าจอบางแบบ |\n| **ปุ่ม PrintScreen (Windows)** | ดำจอ 1.2 วิ + ล้างคลิปบอร์ด |\n| **บล็อกการพิมพ์** `@media print` + Ctrl+P | กด Ctrl+P → Save as PDF ไม่ได้ |\n| **บล็อก Ctrl+S / Ctrl+U / F12 / คลิกขวา / ลากภาพ** | เพิ่มความยุ่งยาก (ไม่ได้กันคนตั้งใจจริง) |\n| **สร้างลายน้ำคืนอัตโนมัติทุก 2.5 วิ** | ลบผ่าน DevTools แล้วมันกลับมา |\n\n## ❌ ทำไม่ได้บนเบราว์เซอร์ (พูดตามตรง)\n\n- **แคปหน้าจอบนมือถือ** (iOS/Android) — เว็บไม่มี API ตรวจจับเลย ภาพที่ได้จะ**มีลายน้ำติดไป** แต่ห้ามไม่ได้\n- **macOS Cmd+Shift+4** — ไม่ทำให้เบราว์เซอร์เสียโฟกัส จึงไม่ดำจอ\n- **ถ่ายรูปจอด้วยมือถืออีกเครื่อง** — ไม่มีเทคโนโลยีใดกันได้ ลายน้ำคือด่านเดียวที่เหลือ\n- ทุกอย่างที่รันในเบราว์เซอร์ **ปิด JavaScript ก็หลุดหมด** → ลายน้ำคือการ *ตามรอย* ไม่ใช่การ *ป้องกัน*\n\n👉 **อยากได้ภาพดำจริง อ่านหัวข้อล่างสุด — ต้องห่อเป็นแอป**\n\n---\n\n# 🎯 ถ้าต้องการ \"แคปแล้วได้ภาพดำจริง\"\n\n**ต้องห่อเว็บเป็นแอปเท่านั้น** — ไม่มีทางอื่น\nเพราะการแคปหน้าจอทำโดย **ระบบปฏิบัติการ** ไม่ใช่เบราว์เซอร์\nOS อ่านภาพจากหน่วยความจำจอตรงๆ ไม่เคยบอกหน้าเว็บ และหน้าเว็บก็แก้ภาพที่ถูกเก็บไปแล้วไม่ได้\n\nภาพจะดำได้ต่อเมื่อ **แอปเจ้าของหน้าต่างสั่ง OS ว่าหน้าต่างนี้ห้ามถูกแคป**:\n- Android → `WindowManager.LayoutParams.FLAG_SECURE`\n- iOS → เทคนิค secure layer (แอปธนาคารใช้กันทั่วไป)\n- Windows/macOS → `setContentProtection` ของ Electron\n\nมาตรฐานเว็บสำหรับเรื่องนี้ **ยังเป็นแค่ข้อเสนอ** ([W3C Manifest Issue #1154](https://github.com/w3c/manifest/issues/1154),\n[TPAC 2024 – Capture Prevention](https://www.w3.org/2024/Talks/TPAC/breakouts/capture-prevention.pdf))\nยังไม่มีเบราว์เซอร์ตัวไหนรองรับ\n\n## ✅ เตรียมโค้ดรอไว้แล้ว\n\n`protect.js` มี hook อยู่แล้ว — พอห่อเป็นแอปเมื่อไหร่ จะสั่งบล็อกอัตโนมัติทันที ไม่ต้องแก้เว็บอีก:\n\n```js\nwindow.WTN.disableScreenshot({ ssKey: true });\n```\n\nรันบนเบราว์เซอร์ปกติจะข้ามไปเงียบๆ (ไม่มี `window.WTN`) · ลองซ้ำ 20 ครั้ง ทุก 0.5 วิ เผื่อ bridge ของแอปโหลดช้า\n\n## ทางเลือกในการห่อแอป\n\n| ทาง | ค่าใช้จ่าย | เวลา | ได้ภาพดำจริง |\n|---|---|---|---|\n| **WebToNative** (แนะนำ) | จ่ายครั้งเดียว มี lifetime plan | ~1–2 วัน ไม่ต้องเขียนโค้ด | ✅ Android + iOS |\n| **Median.co** | รายเดือน แพงกว่า | ~1–2 วัน | ✅ Android + iOS |\n| **เขียนเอง** Android Studio: WebView + `FLAG_SECURE` | ฟรี + ค่า Play Store $25 ครั้งเดียว | ~1 สัปดาห์ ต้องมี dev | ✅ Android (iOS ต้องทำแยก) |\n\n> WebToNative รองรับฟีเจอร์นี้ตั้งแต่ **iOS 13/06/25 · Android 19/12/25**\n> เอกสาร: https://docs.webtonative.com/javascript-apis/disable-screenshot\n\n**ขั้นตอนถ้าเลือก WebToNative**\n1. สมัคร → ใส่ URL `https://peekaword.pages.dev/English/`\n2. เปิด AddOn **Disable Screenshot**\n3. Build → ได้ไฟล์ `.apk` / `.ipa`\n4. ส่งขึ้น Play Store / App Store (ต้องมีบัญชีนักพัฒนา)\n5. เว็บไม่ต้องแก้เลย — hook ในโค้ดเรียกให้เอง\n\n## Cloudflare Worker (คนละเรื่อง แต่ควรทำด้วย)\n\nกันคนเปิดไฟล์ Day ตรงทาง URL โดยไม่ล็อกอิน — ฟรีในแผน Pages เดิม ยังไม่ได้ทำ\n\n---\n\n## ปรับแต่ง\n\nเปิด `English/js/protect.js`\n\n- **ลายน้ำเข้มไป/จางไป** → `color:rgba(15,23,42,.11)` (ค่ายิ่งมากยิ่งเข้ม แนะนำ .08–.15)\n- **ไม่อยากให้ดำจอตอนสลับแท็บ** → ลบ 2 บรรทัดนี้\n  ```js\n  window.addEventListener('blur', function () { hide(true); });\n  document.addEventListener('visibilitychange', function () { hide(document.hidden); });\n  ```\n- **อยากให้พิมพ์ได้** → ลบ `@media print{html,body{display:none!important}}` ในตัวแปร `css`\n\n## กันจอดำค้าง\n\nมี 3 ชั้น ไม่ให้เด็กติดอยู่กับจอดำจนเรียนต่อไม่ได้:\n1. กลับมาที่หน้า → `focus` / `visibilitychange` ปลดเอง\n2. **แตะที่จอดำ → หายทันที**\n3. ตัวจับเวลาทุก 2.5 วิ: ถ้าหน้าเห็นอยู่จริงและมีโฟกัส → บังคับปลด\n\n## ทดสอบ\n\n`/tmp/qa/t_protect.js` — รัน `protect.js` จริงบน stub DOM 18 เคส\nครอบคลุม: ยังไม่ล็อกอิน / ล็อกอินแล้ว / admin / trial / สลับแท็บ / PrintScreen / คีย์ลัด / ลบลายน้ำแล้วสร้างคืน\n", "brand": "# Brand Identity — Oxford 3000 Word Adventure\n\n## ชื่อแบรนด์\n**\"Word Adventure\"** / **\"ผจญภัยคำศัพท์\"**  \nTagline: *\"Every word is a new adventure!\"*\n\n---\n\n## บุคลิกแบรนด์ (Brand Personality)\n| มิติ | คำอธิบาย |\n|------|----------|\n| อารมณ์หลัก | สนุก, อบอุ่น, ให้กำลังใจ, ตื่นเต้น |\n| น้ำเสียง | เป็นเพื่อน ไม่ใช่ครู — พูดกับเด็ก ไม่ใช่สั่งเด็ก |\n| ค่านิยม | ความพยายามสำคัญกว่าความสมบูรณ์แบบ |\n| สิ่งที่ห้ามทำ | ข่มขู่, กดดัน, ใช้ภาษาที่ทำให้รู้สึกโง่ |\n\n---\n\n## Mascot — \"Wordy\"\n- รูปร่าง: หนอนตัวเล็กน้อย สีเขียวมิ้นต์ มีตาโต หูฟังสีส้ม สมุดโน้ตเล็กในมือ\n- บุคลิก: ขี้อยากรู้ ร้องเพลงตลอดเวลา ชอบพูดคำศัพท์ใหม่\n- ใช้เพื่อ: แนะนำกิจกรรม, ให้กำลังใจ (\"You can do it! 🎉\"), แสดงผลลัพธ์\n\n---\n\n## จานสีหลัก (Color Palette)\n\n### สีหลัก — ใช้ทุกช่วงอายุ\n| สี | Hex | ความหมาย |\n|----|-----|----------|\n| Sky Blue | `#4FC3F7` | เปิดกว้าง, เรียนรู้ |\n| Sunshine Yellow | `#FFD54F` | ความสุข, กระตุ้น |\n| Mint Green | `#81C784` | เติบโต, ทำได้ |\n| Coral Orange | `#FF8A65` | พลังงาน, สนุก |\n| Soft White | `#FAFAFA` | พื้นที่อ่าน, สะอาด |\n\n### ปรับโทนตามช่วงวัย\n| ช่วงอายุ | โทนสี | เหตุผล |\n|---------|-------|--------|\n| 7–8 ปี (A1) | สดใส, contrast สูง, หลายสีพร้อมกัน | ดึงดูดสายตา, สมาธิสั้น |\n| 9–10 ปี (A2) | สีหลักชัด + accent 1–2 สี | เริ่มจดจ่อได้นานขึ้น |\n| 11–12 ปี (B1–B2) | โทนสะอาด, minimalist มากขึ้น | รู้สึก \"โต\" และมั่นใจ |\n\n---\n\n## Typography\n\n| ประเภท | Font แนะนำ | ลักษณะ |\n|--------|-----------|--------|\n| หัวข้อหลัก | **Fredoka One** | กลมน่ารัก อ่านง่าย |\n| เนื้อเรื่อง | **Nunito** | เป็นมิตร ไม่เป็นทางการ |\n| คำศัพท์ highlight | **Baloo 2 Bold** | โดดเด่น จำง่าย |\n| Thai text | **Sarabun** | อ่านสบาย หน้าจอ/พิมพ์ |\n\n- ขนาดตัวอักษรเนื้อหา: ไม่ต่ำกว่า 16px (จอ) / 14pt (พิมพ์)\n- ห้ามใช้ฟอนต์ serif หรือแคบ — เด็กอ่านยาก\n\n---\n\n## ไอคอนและ Visual Elements\n- มุมกล่องทุกอัน: **rounded corners** (radius ≥ 12px) — ไม่มีมุมแหลม\n- ไอคอนสัญลักษณ์ประจำกิจกรรม:\n  - 🎧 ฟัง\n  - 📖 อ่าน\n  - 🗣️ พูด\n  - ✏️ เขียน\n  - ⭐ แบบฝึกหัด / ทำได้แล้ว!\n- Progress แสดงเป็น: ดาว ❤️ หรือ badge — ไม่ใช้ % หรือคะแนนตัวเลขดิบ\n\n---\n\n## ระบบให้กำลังใจ (Encouragement System)\n\n### ข้อความกำลังใจตามผลลัพธ์\n| สถานการณ์ | ข้อความ |\n|---------|--------|\n| เริ่มบทเรียน | \"Let's go, Word Explorer! 🚀\" |\n| ทำแบบฝึกหัดถูก | \"Amazing! You're a word champion! ⭐\" |\n| ทำผิด | \"Oops! Let's try again — you've got this! 💪\" |\n| จบบทเรียน | \"You learned X new words today! Wordy is so proud! 🎉\" |\n| ครบสัปดาห์ | \"One whole week! You're on fire! 🔥\" |\n\n### กฎการให้กำลังใจ\n1. **ไม่เคยบอกว่าผิด** — ใช้ \"try again\" หรือ \"almost!\"\n2. **ชมความพยายาม** ก่อนชมผลลัพธ์เสมอ\n3. **ทุก milestone** ต้องมี celebration เล็กๆ (animation, badge, เสียง)\n\n---\n\n## เสียง (Audio Branding)\n- BGM: เบา, สนุก, เป็นจังหวะ — แนว children's acoustic / ukulele\n- เสียง feedback ถูก: เสียงกระดิ่งสดใส 🔔\n- เสียง feedback ผิด: เสียงนุ่มๆ ไม่ตกใจ (เช่น \"boing\" เบาๆ)\n- เสียงพูดคำศัพท์: ชัด, ช้า, สำเนียง American English มาตรฐาน\n\n---\n\n## กฎ DO / DON'T\n\n| DO ✅ | DON'T ❌ |\n|------|---------|\n| ใช้ภาพสีสด มีชีวิตชีวา | ภาพขาวดำ หรือ stock photo คน |\n| ตัวอักษรใหญ่ ชัดเจน | ตัวเล็ก ซีด หรืออ่านยาก |\n| Wordy ปรากฏในทุก section | ไม่มี mascot เลย |\n| บอกว่าทำได้เสมอ | บอกว่าผิด หรือ \"ไม่ถูก\" |\n| สีตามธีมสัปดาห์ | สีสุ่ม ไม่ coherent |\n| มี whitespace เพียงพอ | อัดแน่นจนล้นหน้า |\n\n---\n\n## ธีมสีตามหมวดคำศัพท์ (Weekly Theme Color)\n| หมวด | สีธีม | ตัวอย่างสัปดาห์ |\n|------|-------|---------------|\n| Animals | Forest Green `#66BB6A` | Week 1 |\n| Food & Drink | Warm Orange `#FFA726` | Week 2 |\n| Family & People | Rose Pink `#F48FB1` | Week 3 |\n| Home & Places | Sky Blue `#4FC3F7` | Week 4 |\n| Nature | Leaf Green `#AED581` | Week 5 |\n| Actions & Verbs | Electric Purple `#CE93D8` | Week 6 |\n| Numbers & Time | Golden Yellow `#FFD54F` | Week 7 |\n", "generate-review-day-SKILL": "---\nname: generate-review-day\ndescription: >\n  Use this skill to generate a complete Week Review HTML file for the Oxford 3000 Word Adventure\n  system, following the exact Day 7/14/21/28 architecture with 7 games + Speak Up! recording.\n  Trigger whenever the user says \"สร้าง review day\", \"ทำ HTML review\", \"generate review HTML\",\n  \"สร้างไฟล์ Day Review\", \"ทำ Week Review วันที่\", or asks to build a review day for any week.\n  Always use when output should be a self-contained .html review file with 8 pages (Menu + 7 games),\n  oval float balloons, sentence-based Speak Up!, and audio-stop-on-page-change.\n  Use even if the user only says \"Review Week [N]\" or \"ทำ Day [7/14/21/28]\".\n---\n\n# Generate Review Day — Oxford 3000 Word Adventure\n\n## What this skill produces\nA single self-contained `.html` file: `Day[N]_Week[W][Theme]Review_A1.html`  \nArchitecture: **8 pages** (p0 Menu + p1–p7 games), score bar, TTS, lock system, completion screen.\n\n---\n\n## Data Arrays (define at top of `<script>`)\n\n```javascript\nconst WORDS = [\n  {e:'cat', day:1, icon:'🐱'},\n  // ... 36 words (Days D-5 through D-1, 6 words each day)\n  // NO Thai 't' field — English-only games\n];\n\nconst SB_LIST = [\n  {w:['The','cat','runs','fast','.']},\n  {w:['She','has','a','big','cup','.']},\n  // 5 sentences minimum, drawn from review words\n  // used in both Sentence Builder (p6) AND Speak Up! (p7)\n];\n```\n\n---\n\n## File Architecture (8 pages)\n\n```\nbody\n  .already-done bar    ← \"เรียนจบแล้ว\" when localStorage has completion code\n  .score-bar           ← ⭐ Score + #sfill progress + #starDisp\n  .vbar                ← voice selector (#vsel) + speed slider (#rsl) + test button\n  .mainContent\n    <div class=\"page on\" id=\"p0\">  ← Menu: title + 3×2 grid + SP button + Results button\n    <div class=\"page\" id=\"p1\">    ← Listen & Select (LC)\n    <div class=\"page\" id=\"p2\">    ← Listen & Pick (LP)\n    <div class=\"page\" id=\"p3\">    ← Speed Quiz (SQ)\n    <div class=\"page\" id=\"p4\">    ← Balloon Pop (BP)\n    <div class=\"page\" id=\"p5\">    ← Whack-a-Word (WA)\n    <div class=\"page\" id=\"p6\">    ← Sentence Builder (SB)\n    <div class=\"page\" id=\"p7\">    ← Speak Up! (SP)\n  </div><!-- end mainContent -->\n  .complete-screen     ← Completion overlay with code\n  #dots                ← Navigation dots (8 dots: 0–7)\n```\n\n---\n\n## p0 Menu Layout\n\n```html\n<div class=\"page on\" id=\"p0\">\n  <div class=\"step-label\">🌈 Week [W] Review</div>\n  <p class=\"step-sub\">เลือกเกมที่อยากเล่น!</p>\n  <div style=\"font-size:13px;...\">⭐ Score: <span id=\"totalSc\">0</span></div>\n  <div class=\"score-line\">...</div>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px\">\n    <button onclick=\"go(1);initLC()\">👂 Listen & Select</button>\n    <button onclick=\"go(2);initLP()\">👂 Listen & Pick</button>\n    <button onclick=\"go(3);initSQ()\">⚡ Speed Quiz</button>\n    <button onclick=\"go(4);initBP()\">🎈 Balloon Pop</button>\n    <button onclick=\"go(5);initWA()\">🔨 Whack-a-Word</button>\n    <button onclick=\"go(6);initSB()\">🧩 Sentence Builder</button>\n  </div>\n  <!-- SP button: FULL WIDTH, purple gradient, below 3×2 grid -->\n  <button onclick=\"go(7);initSP()\" style=\"background:linear-gradient(135deg,#9C27B0,#4A148C);width:100%;...\">\n    🎤 Speak Up! — Read sentences aloud!\n  </button>\n  <button onclick=\"showCompletion()\">🏆 See Week [W] Results!</button>\n</div>\n```\n\n---\n\n## Score System\n\n```javascript\nlet lcScore=0, lpScore=0, sqScore=0, bpScore=0, waScore=0, sbScore=0, spScore=0;\nlet totalScore=0;\n\nfunction updateScore(){\n  const total = lcScore+lpScore+sqScore+bpScore+waScore+sbScore+spScore;\n  totalScore = total;\n  document.getElementById('totalSc').textContent = total;\n  const pct = Math.min(100, Math.round(total / 7.75));    // ← 7.75 divisor\n  document.getElementById('sfill').style.width = pct+'%';\n  const stars = total>=550?'⭐⭐⭐':total>=375?'⭐⭐☆':'⭐☆☆';  // ← 550/375 thresholds\n  document.getElementById('starDisp').textContent = stars;\n}\n```\n\nMax scores per game: LC≈100, LP≈80, SQ≈75, BP≈150, WA≈120, SB≈100, SP=150 → total ~775\n\n---\n\n## go() Function — CRITICAL\n\n```javascript\nlet curPage = 0;\nfunction go(n){\n  synth.cancel();            // ← stop ALL audio on page change\n  spListening = false;       // ← stop any active speech recognition\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));\n  const pg = document.getElementById('p'+n);\n  if(pg) pg.classList.add('on');\n  curPage = n;\n  const dots = document.getElementById('dots');\n  if(dots){\n    dots.innerHTML = '';\n    [0,1,2,3,4,5,6,7].forEach(i=>{   // ← 8 dots (0–7)\n      const d = document.createElement('div');\n      d.className = 'dot'+(i===n?' on':'');\n      d.onclick = ()=>go(i);\n      dots.appendChild(d);\n    });\n  }\n}\n```\n\n---\n\n## curPage Guards (prevent audio bleed between pages)\n\nAll setTimeout callbacks that trigger after user may have navigated must check `curPage`:\n\n```javascript\n// Example in LC game:\nfunction checkLC(){\n  // ...scoring...\n  setTimeout(()=>{ if(curPage===1){ lcIdx++; renderLC(); } }, 1200);\n}\n\n// Example in SB game:\nfunction sbCheck(){\n  // ...scoring...\n  setTimeout(()=>{ if(curPage===6){ sbIdx++; renderSB(); } }, 1200);\n}\n```\n\nApply this guard to: checkLC (p1), checkLP (p2), checkSQ (p3), sbCheck (p6), spManual+startSP (p7)\n\n---\n\n## Game 4: Balloon Pop (BP) — Oval Float Style\n\n```css\n.bp-arena{position:relative;height:300px;background:linear-gradient(180deg,[SKY_TOP] 0%,[SKY_MID] 60%,[SKY_BTM] 100%);overflow:hidden;border-radius:16px;margin-bottom:10px}\n.balloon{position:absolute;width:60px;height:72px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;cursor:pointer;text-align:center;padding:6px;text-shadow:0 1px 2px rgba(0,0,0,.4);bottom:-110px}\n.balloon::after{content:'';position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);width:1px;height:16px;background:rgba(0,0,0,.25)}\n@keyframes floatUp{from{bottom:-110px}to{bottom:105%}}\n```\n\n```javascript\nfunction nextBalloon(){\n  const w = bpDeck[bpRound % bpDeck.length];\n  // pick 4 choices (1 correct + 3 wrong)\n  const area = document.getElementById('bpArena'); // ← ID = bpArena (NOT bpArea)\n  area.innerHTML = '';\n  document.getElementById('bpPrompt').textContent = w.icon+' What is this?';\n  speak(w.e);\n  const colors = ['#FF6B9D','#FFB347','#87CEEB','#98E89A'];\n  const lefts = [5,28,52,72];\n  choices.forEach((c,i)=>{\n    const b = document.createElement('div');\n    b.className = 'balloon';\n    b.textContent = c.e;\n    b.style.background = colors[i];\n    b.style.left = lefts[i]+'%';\n    b.style.animationName = 'floatUp';\n    b.style.animationDuration = (5+i*0.4)+'s';\n    b.style.animationTimingFunction = 'linear';\n    b.style.animationFillMode = 'forwards';\n    b.onclick = ()=>popBalloon(c.e===w.e, b, area);\n    area.appendChild(b);\n  });\n  bpTimeout = setTimeout(()=>{ if(bpActive) nextBalloon(); }, 6500);\n}\n```\n\nSky gradient colors by week theme:\n| Week | SKY_TOP | SKY_MID | SKY_BTM |\n|------|---------|---------|---------|\n| 1 Animals (Rainbow) | `#FFF8E1` | `#FFE0B2` | `#FFCC80` |\n| 2 Food (Orange) | `#FFF3E0` | `#FFCCBC` | `#FFAB91` |\n| 3 Home (Green) | `#E8F5E9` | `#C8E6C9` | `#A5D6A7` |\n| 4 School (Blue) | `#E8EAF6` | `#C5CAE9` | `#9FA8DA` |\n\n---\n\n## Game 7: Speak Up! (SP) — Sentence-Based\n\n```javascript\nlet spScore=0, spIdx=0, spSentList=[], spListening=false;\nconst SR_API = window.SpeechRecognition || window.webkitSpeechRecognition;\n\nfunction initSP(){\n  spScore=0; spIdx=0; spListening=false;\n  spSentList = shuffle(SB_LIST);   // ← uses same SB_LIST as Sentence Builder\n  document.getElementById('spDone').style.display='none';\n  document.getElementById('spSc').textContent=0;\n  document.getElementById('spTotal').textContent=spSentList.length;\n  if(!SR_API){ document.getElementById('spAlt').style.display='block'; }\n  else{ document.getElementById('spAlt').style.display='none'; }\n  renderSP();\n}\n\nfunction renderSP(){\n  if(spIdx>=spSentList.length){ endSP(); return; }\n  const s=spSentList[spIdx];\n  document.getElementById('spNum').textContent=spIdx+1;\n  document.getElementById('spSentence').textContent='\"'+s.w.join(' ')+'\"';\n  document.getElementById('spFb').textContent='';\n  document.getElementById('spBar').style.width='0%';\n  document.getElementById('spBar').style.background='#9C27B0';\n  const rb=document.getElementById('spRecord');\n  if(rb){ rb.textContent='🎤 Speak!'; rb.disabled=false; }\n  speak(s.w.join(' '), 0.8);\n}\n\nfunction startSP(){\n  // ... Chrome SpeechRecognition API\n  // Scoring: word-level accuracy → max 30pts per sentence\n  // bestPct = best match across 5 alternatives → pts = round(bestPct/100 * 30)\n  // Total max = spSentList.length × 30 (typically 5×30 = 150pts)\n  // curPage===7 guard in setTimeout before advancing\n}\n\nfunction endSP(){\n  document.getElementById('spFinalScore').textContent=spScore+'/'+spSentList.length*30+' pts';\n}\n```\n\n### SP page HTML (p7)\n\n```html\n<div class=\"page\" id=\"p7\">\n  <div class=\"step-label\">🎤 Speak Up!</div>\n  <p class=\"step-sub\">Read the sentence aloud — scored on accuracy!</p>\n  <div>Sentence <span id=\"spNum\">1</span>/<span id=\"spTotal\">5</span> · ⭐ <span id=\"spSc\">0</span> pts</div>\n  <div id=\"spCard\" style=\"border:2.5px solid #AB47BC;...\">\n    <div id=\"spSentence\" style=\"font-size:18px;font-weight:900\">—</div>\n    <button onclick=\"spHear()\">🔊 Hear</button>\n    <button id=\"spRecord\" onclick=\"startSP()\">🎤 Speak!</button>\n    <div id=\"spBar\" style=\"height:12px;background:#9C27B0;width:0%\"></div>\n    <div id=\"spFb\"></div>\n  </div>\n  <!-- Non-Chrome fallback -->\n  <div id=\"spAlt\" style=\"display:none\">\n    ⚠️ Voice needs Chrome\n    <button onclick=\"spManual()\">✅ I said it! (+10)</button>\n  </div>\n  <!-- Completion panel -->\n  <div id=\"spDone\" style=\"display:none\">\n    <div id=\"spFinalScore\">0/150 pts</div>\n    <button onclick=\"go(7);initSP()\">Play Again 🔄</button>\n  </div>\n  <div class=\"navrow\">\n    <button onclick=\"go(0)\">← Menu</button>\n    <button onclick=\"showCompletion()\">🏆 Finish!</button>\n  </div>\n</div>\n```\n\n---\n\n## SB navrow — must point to SP (not showCompletion)\n\n```html\n<!-- p6 SB navrow — bottom navigation -->\n<div class=\"navrow\">\n  <button onclick=\"go(0)\">← Menu</button>\n  <button onclick=\"go(7);initSP()\">Speak Up! →</button>  <!-- ← NOT showCompletion -->\n</div>\n```\n\n---\n\n## Lock System (same as regular days)\n\n```javascript\nconst LOCK_KEY = 'wla_d[N]';          // e.g., 'wla_d7', 'wla_d14'\nconst PREV_KEY = 'wla_d[N-1]';        // e.g., 'wla_d6', 'wla_d13'\n// Admin bypass: localStorage.getItem('wla_admin')==='1' → skip lock\n// Completion code: generateCode(N) → stored in LOCK_KEY\n```\n\n---\n\n## Theme Colors by Week\n\n| Week | Theme | Header Gradient | Primary | Accent | Card BG |\n|------|-------|----------------|---------|--------|---------|\n| 1 | 🌈 Rainbow (Animals) | `#E91E63→#9C27B0→#3F51B5` | `#E91E63` | `#CE93D8` | `#F3E5F5` |\n| 2 | 🍽️ Food (Orange) | `#FF8F00→#F57F17` | `#E65100` | `#FFCC02` | `#FFF3E0` |\n| 3 | 🏠 Home (Green) | `#2E7D32→#558B2F` | `#2E7D32` | `#A5D6A7` | `#E8F5E9` |\n| 4 | 🏫 School (Blue) | `#1A237E→#283593` | `#1565C0` | `#9FA8DA` | `#E8EAF6` |\n\n---\n\n## How to Generate a New Review Day\n\n1. **Get from user**: Day N (7/14/21/28/35…), Week W, Theme name, WORDS (36 words = 6 days × 6 words), SB_LIST (5 sentences)\n2. **Determine theme**: N%28 → week number → colors from table above\n3. **Set LOCK_KEY/PREV_KEY**: `wla_d[N]` / `wla_d[N-1]`\n4. **Build all 8 pages**: p0–p7 with correct game IDs\n5. **Wire all button orders**: `go(N);initXX()` — NOT `initXX();go(N)` (causes TTS bug!)\n6. **Add curPage guards** to all setTimeout callbacks in LC, LP, SQ, SB, SP\n\n---\n\n## Quality Checklist\n\n- [ ] WORDS array has 36 entries with `{e, day, icon}` (no Thai `t` field)\n- [ ] SB_LIST has 5+ sentences `{w:[...]}`\n- [ ] `go()` has `synth.cancel()` + `spListening=false` + dots `[0,1,2,3,4,5,6,7]`\n- [ ] All button calls: `go(N);initXX()` order (not reversed)\n- [ ] curPage guards in: checkLC(1), checkLP(2), checkSQ(3), sbCheck(6), SP callbacks(7)\n- [ ] BP uses `id=\"bpArena\"` (not `bpArea`) and oval balloon CSS\n- [ ] SP uses `SB_LIST` (not WORDS), scoring = word accuracy × 30pts/sentence\n- [ ] SB navrow points to `go(7);initSP()` (not showCompletion)\n- [ ] `updateScore()` includes all 7 scores, pct `/7.75`, stars `≥550/≥375`\n- [ ] `LOCK_KEY='wla_d[N]'` and `PREV_KEY='wla_d[N-1]'` correct\n- [ ] SR_API alias defined: `const SR_API = window.SpeechRecognition||window.webkitSpeechRecognition`\n- [ ] Copyright-free content — no licensed characters or plots\n", "standard-day-pattern_SKILL_updated": "---\nname: standard-day-pattern\ndescription: >\n  Use this skill to generate a new Day HTML file for the Oxford 3000 Word Adventure system,\n  following the exact Day 1 architecture. Trigger whenever the user says \"สร้างไฟล์ Day\",\n  \"ทำ HTML วันที่\", \"generate day HTML\", \"สร้าง interactive lesson\", \"ทำ Day [N] HTML\",\n  or asks to create a new day that matches the Day 1 page-based template.\n  Always use this skill when the output should be a self-contained .html file with\n  5 interactive steps, score bar, TTS, lock system, and completion summary.\n  Use even if the user only says \"Day [N]\" or \"ทำ Day ต่อไป\" in a lesson-building context.\n---\n\n# Standard Day Pattern — Oxford 3000 Word Adventure\n\n## What this skill produces\nA single self-contained `.html` file: `Day[N]_[StoryTitle]_A1.html`  \nArchitecture matches **Day 1** exactly — page-based, 5 steps, score bar, lock, TTS, completion screen.\n\n---\n\n## ⚠️ PRE-BUILD VERIFICATION (ทำก่อนสร้างทุกครั้ง)\n\n**Step 1 — ตรวจ game ของวันก่อนหน้า**\n```bash\npython3 -c \"\nimport re, glob\nf=glob.glob('Day[N-1]_*.html')[0]\nhtml=open(f).read()\nm=re.search(r'id=[\\\"\\\\x27]p5[\\\"\\\\x27].*?step-label[^>]*>([^<]{5,60})', html, re.DOTALL)\nprint(m.group(1) if m else 'NO P5 / Review Day')\n\"\n```\n→ **บันทึกไว้**: วันก่อนใช้ game อะไร  \n→ **วันนี้ห้ามซ้ำ** — เลือก game จากตารางด้านล่างที่แตกต่างออกไป\n\n**Step 2 — ตรวจ architecture ของ Day[N-1]**\n```bash\ngrep -c 'class=\"page\"' Day[N-1]_*.html   # ต้องได้ ≥ 5\n```\n- ≥ 5 = page-based ✅ ดำเนินการต่อได้  \n- 0 = section-based ❌ → ต้อง rebuild Day[N-1] ก่อน\n\n**Step 3 — ยืนยัน LOCK_KEY**\n- `LOCK_KEY = 'wla_d[N]'` ตรงกับวันที่กำลังสร้าง\n- `PREV_KEY = 'wla_d[N-1]'` ตรงกับวันก่อน\n\n---\n\n## Step 5 Game — Actual Assignment per Day\n\n> **กฎสำคัญ**: Game ห้ามซ้ำกับ Day[N-1] — ตรวจก่อนสร้างทุกครั้ง\n\n| Day | Game | Day | Game | Day | Game |\n|-----|------|-----|------|-----|------|\n| 1 | Word Match (WM) | 11 | True or False (TF) | 21 | Review |\n| 2 | Flashcard Quiz (FC) | 12 | Word Scramble (WS) | 22 | Fill in Blank (FB) |\n| 3 | Fill in Blank (FB) | 13 | Sentence Builder (SB) | 23 | Sentence Scramble (SS) |\n| 4 | Flashcard Quiz (FC) | 14 | Review | 24 | Word Match (WM) |\n| 5 | Word Scramble (WS) | 15 | Word Match (WM) | 25 | Memory Flip (MF) |\n| 6 | Sentence Builder (SB) | 16 | Memory Flip (MF) | 26 | Fill in Blank (FB) |\n| 7 | Review | 17 | Sentence Scramble (SS) | 27 | Sentence Scramble (SS) |\n| 8 | Matching Game (WM) | 18 | True or False (TF) | 28 | Review |\n| 9 | Flashcard Quiz (FC) | 19 | Word Match (WM) | 29 | Word Match (WM) |\n| 10 | Fill in Blank (FB) | 20 | Memory Flip (MF) | 30 | Memory Flip (MF) |\n\n> Day 7, 14, 21, 28 = Review Day — ไม่มี Step 5 game  \n> Day 18 = TF (ไม่ใช่ SS เพราะ Day 17 = SS ซ้ำกัน)\n\n**Game pool (Day 31+):** WM | FC | FB | TF | WS | SB | MF | SS  \nเลือกโดย: ไม่ซ้ำ Day[N-1] และสลับให้หลากหลาย\n\n---\n\n## File Architecture\n\n### HTML skeleton\n```\n<body>\n  .already-done bar          ← shows \"เรียนจบแล้ว\" when localStorage has code\n  .score-bar                 ← ⭐ Score: N / 6 + progress fill + starDisp\n  .vbar                      ← voice selector + speed slider + test button\n  <div class=\"page on fin\" id=\"p0\">  ← Cover: word cards + \"Let's Start!\" button\n  <div class=\"page\" id=\"p1\">  ← Step 1: Listen First\n  <div class=\"page\" id=\"p2\">  ← Step 2: Read + Listen (SpeechRecognition)\n  <div class=\"page\" id=\"p3\">  ← Step 3: Read + Speak (sentence-by-sentence recording)\n  <div class=\"page\" id=\"p4\">  ← Step 4: Listen + Arrange\n  <div class=\"page\" id=\"p5\">  ← Step 5: Game (see table above)\n  <div class=\"complete-screen\" id=\"completeScreen\">\n  dot navigation bar (#dots)\n  header label (#lbl)\n</body>\n```\n\nNavigation: `go(n)` — hides current `.page.on`, shows `#p{n}`, updates dots + label.  \nTriggers in `go()`: n=3 → `buildSL()`, n=4 → `buildS4()`, n=5 → game function\n\n---\n\n## Data Arrays (top of `<script>`)\n\n```javascript\nconst WORDS = [\n  {e:'cat', ph:'/kæt/', t:'แมว', em:'🐱'},\n  // 6-8 words | e=English, t=Thai, ph=IPA, em=emoji optional\n  // เรียง A1→A2 ตาม CEFR เสมอ ห้ามสุ่ม\n];\n\nconst SS = [\n  \"Leo sees a big cat.\",  // Step 3 speak-along — 4-6 full story sentences\n];\n\nconst DS = [\n  \"Leo sees a big cat.\",   // Step 4 — exactly 3 sentences, easy→harder\n  \"The dog runs fast.\",\n  \"She has a small fish.\",\n];\n\nconst STORY = `Full story text...`;  // Steps 1 & 2 TTS\n\nconst STEPS = ['Cover','Step 1','Step 2','Step 3','Step 4','Step 5'];\n```\n\n---\n\n## Score System\n\n| Step | Points | How |\n|------|--------|-----|\n| Step 1 | 1 pt | `updScore(1)` เมื่อ story จบ |\n| Step 2 | 0–2 pt | `updScore(sc, 6)` หลัง recording |\n| Step 3 | 0–2 pt | `updScore(sc, 6)` หลัง `checkSummary3()` |\n| Step 4 | 0–1 pt | `step4Score` ใน `checkS4()` |\n| Step 5 | 0–1 pt | `step5Score` เมื่อ game จบ |\n\n| Group | Days | updScore signature |\n|-------|------|-------------------|\n| Orange | 1–21 | `updScore(n)` |\n| Blue | 22–30 | `updScore(sc, tot)` tot=6 |\n\n---\n\n## Theme Colors by Week\n\n| Week | Days | BG | Primary | Accent |\n|------|------|----|---------|--------|\n| 1 Animals | 1–7 | `#FFF3E0` | `#E65100` | `#FFE082` |\n| 2 Food | 8–14 | `#FFF3E0` | `#E65100` | `#FFE082` |\n| 3 Home | 15–21 | `#FBE9E7` | `#E65100` | `#FFCC80` |\n| 4 School | 22–28 | `#E3F2FD` | `#1565C0` | `#90CAF9` |\n| 5+ | 29–30+ | `#E3F2FD` | `#1565C0` | `#90CAF9` |\n\n`.s4w` border color = week's Accent color.\n\n---\n\n## Step 4: Listen + Arrange (ALL days)\n\n```html\n<div class=\"page\" id=\"p4\">\n  <div class=\"step-label\">Step 4 · Listen + Write ✏️</div>\n  <p class=\"step-sub\">กด ▶ ฟัง → กดคำเรียงประโยค!</p>\n  <div id=\"s4area\"></div>\n  <div style=\"margin-top:10px;display:flex;gap:8px\">\n    <button class=\"btn btn-p\" onclick=\"checkS4()\">Check ✓</button>\n    <button class=\"btn btn-o\" onclick=\"buildS4()\">Reset 🔄</button>\n  </div>\n  <div class=\"navrow\">\n    <button class=\"btn btn-o\" onclick=\"go(3)\">← Back</button>\n    <button class=\"btn btn-p\" onclick=\"go(5)\">Play Game! 🎮</button>\n  </div>\n</div>\n```\n\n---\n\n## Step 5 Game Implementations\n\n### WM — Word Match\n```html\n<div class=\"step-label\">Step 5 · Word Match 🎮</div>\n<div>⭐ <strong id=\"wmSc\">0</strong>/6 คู่ <div id=\"wmFill\"></div></div>\n<div class=\"wm-grid\">\n  <div class=\"wm-col\" id=\"wmEn\"></div>\n  <div class=\"wm-col\" id=\"wmTh\"></div>\n</div>\n<button onclick=\"buildWM()\">Reset 🔄</button>\n```\n```javascript\n// ใช้ w.e / w.t\nlet selE=null,selT=null,wmScore=0;\nfunction buildWM(){wmScore=0;selE=null;selT=null;\n  const sh=[...WORDS].sort(()=>Math.random()-.5);\n  const thSh=[...WORDS].sort(()=>Math.random()-.5);\n  document.getElementById('wmEn').innerHTML=sh.map(w=>\n    `<div class=\"wm-btn wm-en\" id=\"e_${w.e}\" onclick=\"pickE('${w.e}')\">${w.e}</div>`).join('');\n  document.getElementById('wmTh').innerHTML=thSh.map(w=>\n    `<div class=\"wm-btn wm-th\" id=\"t_${w.e}\" onclick=\"pickT('${w.e}')\">${w.t}</div>`).join('');\n}\nfunction pickE(k){if(document.getElementById('e_'+k).classList.contains('correct'))return;\n  document.querySelectorAll('#wmEn .wm-btn.selected').forEach(el=>el.classList.remove('selected'));\n  selE=k;document.getElementById('e_'+k).classList.add('selected');if(selT)checkWM();}\nfunction pickT(k){if(document.getElementById('t_'+k).classList.contains('correct'))return;\n  document.querySelectorAll('#wmTh .wm-btn.selected').forEach(el=>el.classList.remove('selected'));\n  selT=k;document.getElementById('t_'+k).classList.add('selected');if(selE)checkWM();}\nfunction checkWM(){\n  const eEl=document.getElementById('e_'+selE),tEl=document.getElementById('t_'+selT);\n  if(selE===selT){eEl.classList.add('correct');tEl.classList.add('correct');wmScore++;\n    document.getElementById('wmSc').textContent=wmScore;\n    document.getElementById('wmFill').style.width=Math.round(wmScore/WORDS.length*100)+'%';\n    if(wmScore>=WORDS.length)setTimeout(showCompletion,400);\n  }else{eEl.classList.add('wrong');tEl.classList.add('wrong');\n    setTimeout(()=>{eEl.classList.remove('selected','wrong');tEl.classList.remove('selected','wrong');},600);}\n  selE=null;selT=null;\n}\n```\n\n### FC — Flashcard Multiple Choice\n```html\n<div class=\"step-label\">Step 5 · Flashcard Quiz 🃏</div>\n<div id=\"fcCard\" style=\"font-size:2em;text-align:center;padding:20px\"></div>\n<div id=\"fcOpts\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\"></div>\n<div id=\"fcResult\"></div>\n```\n```javascript\nlet fcIdx=0,fcScore=0,fcOrder=[];\nfunction buildFC(){fcOrder=[...WORDS].sort(()=>Math.random()-.5);fcIdx=0;fcScore=0;showFC();}\nfunction showFC(){\n  if(fcIdx>=fcOrder.length){showCompletion();return;}\n  const w=fcOrder[fcIdx];\n  document.getElementById('fcCard').textContent=w.e;\n  const opts=[w.t,...WORDS.filter(x=>x.e!==w.e).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.t)]\n    .sort(()=>Math.random()-.5);\n  document.getElementById('fcOpts').innerHTML=opts.map((o,i)=>\n    `<button class=\"btn\" onclick=\"answerFC(${i},'${o}')\" data-ans=\"${o}\">${o}</button>`).join('');\n}\nfunction answerFC(i,ans){\n  const w=fcOrder[fcIdx];\n  document.querySelectorAll('#fcOpts .btn').forEach(b=>{b.disabled=true;\n    if(b.dataset.ans===w.t)b.style.background='#C8E6C9';});\n  if(ans===w.t)fcScore++;\n  fcIdx++;setTimeout(showFC,700);\n}\n```\n\n### FB — Fill in the Blank\n```html\n<div class=\"step-label\">Step 5 · Fill in the Blank 🔤</div>\n<div id=\"fbArea\"></div>\n<button onclick=\"buildFB()\">Reset 🔄</button>\n```\n```javascript\n// ประโยคจาก DS มีช่องว่าง คลิกคำมาเติม\nlet fbScore=0,fbDone=[];\nfunction buildFB(){fbScore=0;fbDone=DS.map(()=>false);\n  document.getElementById('fbArea').innerHTML=DS.map((sent,i)=>{\n    const words=WORDS[i%WORDS.length];\n    const blank=sent.replace(words.e,'_____');\n    return `<div>${blank}<br>`\n      +WORDS.sort(()=>Math.random()-.5).map(w=>\n        `<button class=\"g5-ss-word\" onclick=\"fillFB(${i},'${w.e}','${words.e}')\">${w.e}</button>`).join('')\n      +`<span id=\"fbfb${i}\"></span></div>`;\n  }).join('<hr>');}\nfunction fillFB(si,chosen,correct){\n  if(fbDone[si])return;\n  const fb=document.getElementById('fbfb'+si);\n  if(chosen===correct){fb.textContent=' ✓';fb.style.color='green';fbDone[si]=true;fbScore++;\n    if(fbDone.every(Boolean))setTimeout(showCompletion,400);\n  }else{fb.textContent=' ✗';fb.style.color='red';}\n}\n```\n\n### TF — True or False\n```html\n<div class=\"step-label\">Step 5 · True or False ✅</div>\n<div id=\"tfArea\"></div>\n```\n```javascript\n// 6 statements based on STORY (3 true, 3 false)\nconst TF_STMTS=[\n  {s:'Leo is in the garden.',ans:true},\n  {s:'Mimi has a blue bag.',ans:false},\n  // ... 4 more\n];\nlet tfScore=0;\nfunction buildTF(){tfScore=0;\n  document.getElementById('tfArea').innerHTML=TF_STMTS.map((st,i)=>\n    `<div>${st.s}\n      <button onclick=\"answerTF(${i},true)\">✅ True</button>\n      <button onclick=\"answerTF(${i},false)\">❌ False</button>\n      <span id=\"tffb${i}\"></span>\n    </div>`).join('');}\nfunction answerTF(i,ans){\n  const st=TF_STMTS[i];\n  const fb=document.getElementById('tffb'+i);\n  if(ans===st.ans){fb.textContent=' ✓';fb.style.color='green';tfScore++;\n    if(tfScore>=TF_STMTS.length)setTimeout(showCompletion,400);\n  }else{fb.textContent=' ✗';fb.style.color='red';}\n  document.querySelectorAll(`[onclick=\"answerTF(${i},true)\"],[onclick=\"answerTF(${i},false)\"]`)\n    .forEach(b=>b.disabled=true);\n}\n```\n\n### WS — Word Scramble\n```html\n<div class=\"step-label\">Step 5 · Word Scramble 🔀</div>\n<div id=\"wsArea\"></div>\n<button onclick=\"buildWS()\">Reset 🔄</button>\n```\n```javascript\nfunction buildWS(){\n  document.getElementById('wsArea').innerHTML=WORDS.map((w,i)=>{\n    const sc=[...w.e].sort(()=>Math.random()-.5).join('');\n    return `<div>📝 ${sc} → <input id=\"wsi${i}\" style=\"width:80px\">\n      <button onclick=\"checkWS(${i},'${w.e}')\">✓</button>\n      <span id=\"wsfb${i}\"></span></div>`;\n  }).join('');}\nlet wsScore=0;\nfunction checkWS(i,ans){\n  const val=document.getElementById('wsi'+i).value.trim().toLowerCase();\n  const fb=document.getElementById('wsfb'+i);\n  if(val===ans){fb.textContent=' ✓';fb.style.color='green';wsScore++;\n    if(wsScore>=WORDS.length)setTimeout(showCompletion,400);\n  }else{fb.textContent=' ✗ ('+ans+')';fb.style.color='red';}\n}\n```\n\n### SB — Sentence Builder\n```html\n<div class=\"step-label\">Step 5 · Sentence Builder 🏗️</div>\n<div id=\"sbArea\"></div>\n<button onclick=\"buildSB()\">Reset 🔄</button>\n```\n```javascript\n// สับคำใน DS[0] ให้เรียงใหม่\nlet sbPicked=[],sbDone=false;\nfunction buildSB(){sbPicked=[];sbDone=false;\n  const sent=DS[0];const words=sent.replace(/[.,!?]/g,'').split(' ');\n  const sh=[...words].sort(()=>Math.random()-.5);\n  document.getElementById('sbArea').innerHTML=\n    '<div id=\"sbb\" style=\"min-height:36px;border:1.5px dashed #ccc;padding:8px;border-radius:8px;margin-bottom:8px\"></div>'\n    +'<div>'+sh.map((w,i)=>`<button class=\"g5-ss-word\" id=\"sbw${i}\" data-w=\"${w}\" data-tgt=\"${words.join(' ')}\" onclick=\"addSBW(${i})\">${w}</button>`).join('')+'</div>'\n    +'<div id=\"sbfb\"></div>';}\nfunction addSBW(i){\n  if(sbDone)return;\n  const btn=document.getElementById('sbw'+i);btn.classList.add('used');\n  sbPicked.push({w:btn.dataset.w,i});\n  const tgt=btn.dataset.tgt.split(' ');\n  document.getElementById('sbb').innerHTML=sbPicked.map(x=>x.w).join(' ');\n  if(sbPicked.length===tgt.length){\n    const ok=sbPicked.map(x=>x.w).join(' ')===tgt.join(' ');\n    document.getElementById('sbfb').textContent=ok?'✓ Correct! 🎉':'✗ ลองใหม่';\n    if(ok){sbDone=true;setTimeout(showCompletion,400);}\n    else{sbPicked=[];document.querySelectorAll('.g5-ss-word.used').forEach(b=>b.classList.remove('used'));\n      document.getElementById('sbb').innerHTML='';}\n  }\n}\n```\n\n### MF — Memory Flip (Week 3+)\nCSS เพิ่ม:\n```css\n.g5-mfc{background:#FFF3E0;border:2px solid #FFCC80;border-radius:10px;padding:10px 6px;\n  text-align:center;font-size:13px;font-weight:800;color:#E65100;cursor:pointer;\n  min-height:48px;display:flex;align-items:center;justify-content:center;\n  word-break:break-word;transition:background .2s}\n.g5-mfc:hover{background:#FFE0B2}\n```\n```html\n<div class=\"step-label\">Step 5 · Memory Flip 🃏</div>\n<p class=\"step-sub\">เปิดไพ่ 2 ใบที่เป็นคู่กัน EN ↔ TH!</p>\n<div>🃏 คู่: <strong id=\"mfsc\">0</strong>/<span id=\"mftotal\">6</span>\n  <div id=\"mfbar\" style=\"height:8px;background:#FFE0B2;border-radius:4px;overflow:hidden\">\n    <div id=\"mfbarfill\" style=\"height:100%;width:0%;background:#FF7043;transition:width .4s\"></div>\n  </div>\n  <span id=\"mfpct\">0%</span>\n</div>\n<div id=\"mfgrid\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:8px\"></div>\n<button class=\"btn btn-o\" onclick=\"buildMF()\">Reset 🔄</button>\n```\n```javascript\nlet mfFlipped=[],mfMatched=0,mfLock=false;\nfunction buildMF(){\n  mfFlipped=[];mfMatched=0;mfLock=false;\n  const cards=[];\n  WORDS.forEach((w,i)=>{\n    cards.push({txt:w.e,pair:i,type:'en'});  // ใช้ w.e / w.t เสมอ\n    cards.push({txt:w.t,pair:i,type:'th'});\n  });\n  cards.sort(()=>Math.random()-.5);\n  document.getElementById('mftotal').textContent=WORDS.length;\n  document.getElementById('mfgrid').innerHTML=cards.map((c,i)=>\n    `<div class=\"g5-mfc\" id=\"mf${i}\" data-pair=\"${c.pair}\" data-type=\"${c.type}\"\n     data-txt=\"${c.txt}\" onclick=\"flipMF(${i})\">?</div>`).join('');\n  document.getElementById('mfsc').textContent='0';\n  document.getElementById('mfbarfill').style.width='0%';\n  document.getElementById('mfpct').textContent='0%';\n}\nfunction flipMF(i){\n  const el=document.getElementById('mf'+i);\n  if(mfLock||el.dataset.done||mfFlipped.find(x=>x.i===i))return;\n  el.textContent=el.dataset.txt;el.style.background='#FFF9C4';el.style.borderColor='#F9A825';\n  mfFlipped.push({i,el,pair:+el.dataset.pair,type:el.dataset.type});\n  if(mfFlipped.length===2){\n    mfLock=true;\n    const[a,b]=mfFlipped;\n    if(a.pair===b.pair&&a.type!==b.type){\n      [a.el,b.el].forEach(e=>{e.style.background='#C8E6C9';e.style.borderColor='#43A047';e.dataset.done='1';});\n      mfMatched++;\n      const p=Math.round(mfMatched/WORDS.length*100);\n      document.getElementById('mfsc').textContent=mfMatched;\n      document.getElementById('mfbarfill').style.width=p+'%';\n      document.getElementById('mfpct').textContent=p+'%';\n      mfFlipped=[];mfLock=false;\n      if(mfMatched>=WORDS.length)setTimeout(showCompletion,400);\n    }else{\n      setTimeout(()=>{[a.el,b.el].forEach(e=>{e.textContent='?';e.style.background='';e.style.borderColor='';});\n        mfFlipped=[];mfLock=false;},900);\n    }\n  }\n}\n```\n\n### SS — Sentence Scramble (Week 3+)\nCSS เพิ่ม:\n```css\n.g5-ss-word{background:#fff;border:2px solid #FFCC80;border-radius:8px;padding:6px 12px;\n  font-size:13px;font-weight:800;color:#E65100;cursor:pointer;transition:all .2s}\n.g5-ss-word:hover{background:#FFF3E0}\n.g5-ss-word.used{opacity:.35;pointer-events:none}\n.g5-ss-bw{background:#FFF3E0;border:1.5px solid #FFCC80;border-radius:6px;padding:4px 10px;\n  font-size:13px;font-weight:800;color:#E65100;cursor:pointer;margin:2px}\n```\n```html\n<div class=\"step-label\">Step 5 · Sentence Scramble 🔀</div>\n<p class=\"step-sub\">กดคำตามลำดับที่ถูกต้อง!</p>\n<div id=\"ssarea\" style=\"display:flex;flex-direction:column;gap:10px\"></div>\n<button class=\"btn btn-o\" onclick=\"buildSS()\">Reset 🔄</button>\n```\n```javascript\nconst SS_SENTS=DS.slice(0,3);  // ใช้ DS (3 ประโยค)\nlet ssBuilt=[],ssDone=[];\nfunction buildSS(){\n  ssBuilt=SS_SENTS.map(()=>[]);ssDone=SS_SENTS.map(()=>false);\n  document.getElementById('ssarea').innerHTML=SS_SENTS.map((sent,i)=>{\n    const cl=sent.replace(/[.,!?:]/g,'');\n    const ws=cl.split(/\\s+/).filter(Boolean);\n    const sh=[...ws].sort(()=>Math.random()-.5);\n    return '<div style=\"background:#FFF3E0;border-radius:10px;padding:10px 12px;border:1.5px solid #FFCC80\">'\n      +'<div style=\"font-size:12px;color:#888;margin-bottom:6px\">ประโยค '+(i+1)+':</div>'\n      +'<div id=\"ssb'+i+'\" style=\"min-height:36px;background:#fff;border-radius:8px;padding:8px;'\n      +'border:1.5px dashed #FFCC80;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px\"></div>'\n      +'<div id=\"ssk'+i+'\" style=\"display:flex;flex-wrap:wrap;gap:6px\">'\n      +sh.map((w,j)=>'<button class=\"g5-ss-word\" id=\"ssw'+i+'_'+j+'\" data-w=\"'+w\n        +'\" data-tgt=\"'+ws.join(' ')+'\" onclick=\"addSSW('+i+','+j+')\">'+w+'</button>').join('')\n      +'</div><div class=\"fb\" id=\"ssfb'+i+'\"></div></div>';\n  }).join('');\n}\nfunction addSSW(si,wi){\n  if(ssDone[si])return;\n  const btn=document.getElementById('ssw'+si+'_'+wi);\n  const w=btn.dataset.w;btn.classList.add('used');ssBuilt[si].push({w,wi});\n  const bEl=document.getElementById('ssb'+si);\n  const sp=document.createElement('button');sp.className='g5-ss-bw';sp.textContent=w;\n  sp.onclick=()=>remSSW(si,wi,sp);bEl.appendChild(sp);\n  const tgt=btn.dataset.tgt.split(' ');\n  if(ssBuilt[si].length===tgt.length){\n    const ok=ssBuilt[si].map(x=>x.w).join(' ').toLowerCase()===tgt.join(' ').toLowerCase();\n    const fbEl=document.getElementById('ssfb'+si);\n    if(ok){fbEl.textContent='✓ Correct! 🎉';fbEl.className='fb ok';ssDone[si]=true;\n      if(ssDone.every(Boolean))setTimeout(showCompletion,400);\n    }else{fbEl.textContent='✗ ลองใหม่ — กดคำเพื่อเอาออก';fbEl.className='fb err';}\n  }\n}\nfunction remSSW(si,wi,sp){\n  if(ssDone[si])return;\n  ssBuilt[si]=ssBuilt[si].filter(x=>x.wi!==wi);sp.remove();\n  document.getElementById('ssw'+si+'_'+wi)?.classList.remove('used');\n  document.getElementById('ssfb'+si).textContent='';\n  document.getElementById('ssfb'+si).className='fb';\n}\n```\n\n---\n\n## Lock System\n\n```javascript\nconst LOCK_KEY = 'wla_d[N]';   // e.g. 'wla_d16'\nconst PREV_KEY = 'wla_d[N-1]'; // e.g. 'wla_d15'\n\nfunction checkLock(){\n  if(localStorage.getItem('wla_admin')==='1'){unlockContent();return;}\n  const done=localStorage.getItem(LOCK_KEY);\n  if(done){\n    document.getElementById('alreadyDone').classList.add('show');\n    document.getElementById('savedCode').textContent=done;\n  }\n  if(localStorage.getItem(PREV_KEY)){unlockContent();}\n  else{showLocked();}\n}\n// Input field: id=\"codeInput\" (ห้ามใช้ \"lockInput\")\n```\n\n---\n\n## DOMContentLoaded — required call order\n\n```javascript\nwindow.addEventListener('DOMContentLoaded', () => {\n  checkLock();\n  buildDots();          // navigation dots\n  loadV();              // TTS voices\n  buildCards('cvA');    // word cards Cover — id=\"cvA\" เสมอ (ห้ามใช้ 'acgrid')\n  buildS4();            // Step 4\n  buildMF();            // ← แทนด้วย game function ที่ใช้จริง (buildWM/buildFC/buildFB/buildTF/buildWS/buildSS)\n  buildSL();            // Step 3 mic — เรียกสุดท้ายเสมอ\n});\n```\n\n---\n\n## ⚠️ Known Bugs — ตรวจก่อน save ทุกครั้ง\n\n| # | อาการ | สาเหตุ | วิธีแก้ |\n|---|-------|---------|---------|\n| 1 | Step 3 ไม่มีปุ่ม mic | `buildSL()` ไม่ถูกเรียก | เพิ่มใน DOMContentLoaded |\n| 2 | Step 4 ว่างเปล่า | `buildS4()` ไม่ถูกเรียก | เพิ่มใน DOMContentLoaded |\n| 3 | Step 5 ไม่มีเกม | game function ไม่ถูกเรียก | ตรวจชื่อให้ตรงกับ game จริง |\n| 4 | Cover cards ไม่ขึ้น | `buildCards('acgrid')` ผิด | แก้เป็น `buildCards('cvA')` |\n| 5 | Lock form error | `getElementById('lockInput')` | แก้เป็น `getElementById('codeInput')` |\n| 6 | JS crash ทั้งหน้า | เรียก `buildDL()` แต่ไม่ได้ define | ลบออกจาก DOMContentLoaded |\n| 7 | `syncToCloud` error | `wmScore` ไม่ได้ define (เปลี่ยน game แล้ว) | แทนด้วย score variable ที่ตรงกับ game |\n| 8 | Step 5 ซ้ำกับ Day[N-1] | ไม่ได้ตรวจ | ดู Pre-Build Verification ด้านบน |\n| 9 | Memory Flip ไม่แสดงคำ | ใช้ `w.en`/`w.th` แทน `w.e`/`w.t` | WORDS ทุก Day ใช้ `{e, t, ph}` format |\n| 10 | Step 4 DS ว่าง | `DS` array ไม่ได้ define | ตรวจว่า DS มีครบ 3 ประโยค |\n\n---\n\n## Completion Screen\n\n```html\n<div class=\"complete-screen\" id=\"completeScreen\">\n  <div class=\"complete-content\">\n    <div style=\"font-size:2.5em\">🎉</div>\n    <h2>Day [N] Complete!</h2>\n    <p>Your code: <strong id=\"codeDisplay\"></strong></p>\n    <div id=\"daySummary\"></div>\n    <button onclick=\"copyCode()\">📋 Copy Code</button>\n    <a href=\"Day[N+1]_[Title].html\">\n      <button class=\"btn btn-p\">Next Day →</button>\n    </a>\n  </div>\n</div>\n```\n\n`showCompletion()` → `generateCode(DAY)` → `buildDaySummary()` → save localStorage  \n**ทุก game ต้อง call `showCompletion()` โดยตรง** — ไม่จำเป็นต้อง define `checkGameComplete()`\n\n---\n\n## TTS (required)\n\n```javascript\nlet allV=[],curV=null;\nfunction loadV(){/* filter en-US voices */}\nfunction speak(t,cb){/* SpeechSynthesisUtterance with curV + rate from #rsl */}\nfunction stopAll(){window.speechSynthesis.cancel();}\nwindow.speechSynthesis.onvoiceschanged=loadV;\nsetTimeout(loadV,300);setTimeout(loadV,800);setTimeout(loadV,2000);\n```\n\n---\n\n## How to generate a new Day file\n\n1. **รับจาก user**: Day N, story title, WORDS (6–8), STORY, SS (4–6), DS (3 easy→hard)\n2. **Pre-Build**: ตรวจ game Day[N-1] + architecture (≥5 pages) + LOCK_KEY\n3. **เลือก game**: ดูตาราง per-day → ต้องไม่ซ้ำ Day[N-1]\n4. **group**: N ≤ 21 = orange → `updScore(n)` | N ≥ 22 = blue → `updScore(sc,6)`\n5. **template**: Day 15 (orange) หรือ Day 22 (blue) เป็นต้นแบบ\n6. **แทนค่า**: WORDS, SS, DS, STORY, LOCK_KEY, PREV_KEY, DAY, title, emoji, next file link\n7. **แทน Step 5**: ลบ game เดิม ใส่ implementation ใหม่จากด้านบน\n8. **ตรวจ DOMContentLoaded**: `buildCards('cvA')`, `buildS4()`, game fn, `buildSL()` ครบ\n9. **Filename**: `Day[N]_[StoryTitle]_A1.html`\n\n---\n\n## Quality Checklist (ก่อน save ทุกครั้ง)\n\n- [ ] **Pre-build**: ตรวจ game Day[N-1] → วันนี้ใช้ game ที่ต่างออกไป ✓\n- [ ] `WORDS` เรียง A1→A2, ทุก item มี `{e, t, ph}` ✓\n- [ ] `DS` มีครบ 3 ประโยค, เรียง easy→harder ✓\n- [ ] `LOCK_KEY='wla_d[N]'`, `PREV_KEY='wla_d[N-1]'` ถูกต้อง ✓\n- [ ] Pages p0–p5 + `.complete-screen` ครบ (Review day: p0–p4 เท่านั้น) ✓\n- [ ] Score bar: `#totalSc`, `#sfill`, `#starDisp` มีใน HTML ✓\n- [ ] DOMContentLoaded: `buildCards('cvA')`, `buildS4()`, game fn, `buildSL()` ครบ ✓\n- [ ] `id=\"codeInput\"` (ไม่ใช่ `lockInput`) ในล็อกฟอร์ม ✓\n- [ ] `syncToCloud()` ใช้ score variable ที่ตรงกับ game ปัจจุบัน ✓\n- [ ] Step 5 game label + HTML + JS ตรงกัน, `showCompletion()` ถูกเรียกเมื่อจบ ✓\n- [ ] Font: `Nunito` load จาก Google Fonts ✓\n- [ ] Story ไม่ละเมิดลิขสิทธิ์ (original characters only) ✓\n"}, "groups": [{"t": "🚀 เริ่มต้น / ติดตั้ง", "k": ["AUTO_SETUP", "SETUP_NEW_SHEET", "DEPLOY_NOW", "DEPLOY_v5", "SLIP_AND_LOGIN_SETUP", "CLOUDFLARE_MIGRATION"]}, {"t": "🔐 ความปลอดภัย / แอดมิน", "k": ["SECURITY_FIX", "MASTER_ADMIN", "ADMIN_LINKS", "ALL_LINKS", "TEACHER_PANEL", "WATERMARK_AND_PROTECTION", "DATA_PERSISTENCE"]}, {"t": "🧪 ผลตรวจ / คุณภาพ", "k": ["AUDIT_ALL_LEVELS", "AUDIT_REPORT", "UX_REVIEW", "LAUNCH_READINESS"]}, {"t": "📣 เปิดตัว / การตลาด", "k": ["LAUNCH_PLAN", "brand"]}, {"t": "📚 เนื้อหา / การผลิต", "k": ["Day_Blueprint", "IMAGE_PIPELINE", "Level2_Plan_Day31-60", "Level4_Plan_Day91-120", "generate-review-day-SKILL", "standard-day-pattern_SKILL_updated"]}]};

/* ── ตัวแปลง Markdown เล็ก ๆ (ไม่ต้องโหลดไลบรารีจากเน็ต) ── */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, (m,a)=>'<code>'+a+'</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}

function md(src){
  const L = src.replace(/\r/g,'').split('\n');
  let out = [], i = 0;
  while (i < L.length){
    let l = L[i];

    if (/^```/.test(l)){                       // โค้ดบล็อก
      let buf = []; i++;
      while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++;
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1]||'')){   // ตาราง
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = cells(l); i += 2;
      let rows = [];
      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(cells(L[i++]));
      out.push('<table><thead><tr>' + head.map(c=>'<th>'+inline(c)+'</th>').join('') +
        '</tr></thead><tbody>' +
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('') +
        '</tbody></table>');
      continue;
    }
    if (/^#{1,6}\s/.test(l)){                  // หัวข้อ
      const n = l.match(/^#+/)[0].length;
      out.push('<h'+n+'>' + inline(l.replace(/^#+\s*/,'')) + '</h'+n+'>'); i++; continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if (/^>\s?/.test(l)){                      // อ้างอิง
      let buf = [];
      while (i < L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/,''));
      out.push('<blockquote>' + md(buf.join('\n')) + '</blockquote>'); continue;
    }
    if (/^\s*([-*+]|\d+\.)\s/.test(l)){        // รายการ
      const ord = /^\s*\d+\./.test(l);
      let buf = [];
      while (i < L.length && /^\s*([-*+]|\d+\.)\s/.test(L[i]))
        buf.push(L[i++].replace(/^\s*([-*+]|\d+\.)\s/,''));
      out.push('<'+(ord?'ol':'ul')+'>' + buf.map(x=>'<li>'+inline(x)+'</li>').join('') +
               '</'+(ord?'ol':'ul')+'>');
      continue;
    }
    if (!l.trim()){ i++; continue; }
    let buf = [];                              // ย่อหน้า
    while (i < L.length && L[i].trim() && !/^(#{1,6}\s|```|>|\s*([-*+]|\d+\.)\s|\s*\|)/.test(L[i]))
      buf.push(L[i++]);
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}

/* ── เมนู ── */
const nav = document.getElementById('nav');
function buildNav(filter){
  let h = '';
  for (const g of D.groups){
    const items = g.k.filter(k => !filter ||
      k.toLowerCase().includes(filter) || D.docs[k].toLowerCase().includes(filter));
    if (!items.length) continue;
    h += '<div class="g">' + g.t + '</div>';
    for (const k of items)
      h += '<a href="#'+encodeURIComponent(k)+'" data-k="'+k+'">'+k.replace(/_/g,' ')+'</a>';
  }
  nav.innerHTML = h || '<div class="g">ไม่พบเอกสารที่ค้นหา</div>';
}

function show(k){
  if (!D.docs[k]) return;
  document.getElementById('doc').innerHTML = md(D.docs[k]);
  document.querySelectorAll('#side a').forEach(a =>
    a.classList.toggle('on', a.dataset.k === k));
  document.getElementById('main').scrollTop = 0;
  window.scrollTo(0,0);
}

addEventListener('hashchange', () => show(decodeURIComponent(location.hash.slice(1))));
document.getElementById('q').addEventListener('input', e => buildNav(e.target.value.trim().toLowerCase()));

buildNav('');
const first = location.hash ? decodeURIComponent(location.hash.slice(1)) : D.groups[0].k[0];
show(D.docs[first] ? first : D.groups[0].k[0]);
</script>
